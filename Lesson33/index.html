<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 33, "ja": "ましょうか", "ko": "~할까요? (ましょうか)", "en": "shall I ~; used to offer help to the listener", "part": "부탁·권유·허가·금지", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">~할까요? (제가 ~해 드릴까요?, 우리 ~할까요?)<\/div><div class=\"d\">상대에게 도움을 제안하거나 '~할까요?'라고 물을 때 쓰는 「ましょうか」.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>앞에 오는 말<\/th><th>붙이는 형태<\/th><\/tr><\/thead><tbody><tr><td>동사 ます형<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"開け + ましょうか\" title=\"눌러서 듣기\">開け + ましょうか (열까요?)<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>핵심 정리<\/h3><p><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ましょうか\" title=\"눌러서 듣기\">「ましょうか」<\/span>는 '제가 ~해 드릴까요?'라고 <b>상대에게 도움을 제안<\/b>하거나, '우리 ~할까요?'라고 <b>의견을 물을<\/b> 때 써요.<\/p><ul class=\"rules\"><li>手伝いましょうか → 도와드릴까요?<\/li><li>끝의 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"か\" title=\"눌러서 듣기\">「か」<\/span>를 빼면 '~합시다'라는 뜻이 돼요. <a class=\"xref\" href=\"../Lesson32/\">32과 →<\/a><\/li><\/ul><div class=\"note warn\"><b class=\"lab\">참고<\/b>말하는 사람이 행동하는 경우에는 '~해 드릴까요?', 둘이 함께하는 경우에는 '~할까요?'로 해석돼요.<\/div><h3>예문 8개<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"窓を開けましょうか。\" title=\"눌러서 듣기\"><ruby>窓<rt>まど<\/rt><\/ruby>を<ruby>開<rt>あ<\/rt><\/ruby>け<b>ましょうか<\/b>。<\/span><span class=\"rom\">mado o akemashou ka<\/span><\/div><\/div><span class=\"k kor\">창문을 열까요?<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"手伝いましょうか。\" title=\"눌러서 듣기\"><ruby>手伝<rt>てつだ<\/rt><\/ruby>い<b>ましょうか<\/b>。<\/span><span class=\"rom\">tetsudaimashou ka<\/span><\/div><\/div><span class=\"k kor\">도와드릴까요?<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabind
