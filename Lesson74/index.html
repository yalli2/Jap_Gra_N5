<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 74, "ja": "つもり", "ko": "~할 생각이다 (つもり)", "en": "plan to ~; intend to ~", "part": "존재·희망·의지", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">~할 생각이다, ~할 작정이다<\/div><div class=\"d\">앞으로의 계획이나 의도를 말할 때 쓰는 「つもり」.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>앞에 오는 말<\/th><th>붙이는 형태<\/th><\/tr><\/thead><tbody><tr><td>동사 사전형<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"行く + つもりだ / つもりです\" title=\"눌러서 듣기\">行く + つもりだ / つもりです<\/span><\/td><\/tr><tr><td>동사 ない형<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"行かない + つもりだ\" title=\"눌러서 듣기\">行かない + つもりだ<\/span><\/td><\/tr><tr><td>의도 없음<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"つもりはない / つもりはありません\" title=\"눌러서 듣기\">つもりはない / つもりはありません<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>핵심 정리<\/h3><p><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"つもり\" title=\"눌러서 듣기\">「つもり」<\/span>는 '~할 생각이다'라는 <b>의도·계획<\/b>을 나타내요.<\/p><ul class=\"rules\"><li>行く<b>つもり<\/b>だ / です (갈 생각이다 / 갈 생각입니다)<\/li><li>하지 않을 생각: 行かない<b>つもり<\/b>だ 또는 行く<b>つもりはない<\/b><\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"今夜カラオケへ行くつもりだ。\" title=\"눌러서 듣기\"><ruby>今夜<rt>こんや<\/rt><\/ruby>カラオケへ<ruby>行<rt>い<\/rt><\/ruby>く<b>つもり<\/b>だ。<\/span><span class=\"rom\">konya karaoke e iku tsumori da<\/span><\/div><\/div><span class=\"k kor\">오늘 밤 노래방에 갈 생각이다.<\/span><\/li><\/ul><ul class=\"rules\"><li>과거형 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"つもりはなかった\" title=\"눌러서 듣기\">「つもりはなかった」<\/span>는 '그럴 생각은 아니었다'라는 변명에 자주 써요. (예문 7번)<\/li><\/ul><div class=\"note warn\"><b class=\"lab\">참고<\/b>단순한 예정은 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"予定\" title=\"눌러서 듣기\">「予定」<\/span>, 희망('~하고 싶다')은 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"たい\" title=\"눌러서 듣기\">「たい」<\/span><a class=\"xref\" href=\"../Lesson63/\">63과 →<\/a>이고, <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"つもり\" title=\"눌러서 듣기\">「つもり」<\/span>는 그보다 더 확고한 계획이에요.<\/div><h3>예문 8개<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"今日はラーメンを食べるつもりだ。\" title=\"눌러서 듣기\"><ruby>今日<rt>きょう<\/rt><\/ruby>はラーメンを<ruby>食<rt>た<\/rt><\/ruby>べる<b>つもり<\/b>だ。<\/span><span class=\"rom\">kyou wa raamen o taberu tsumori da<\/span><\/div><\/div><span class=\"k kor\">오늘은 라멘을 먹을 생각이다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"あなたたちも行くつもりですか?\" title=\"눌러서 듣기\">あなたたちも<ruby>行<rt>い<\/rt><\/ruby>く<b>つもり<\/b>ですか?<\/span><span class=\"rom\">anatatachi mo iku tsumori desu ka?<\/span><\/div><\/div><span class=\"k kor\">당신들도 갈 생각입니까?<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"大学に入って日本語を勉強するつもりです。\" title=\"눌러서 듣기\"><ruby>大学<rt>だいがく<\/rt><\/ruby>に<ruby>入<rt>はい<\/rt><\/ruby>って<ruby>日本語<rt>にほんご<\/rt><\/ruby>を<ruby>勉強<rt>べんきょう<\/rt><\/ruby>する<b>つもり<\/b>です。<\/span><span class=\"rom\">daigaku ni haite nihongo o benkyou suru tsumori desu<\/span><\/div><\/div><span class=\"k kor\">대학에 들어가서 일본어를 공부할 생각입니다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"何度聞かれても、あなたに教えるつもりはありません。\" title=\"눌러서 듣기\"><ruby>何度<rt>なんど<\/rt><\/ruby><ruby>聞<rt>き<\/rt><\/ruby>かれても、あなたに<ruby>教<rt>おし<\/rt><\/ruby>える<b>つもり<\/b>はありません。<\/span><span class=\"rom\">nando kikarete mo anata ni oshieru tsumori wa arimasen<\/span><\/div><\/div><span class=\"k kor\">몇 번을 물어봐도 당신에게 알려 줄 생각은 없습니다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"いつ日本に留学するつもりなの?\" title=\"눌러서 듣기\">いつ<ruby>日本<rt>にほん<\/rt><\/ruby>に<ruby>留学<rt>りゅうがく<\/rt><\/ruby>する<b>つもり<\/b>なの?<\/span><span class=\"rom\">itsu nihon ni ryuugaku suru tsumori na no?<\/span><\/div><\/div><span class=\"k kor\">언제 일본에 유학 갈 생각이야?<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"ばれたら、どうするつもり?\" title=\"눌러서 듣기\">ばれたら、どうする<b>つもり<\/b>?<\/span><span class=\"rom\">baretara dou suru tsumori?<\/span><\/div><\/div><span class=\"k kor\">들키면 어떻게 할 생각이야?<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"ごめんなさい!あなたを傷つけるつもりはなかったんです。\" title=\"눌러서 듣기\">ごめんなさい!あなたを<ruby>傷<rt>きず<\/rt><\/ruby>つける<b>つもり<\/b>はなかったんです。<\/span><span class=\"rom\">gomen nasai! anata o kizutsukeru tsumori wa nakata n desu<\/span><\/div><\/div><span class=\"k kor\">미안해요! 당신에게 상처를 줄 생각은 아니었어요.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"もしJLPTに受かったら日本の会社で働くつもりだ。\" title=\"눌러서 듣기\">もしJLPTに<ruby>受<rt>う<\/rt><\/ruby>かったら<ruby>日本<rt>にほん<\/rt><\/ruby>の<ruby>会社<rt>かいしゃ<\/rt><\/ruby>で<ruby>働<rt>はたら<\/rt><\/ruby>く<b>つもり<\/b>だ。<\/span><span class=\"rom\">moshi JLPT ni ukatara nihon no kaisha de hataraku tsumori da<\/span><\/div><\/div><span class=\"k kor\">만약 JLPT에 붙으면 일본 회사에서 일할 생각이다.<\/span><\/li><\/ul>", "ex": [{"title": "① 뜻 고르기", "short": "뜻 고르기", "instr": "일본어 문장을 보고 알맞은 한국어 뜻을 고르세요. (문장을 누르면 소리가 나요.)", "rule": "동사 사전형(ない형) + つもりだ(です) = '~할(~하지 않을) 생각이다'", "items": [{"t": "pick", "q": "<div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"今日はラーメンを食べるつもりだ。\" title=\"눌러서 듣기\"><ruby>今日<rt>きょう<\/rt><\/ruby>はラーメンを<ruby>食<rt>た<\/rt><\/ruby>べるつもりだ。<\/span><\/div><\/div>", "o": ["당신들도 갈 생각입니까?", "오늘 밤 노래방에 갈 생각이다.", "미안해요! 당신에게 상처를 줄 생각은 아니었어요.", "오늘은 라멘을 먹을 생각이다."], "a": "오늘은 라멘을 먹을 생각이다.", "why": "<span class=\"ja-i\" role=\"button\" tabindex=\"0\" data-say=\"今日はラーメンを食べるつもりだ。\" title=\"눌러서 듣기\"><
