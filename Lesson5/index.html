<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 5, "ja": "で", "ko": "~에서, ~로 (で)", "en": "in; at; on; by; with; via", "part": "조사", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">~에서, ~로, ~(으)로, ~해서 (장소·수단·원인 등)<\/div><div class=\"d\">행동이 일어나는 장소, 수단·방법, 합계, 이유를 나타내는 조사 「で」의 4가지 쓰임을 배워요.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>앞에 오는 말<\/th><th>붙이는 형태<\/th><\/tr><\/thead><tbody><tr><td>명사<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"学校 + で / 車 + で / 病気 + で\" title=\"눌러서 듣기\">学校 + で / 車 + で / 病気 + で<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>핵심 정리<\/h3><p><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"で\" title=\"눌러서 듣기\">「で」<\/span>는 문맥에 따라 뜻이 달라져요. 아래 4가지 쓰임을 구별해 보세요.<\/p><h3>① 행동이 일어나는 장소 — ~에서<\/h3><p>앞의 명사는 반드시 장소여야 해요.<\/p><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"学校で日本語を勉強する。\" title=\"눌러서 듣기\"><ruby>学校<rt>がっこう<\/rt><\/ruby><b>で<\/b><ruby>日本語<rt>にほんご<\/rt><\/ruby>を<ruby>勉強<rt>べんきょう<\/rt><\/ruby>する。<\/span><span class=\"rom\">gakkou de nihongo o benkyou suru<\/span><\/div><\/div><span class=\"k kor\">학교에서 일본어를 공부한다.<\/span><\/li><\/ul><h3>② 수단·방법 — ~로, ~(으)로<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"車で行く。\" title=\"눌러서 듣기\"><ruby>車<rt>くるま<\/rt><\/ruby><b>で<\/b><ruby>行<rt>い<\/rt><\/ruby>く。<\/span><span class=\"rom\">kuruma de iku<\/span><\/div><\/div><span class=\"k kor\">차로 간다.<\/span><\/li><\/ul><h3>③ 합계(총량) — ~에, ~만에<\/h3><p>시간·돈 등의 전체 양을 나타내요.<\/p><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"1時間で終わります。\" title=\"눌러서 듣기\">1<ruby>時間<rt>じかん<\/rt><\/ruby><b>で<\/b><ruby>終<rt>お<\/rt><\/ruby>わります。<\/span><span class=\"rom\">1 jikan de owarimasu<\/span><\/div><\/div><span class=\"k kor\">1시간 만에 끝납니다.<\/span><\/li><\/ul><h3>④ 이유 — ~해서, ~때문에<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"病気で今日休みます。\" title=\"눌러서 듣기\"><ruby>病気<rt>びょうき<\/rt><\/ruby><b>で<\/b><ruby>今日<rt>きょう<\/rt><\/ruby><ruby>休<rt>やす<\/rt><\/ruby>みます。<\/span><span class=\"rom\">byouki de kyou yasumimasu<\/span><\/div><\/div><span class=\"k kor\">아파서 오늘 쉽니다.<\/span><\/li><\/ul><div class=\"note warn\"><b class=\"lab\">참고<\/b>이유를 나타내는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"で\" title=\"눌러서 듣기\">「で」<\/span>는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ので\" title=\"눌러서 듣기\">「ので」<\/span><a class=\"xref\" href=\"../Lesson57/\">57과 →<\/a>와 뜻이 아주 비슷해요. <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"に\" title=\"눌러서 듣기\">「に」<\/span><a class=\"xref\" href=\"../Lesson47/\">47과 →<\/a>는 '존재하는 장소·도착점'이라서 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"で\" title=\"눌러서 듣기\">「で」<\/span>(행동의 장소)와 구별해야 해요.<\/div><h3>예문 9개<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"じてんしゃで行きます。\" title=\"눌러서 듣기\">じてんしゃ<b>で<\/b><ruby>行<rt>い<\/rt><\/ruby>きます。<\/span><span class=\"rom\">jitensha de ikimasu<\/span><\/div><\/div><span class=\"k kor\">자전거로 갑니다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"みんなで行こう!\" title=\"눌러서 듣기\">みんな<b>で<\/b><ruby>行<rt>い<\/rt><\/ruby>こう!<\/span><span class=\"rom\">minna de ikou!<\/span><\/div><\/div><span class=\"k kor\">다 같이 갑시다!<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"たまに一人でカラオケに行きます。\" title=\"눌러서 듣기\">たまに<ruby>一人<rt>ひとり<\/rt><\/ruby><b>で<\/b>カラオケに<ruby>行<rt>い<\/rt><\/ruby>きます。<\/span><span class=\"rom\">tamani hitori de karaoke ni ikimasu<\/span><\/div><\/div><sp
