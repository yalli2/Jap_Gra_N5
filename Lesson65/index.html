<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 65, "ja": "てある", "ko": "~해 있다, ~해 두었다 (てある)", "en": "is/has been done (resulting state)", "part": "시간·상태·정도·비교", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">~해져 있다, ~해 두었다 (의도적 행동의 결과 상태)<\/div><div class=\"d\">누군가 의도적으로 한 일의 결과가 남아 있는 상태를 나타내는 「てある」.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>구분<\/th><th>형태<\/th><\/tr><\/thead><tbody><tr><td>현재<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"타동사 て형 + ある / あります\" title=\"눌러서 듣기\">타동사 て형 + ある / あります<\/span><\/td><\/tr><tr><td>과거<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"타동사 て형 + あった / ありました\" title=\"눌러서 듣기\">타동사 て형 + あった / ありました<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>핵심 정리<\/h3><p><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"てある\" title=\"눌러서 듣기\">「てある」<\/span>는 누군가가 <b>의도적으로<\/b> 한 행동의 <b>결과가 지금 눈에 보이는 상태<\/b>를 말해요.<\/p><h3><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"作った\" title=\"눌러서 듣기\">「作った」<\/span>와 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"作ってある\" title=\"눌러서 듣기\">「作ってある」<\/span>의 차이<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"明日の弁当はもう作った。\" title=\"눌러서 듣기\"><ruby>明日<rt>あした<\/rt><\/ruby>の<ruby>弁当<rt>べんとう<\/rt><\/ruby>はもう<ruby>作<rt>つく<\/rt><\/ruby>った。<\/span><span class=\"rom\">ashita no bentou wa mou tsukuta<\/span><\/div><\/div><span class=\"k kor\">내일 도시락은 이미 만들었다.<\/span><\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"明日の弁当はもう作ってある。\" title=\"눌러서 듣기\"><ruby>明日<rt>あした<\/rt><\/ruby>の<ruby>弁当<rt>べんとう<\/rt><\/ruby>はもう<ruby>作<rt>つく<\/rt><\/ruby>っ<b>てある<\/b>。<\/span><span class=\"rom\">ashita no bentou wa mou tsukute aru<\/span><\/div><\/div><span class=\"k kor\">내일 도시락은 이미 만들어 놓았다.<\/span><\/li><\/ul><ul class=\"rules\"><li><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"作った\" title=\"눌러서 듣기\">「作った」<\/span>는 단순히 '만들었다'는 사실만 전해요.<\/li><li><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"作ってある\" title=\"눌러서 듣기\">「作ってある」<\/span>는 '(미리) 만들어 놓았다'처럼 의도와 그 결과 상태(준비되어 있다)를 강조해요.<\/li><\/ul><h3>더 많은 예<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"ドアが開けてある。\" title=\"눌러서 듣기\">ドアが<ruby>開<rt>あ<\/rt><\/ruby>け<b>てある<\/b>。<\/span><span class=\"rom\">doa ga akete aru<\/span><\/div><\/div><span class=\"k kor\">문이 열려 있다. (누군가 일부러 열어 둠)<\/span><\/li><\/ul><ul class=\"rules\"><li><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ドアが開けてある\" title=\"눌러서 듣기\">「ドアが開けてある」<\/span> → 누가 문을 열어 놓아서 지금 열려 있다.<\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"保存してあったファイルが消えてしまった。\" title=\"눌러서 듣기\"><ruby>保存<rt>ほぞん<\/rt><\/ruby>し<b>てあった<\/b>ファイルが<ruby>消<rt>き<\/rt><\/ruby>えてしまった。<\/span><span class=\"rom\">hozon shite ata fuairu ga kiete shimata<\/span><\/div><\/div><span class=\"k kor\">저장해 둔 파일이 지워져 버렸다.<\/span><\/li><\/ul><h3>규칙<\/h3><ul class=\"rules\"><li>반드시 <b>타동사<\/b>(목적어를 취하는 동사)만 쓸 수 있어요.<\/li><li>형태: 대상 + (が/は/を) + 타동사 て형 + ある<\/li><\/ul><div class=\"note warn\"><b class=\"lab\">참고<\/b>자동사 + ている(예: ドアが開いている)는 '저절로 열려 있는 상태'를 뜻해요. <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ている\" title=\"눌러서 듣기\">「ている」<\/span><a class=\"xref\" href=\"../Lesson66/\">66과 →<\/a>와 비교해 보세요.<\/div><h3>예문 8개<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"ここには私の名前が書いてあります。\" title=\"눌러서 듣기\">ここには<ruby>私<rt>わたし<\/rt><\/ruby>の<ruby>名前<rt>なまえ<\/rt><\/ruby>が<ruby>書<rt>か<\/rt><\/ruby>い<b>てあります<\/b>。<\/span><span class=\"rom\">koko ni wa watashi no namae ga kaite arimasu<\/span><\/div><\/div><span class=\"k kor\">여기에는 제 이름이 쓰여 있습니다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"ドアがわざと開けてある。\" title=\"눌러서 듣기\">ドアがわざと<ruby>開<rt>あ<\/rt><\/ruby>け<b>てある<\/b>。<\/span><span class=\"rom\">doa ga wazato akete aru<\/span><\/div><\/div><span class=\"k kor\">문이 일부러 열려 있다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"宿題はもうやってあります。\" title=\"눌러서 듣기\"><ruby>宿題<rt>しゅくだい<\/rt><\/ruby>はもうやっ<b>てあります<\/b>。<\/span><span class=\"rom\">shukudai wa mou yate arimasu<\/span><\/div><\/div><span class=\"k kor\">숙제는 이미 해 두었습니다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"夜には学校の入り口が閉めてある。\" title=\"눌러서 듣기\"><ruby>夜<rt>よる<\/rt><\/ruby>には<ruby>学校<rt>がっこう<\/rt><\/ruby>の<ruby>入<rt>い<\/rt><\/ruby>り<ruby>口<rt>ぐち<\/rt><\/ruby>が<ruby>閉<rt>し<\/rt><\/ruby>め<b>てある<\/b>。<\/span><span class=\"rom\">yoru ni wa gakkou no iriguchi ga shimete aru<\/span><\/div><\/div><span class=\"k kor\">밤에는 학교 입구가 닫혀 있다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"ここに何て書いてあるの?\" title=\"눌러서 듣기\">ここに<ruby>何<rt>なん<\/rt><\/ruby>て<ruby>書<rt>か<\/rt><\/ruby>い<b>てある<\/b>の?<\/span><span class=\"rom\">koko ni nan te kaite aru no?<\/span><\/div><\/div><span class=\"k kor\">여기에 뭐라고 쓰여 있어?<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"料理が作ってあるから、今日は家で食べる。\" title=\"눌러서 듣기\"><ruby>料理<rt>りょうり<\/rt><\/ruby>が<ruby>作<rt>つく<\/rt><\/ruby>っ<b>てある<\/b>から、<ruby>今日<rt>きょう<\/rt><\/ruby>は<ruby>家<rt>いえ<\/rt><\/ruby>で<ruby>食<rt>た<\/rt><\/ruby>べる。<\/span><span class=\"rom\">ryouri ga tsukute aru kara kyou wa ie de taberu<\/span><\/div><\/div><span class=\"k kor\">요리가 만들어져 있으니까 오늘은 집에서 먹는다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span c
