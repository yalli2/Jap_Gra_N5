<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 66, "ja": "ている", "ko": "~하고 있다, ~해 있다 (ている)", "en": "ongoing action or current state", "part": "시간·상태·정도·비교", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 히라가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">~하고 있다, ~해 있다 (진행·계속·습관·상태)<\/div><div class=\"d\">동작의 진행뿐 아니라 계속·습관·상태까지 나타내는 「<span translate=\"no\">ている<\/span>」의 5가지 쓰임.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>구분<\/th><th>형태<\/th><\/tr><\/thead><tbody><tr><td>긍정 (반말 / 정중)<\/td><td><span class=\"jt\" translate=\"no\" role=\"button\" tabindex=\"0\" data-say=\"동사 て형 + いる / います\" title=\"눌러서 듣기\">동사 <span translate=\"no\">て<\/span>형 + <span translate=\"no\">いる<\/span> / <span translate=\"no\">います<\/span><\/span><\/td><\/tr><tr><td>부정 (반말 / 정중)<\/td><td><span class=\"jt\" translate=\"no\" role=\"button\" tabindex=\"0\" data-say=\"동사 て형 + いない / いません\" title=\"눌러서 듣기\">동사 <span translate=\"no\">て<\/span>형 + <span translate=\"no\">いない<\/span> / <span translate=\"no\">いません<\/span><\/span><\/td><\/tr><tr><td>회화체<\/td><td><span class=\"jt\" translate=\"no\" role=\"button\" tabindex=\"0\" data-say=\"ている → てる\" title=\"눌러서 듣기\"><span translate=\"no\">ている<\/span> → <span translate=\"no\">てる<\/span> (<span translate=\"no\">い<\/span> 생략)<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>핵심 정리<\/h3><p><span class=\"jt\" translate=\"no\" role=\"button\" tabindex=\"0\" data-say=\"ている\" title=\"눌러서 듣기\">「<span translate=\"no\">ている<\/span>」<\/span>는 동사 <span translate=\"no\">て<\/span>형에 <span class=\"jt\" translate=\"no\" role=\"button\" tabindex=\"0\" data-say=\"いる\" title=\"눌러서 듣기\">「<span translate=\"no\">いる<\/span>」<\/span>를 붙인 표현으로, 지금 일어나고 있는 일을 나타내는 <b>진행형<\/b>이에요. 그 밖에도 계속, 습관, 상태를 나타내는 등 쓰임이 다양해요.<\/p><ul class=\"rules\"><li><span translate=\"no\">見る<\/span> → <span translate=\"no\">見<\/span><b><span translate=\"no\">ている<\/span><\/b> (보고 있다)<\/li><li><span translate=\"no\">読む<\/span> → <span translate=\"no\">読ん<\/span><b><span translate=\"no\">でいる<\/span><\/b> (읽고 있다)<\/li><li>정중하게는 <span class=\"jt\" translate=\"no\" role=\"button\" tabindex=\"0\" data-say=\"ています\" title=\"눌러서 듣기\">「<span translate=\"no\">ています<\/span>」<\/span>, 부정은 <span class=\"jt\" translate=\"no\" role=\"button\" tabindex=\"0\" data-say=\"ていない/ていません\" title=\"눌러서 듣기\">「<span translate=\"no\">ていない<\/span> / <span translate=\"no\">ていません<\/span>」<\/span><\/li><\/ul><h3>뜻 ① 진행 — 지금 ~하고 있다<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" translate=\"no\" role=\"button\" tabindex=\"0\" data-say=\"昼ご飯を食べている。\" title=\"눌러서 듣기\"><ruby><span translate=\"no\">昼<\/span><rt><span translate=\"no\">ひる<\/span><\/rt><\/ruby><span translate=\"no\">ご<\/span><ruby><span translate=\"no\">飯<\/span><rt><span translate=\"no\">はん<\/span><\/rt><\/ruby><span translate=\"no\">を<\/span><ruby><span translate=\"no\">食<\/span><rt><span translate=\"no\">た<\/span><\/rt><\/ruby><span translate=\"no\">べ<\/span><b><span translate=\"no\">ている<\/span><\/b>。<\/span><span class=\"rom\" translate=\"no\">hirugohan o tabete iru<\/span><\/div><\/div><span class=\"k kor\">점심을 먹고 있다.<\/span><\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" translate=\"no\" role=\"button\" tabindex=\"0\" data-say=\"宿題をやっていない。\" title=\"눌러서 듣기\"><ruby><span translate=\"no\">宿題<\/span><rt><span translate=\"no\">しゅくだい<\/span><\/rt><\/ruby><span translate=\"no\">をやっ<\/span><b><span translate=\"no\">ていない<\/span><\/b>。<\/span><span class=\"rom\" translate=\"no\">shukudai o yate inai<\/span><\/div><\/div><span class=\"k kor\">숙제를 하고 있지 않다.<\/span><\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" translate=\"no\" role=\"button\" tabindex=\"0\" data-say=\"お母さんと電話をしています。\" title=\"눌러서 듣기\"><span translate=\"no\">お<\/span><ruby><span translate=\"no\">母<\/span><rt><span translate=\"no\">かあ<\/span><\/rt><\/ruby><span translate=\"no\">さんと<\/span><ruby><span translate=\"no\">電話<\/span><rt><span translate=\"no\">でんわ<\/span><\/rt><\/ruby><span translate=\"no\">をし<\/span><b><span translate=\"no\">ています<\/span><\/b>。<\/span><span class=\"rom\" translate=\"no\">okaasan to denwa o shite imasu<\/span><\/div><\/div><span class=\"k kor\">어머니와 통화하고 있습니다.<\/span><\/li><\/ul><h3>뜻 ② 계속 — 지금까지 계속 ~하고 있다<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" translate=\"no\" role=\"button\" tabindex=\"0\" data-say=\"先生の話を聞いているの?\" title=\"눌러서 듣기\"><ruby><span translate=\"no\">先生<\/span><rt><span translate=\"no\">せんせい<\/span><\/rt><\/ruby><span translate=\"no\">の<\/span><ruby><span translate=\"no\">話<\/span><rt><span translate=\"no\">はなし<\/span><\/rt><\/ruby><span translate=\"no\">を<\/span><ruby><span translate=\"no\">聞<\/span><rt><span translate=\"no\">き<\/span><\/rt><\/ruby><span translate=\"no\">い<\/span><b><span translate=\"no\">ている<\/span><\/b><span translate=\"no\">の<\/span>?<\/span><span class=\"rom\" translate=\"no\">sensei no hanashi o kiite iru no?<\/span><\/div><\/div><span class=\"k kor\">선생님 이야기를 듣고 있는 거야?<\/span><\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" translate=\"no\" role=\"button\" tabindex=\"0\" data-say=\"5年間日本語を勉強しています。\" title=\"눌러서 듣기\">5<ruby><span translate=\"no\">年間<\/span><rt><span translate=\"no\">ねんかん<\/span><\/rt><\/ruby><ruby><span translate=\"no\">日本語<\/span><rt><span translate=\"no\">にほんご<\/span><\/rt><\/ruby><span translate=\"no\">を<\/span><ruby><span translate=\"no\">勉強<\/span><rt><span translate=\"no\">べんきょう<\/span><\/rt><\/ruby><span translate=\"no\">し<\/span><b><span translate=\"no\">ています<\/span><\/b>。<\/span><span class=\"rom\" translate=\"no\">5 nenkan nihongo o benkyou shite imasu<\/span><\/div><\/div><span class=\"k kor\">5년 동안 일본어를 공부하고 있습니다.<\/span><\/li><\/ul><h3>뜻 ③ 현재의 상황 — 요즘 ~하고 있다<\/h3><p>지금 이 순간만이 아니라 '현재 하고 있는 일'을 말해요.<\/p><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" translate=\"no\" role=\"button\" tabindex=\"0\" data-say=\"面白い本を読んでいる。\" title=\"눌러서 듣기\"><ruby><span translate=\"no\">面白<\/span><rt><span translate=\"no\">おもしろ<\/span><\/rt><\/ruby><span translate=\"no\">い<\/span><ruby><span translate=\"no\">本<\/span><rt><span translate=\"no\">ほん<\/span><\/rt><\/ruby><span translate=\"no\">を<\/span><ruby><span translate=\"no\">読<\/span><rt><span translate=\"no\">よ<\/span><\/rt><\/ruby><span translate=\"no\">ん<\/span><b><span translate=\"no\">でいる<\/span><\/b>。<\/span><span class=\"rom\" translate=\"no\">omoshiroi hon o yonde iru<\/span><\/div><\/div><span class=\"k kor\">재미있는 책을 읽고 있다.<\/span><\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" translate=\"no\" role=\"button\" tabindex=\"0\" data-say=\"日本で日本語を勉強しています。\" title=\"눌러서 듣기\"><ruby><span translate=\"no\">日本<\/span><rt><span translate=\"no\">にほん<\/span><\/rt><\/ruby><span translate=\"no\">で<\/span><ruby><span translate=\"no\">日本語<\/span><rt><span translate=\"no\">にほんご<\/span><\/rt><\/ruby><span translate=\"no\">を<\/span><ruby><span translate=\"no\">勉強<\/span><rt><span translate=\"no\">べんきょう<\/span><\/rt><\/ruby><span translate=\"no\">し<\/span><b><span translate=\"no\">ています<\/span><\/b>。<\/span><span class=\"rom\" translate=\"no\">nihon de nihongo o benkyou shite imasu<\/span><\/div><\/div><span class=\"k kor\">일본에서 일본어를 공부하고 있습니다.<\/span><\/li><\/ul><h3>뜻 ④ 습관 — 자주 ~한다<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" translate=\"no\" role=\"button\" tabindex=\"0\" data-say=\"毎日、寝る前にマンガを読んでいる。\" title=\"눌러서 듣기\"><ruby><span translate=\"no\">毎日<\/span><rt><span translate=\"no\">まいにち<\/span><\/rt><\/ruby>、<ruby><span translate=\"no\">寝<\/span><rt><span translate=\"no\">ね<\/span><\/rt><\/ruby><span translate=\"no\">る<\/span><ruby><span translate=\"no\">前<\/span><rt><span translate=\"no\">まえ<\/span><\/rt><\/ruby><span translate=\"no\">にマンガを<\/span><ruby><span translate=\"no\">読<\/span><rt><span translate=\"no\">よ<\/span><\/rt><\/ruby><span translate=\"no\">ん<\/span><b><span translate=\"no\">でいる<\/span><\/b>。<\/span><span class=\"rom\" translate=\"no\">mainichi neru mae ni manga o yonde iru<\/span><\/div><\/div><span class=\"k kor\">매일 자기 전에 만화를 읽는다.<\/span><\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" translate=\"no\" role=\"button\" tabindex=\"0\" data-say=\"いつも自転車で通勤している。\" title=\"눌러서 듣기\"><span translate=\"no\">いつも<\/span><ruby><span translate=\"no\">自転車<\/span><rt><span translate=\"no\">じてんしゃ<\/span><\/rt><\/ruby><span translate=\"no\">で<\/span><ruby><span translate=\"no\">通勤<\/span><rt><span translate=\"no\">つうきん<\/span><\/rt><\/ruby><span translate=\"no\">し<\/span><b><span translate=\"no\">ている<\/span><\/b>。<\/span><span class=\"rom\" translate=\"no\">itsumo jitensha de tsuukin shite iru<\/span><\/div><\/div><span class=\"k kor\">항상 자전거로 출퇴근한다.<\/span><\/li><\/ul><h3>뜻 ⑤ 상태 — ~해 있다, ~한 상태이다<\/h3><p>어떤 사물이나 사람의 현재 상태, 모습을 나타내요.<\/p><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" translate=\"no\" role=\"button\" tabindex=\"0\" data-say=\"彼はお父さんと似ている。\" title=\"눌러서 듣기\"><ruby><span translate=\"no\">彼<\/span><rt><span translate=\"no\">かれ<\/span><\/rt><\/ruby><span translate=\"no\">はお<\/span><ruby><span translate=\"no\">父<\/span><rt><span translate=\"no\">とう<\/span><\/rt><\/ruby><span translate=\"no\">さんと<\/span><ruby><span translate=\"no\">似<\/span><rt><span translate=\"no\">に<\/span><\/rt><\/ruby><b><span translate=\"no\">ている<\/span><\/b>。<\/span><span class=\"rom\" translate=\"no\">kare wa otousan to nite iru<\/span><\/div><\/div><span class=\"k kor\">그는 아버지를 닮았다.<\/span><\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" translate=\"no\" role=\"button\" tabindex=\"0\" data-say=\"ドアが開いている。\" title=\"눌러서 듣기\"><span translate=\"no\">ドアが<\/span><ruby><span translate=\"no\">開<\/span><rt><span translate=\"no\">あ<\/span><\/rt><\/ruby><span translate=\"no\">い<\/span><b><span translate=\"no\">ている<\/span><\/b>。<\/span><span class=\"rom\" translate=\"no\">doa ga aite iru<\/span><\/div><\/div><span class=\"k kor\">문이 열려 있다.<\/span><\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" translate=\"no\" role=\"button\" tabindex=\"0\" data-say=\"今日は食堂がとても混んでいる。\" title=\"눌러서 듣기\"><ruby><span translate=\"no\">今日<\/span><rt><span translate=\"no\">きょう<\/span><\/rt><\/ruby><span translate=\"no\">は<\/span><ruby><span translate=\"no\">食堂<\/span><rt><span translate=\"no\">しょくどう<\/span><\/rt><\/ruby><span translate=\"no\">がとても<\/span><ruby><span translate=\"no\">混<\/span><rt><span translate=\"no\">こ<\/span><\/rt><\/ruby><span translate=\"no\">ん<\/span><b><span translate=\"no\">でいる<\/span><\/b>。<\/span><span class=\"rom\" translate=\"no\">kyou wa shokudou ga totemo konde iru<\/span><\/div><\/div><span class=\"k kor\">오늘은 식당이 매우 붐빈다.<\/span><\/li><\/ul><div class=\"note warn\"><b class=\"lab\">참고<\/b>회화에서는 <span class=\"jt\" translate=\"no\" role=\"button\" tabindex=\"0\" data-say=\"い\" title=\"눌러서 듣기\">「<span translate=\"no\">い<\/span>」<\/span>를 빼고 <span class=\"jt\" translate=\"no\" role=\"button\" tabindex=\"0\" data-say=\"てる\" title=\"눌러서 듣기\">「<span translate=\"no\">てる<\/span>」<\/span>라고 많이 말해요. (<span translate=\"no\">食べてる<\/span>、<span translate=\"no\">読んでる<\/span>) 편한 말투에서만 써요.<\/div><div class=\"note warn\"><b class=\"lab\">참고<\/b><span class=\"jt\" translate=\"no\" role=\"button\" tabindex=\"0\" data-say=\"てある\" title=\"눌러서 듣기\">「<span translate=\"no\">てある<\/span>」<\/span><a class=\"xref\" href=\"../Lesson65/\">65과 →<\/a>는 누군가 의도적으로 해 둔 결과, <span class=\"jt\" translate=\"no\" role=\"button\" tabindex=\"0\" data-say=\"ている\" title=\"눌러서 듣기\">「<span translate=\"no\">ている<\/span>」<\/span>는 자동사의 상태에 쓰는 경우가 많아요.<\/div><h3>예문 8개<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" translate=\"no\" role=\"button\" tabindex=\
