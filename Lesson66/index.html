<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 66, "ja": "ている", "ko": "~하고 있다, ~해 있다 (ている)", "en": "ongoing action or current state", "part": "시간·상태·정도·비교", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">~하고 있다, ~해 있다 (진행·계속·습관·상태)<\/div><div class=\"d\">동작의 진행뿐 아니라 계속·습관·상태까지 나타내는 「ている」의 5가지 쓰임.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>구분<\/th><th>형태<\/th><\/tr><\/thead><tbody><tr><td>긍정 (반말 / 정중)<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"동사 て형 + いる / います\" title=\"눌러서 듣기\">동사 て형 + いる / います<\/span><\/td><\/tr><tr><td>부정 (반말 / 정중)<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"동사 て형 + いない / いません\" title=\"눌러서 듣기\">동사 て형 + いない / いません<\/span><\/td><\/tr><tr><td>회화체<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ている → てる\" title=\"눌러서 듣기\">ている → てる (い 생략)<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>핵심 정리<\/h3><p><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ている\" title=\"눌러서 듣기\">「ている」<\/span>는 동사 て형에 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"いる\" title=\"눌러서 듣기\">「いる」<\/span>를 붙인 표현으로, 지금 일어나고 있는 일을 나타내는 <b>진행형<\/b>이에요. 그 밖에도 계속, 습관, 상태를 나타내는 등 쓰임이 다양해요.<\/p><ul class=\"rules\"><li>見る → 見<b>ている<\/b> (보고 있다)<\/li><li>読む → 読ん<b>でいる<\/b> (읽고 있다)<\/li><li>정중하게는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ています\" title=\"눌러서 듣기\">「ています」<\/span>, 부정은 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ていない/ていません\" title=\"눌러서 듣기\">「ていない / ていません」<\/span><\/li><\/ul><h3>뜻 ① 진행 — 지금 ~하고 있다<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"昼ご飯を食べている。\" title=\"눌러서 듣기\"><ruby>昼<rt>ひる<\/rt><\/ruby>ご<ruby>飯<rt>はん<\/rt><\/ruby>を<ruby>食<rt>た<\/rt><\/ruby>べ<b>ている<\/b>。<\/span><span class=\"rom\">hirugohan o tabete iru<\/span><\/div><\/div><span class=\"k kor\">점심을 먹고 있다.<\/span><\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"宿題をやっていない。\" title=\"눌러서 듣기\"><ruby>宿題<rt>しゅくだい<\/rt><\/ruby>をやっ<b>ていない<\/b>。<\/span><span class=\"rom\">shukudai o yate inai<\/span><\/div><\/div><span class=\"k kor\">숙제를 하고 있지 않다.<\/span><\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"お母さんと電話をしています。\" title=\"눌러서 듣기\">お<ruby>母<rt>かあ<\/rt><\/ruby>さんと<ruby>電話<rt>でんわ<\/rt><\/ruby>をし<b>ています<\/b>。<\/span><span class=\"rom\">okaasan to denwa o shite imasu<\/span><\/div><\/div><span class=\"k kor\">어머니와 통화하고 있습니다.<\/span><\/li><\/ul><h3>뜻 ② 계속 — 지금까지 계속 ~하고 있다<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"先生の話を聞いているの?\" title=\"눌러서 듣기\"><ruby>先生<rt>せんせい<\/rt><\/ruby>の<ruby>話<rt>はなし<\/rt><\/ruby>を<ruby>聞<rt>き<\/rt><\/ruby>い<b>ている<\/b>の?<\/span><span class=\"rom\">sensei no hanashi o kiite iru no?<\/span><\/div><\/div><span class=\"k kor\">선생님 이야기를 듣고 있는 거야?<\/span><\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"5年間日本語を勉強しています。\" title=\"눌러서 듣기\">5<ruby>年間<rt>ねんかん<\/rt><\/ruby><ruby>日本語<rt>にほんご<\/rt><\/ruby>を<ruby>勉強<rt>べんきょう<\/rt><\/ruby>し<b>ています<\/b>。<\/span><span class=\"rom\">5 nenkan nihongo o benkyou shite imasu<\/span><\/div><\/div><span class=\"k kor\">5년 동안 일본어를 공부하고 있습니다.<\/span><\/li><\/ul><h3>뜻 ③ 현재의 상황 — 요즘 ~하고 있다<\/h3><p>지금 이 순간만이 아니라 '현재 하고 있는 일'을 말해요.<\/p><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"面白い本を読んでいる。\" title=\"눌러서 듣기\"><ruby>面白<rt>おもしろ<\/rt><\/ruby>い<ruby>本<rt>ほん<\/rt><\/ruby>を<ruby>読<rt>よ<\/rt><\/ruby>ん<b>でいる<\/b>。<\/span><span class=\"rom\">omoshiroi hon o yonde iru<\/span><\/div><\/div><span class=\"k kor\">재미있는 책을 읽고 있다.<\/span><\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"日本で日本語を勉強しています。\" title=\"눌러서 듣기\"><ruby>日本<rt>にほん<\/rt><\/ruby>で<ruby>日本語<rt>にほんご<\/rt><\/ruby>を<ruby>勉強<rt>べんきょう<\/rt><\/ruby>し<b>ています<\/b>。<\/span><span class=\"rom\">nihon de nihongo o benkyou shite imasu<\/span><\/div><\/div><span class=\"k kor\">일본에서 일본어를 공부하고 있습니다.<\/span><\/li><\/ul><h3>뜻 ④ 습관 — 자주 ~한다<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"毎日、寝る前にマンガを読んでいる。\" title=\"눌러서 듣기\"><ruby>毎日<rt>まいにち<\/rt><\/ruby>、<ruby>寝<rt>ね<\/rt><\/ruby>る<ruby>前<rt>まえ<\/rt><\/ruby>にマンガを<ruby>読<rt>よ<\/rt><\/ruby>ん<b>でいる<\/b>。<\/span><span class=\"rom\">mainichi neru mae ni manga o yonde iru<\/span><\/div><\/div><span class=\"k kor\">매일 자기 전에 만화를 읽는다.<\/span><\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"いつも自転車で通勤している。\" title=\"눌러서 듣기\">いつも<ruby>自転車<rt>じてんしゃ<\/rt><\/ruby>で<ruby>通勤<rt>つうきん<\/rt><\/ruby>し<b>ている<\/b>。<\/span><span class=\"rom\">itsumo jitensha de tsuukin shite iru<\/span><\/div><\/div><span class=\"k kor\">항상 자전거로 출퇴근한다.<\/span><\/li><\/ul><h3>뜻 ⑤ 상태 — ~해 있다, ~한 상태이다<\/h3><p>어떤 사물이나 사람의 현재 상태, 모습을 나타내요.<\/p><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"彼はお父さんと似ている。\" title=\"눌러서 듣기\"><ruby>彼<rt>かれ<\/rt><\/ruby>はお<ruby>父<rt>とう<\/rt><\/ruby>さんと<ruby>似<rt>に<\/rt><\/ruby><b>ている<\/b>。<\/span><span class=\"rom\">kare wa otousan to nite iru<\/span><\/div><\/div><span class=\"k kor\">그는 아버지를 닮았다.<\/span><\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"ドアが開いている。\" title=\"눌러서 듣기\">ドアが<ruby>開<rt>あ<\/rt><\/ruby>い<b>ている<\/b>。<\/span><span class=\"rom\">doa ga aite iru<\/span><\/div><\/div><span class=\"k kor\">문이 열려 있다.<\/span><\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"今日は食堂がとても混んでいる。\" title=\"눌러서 듣기\"><ruby>今日<rt>きょう<\/rt><\/ruby>は<ruby>食堂<rt>しょくどう<\/rt><\/ruby>がとても<ruby>混<rt>こ<\/rt><\/ruby>ん<b>でいる<\/b>。<\/span><span class=\"rom\">kyou wa shokudou ga totemo konde iru<\/span><\/div><\/div><span class=\"k kor\">오늘은 식당이 매우 붐빈다.<\/span><\/li><\/ul><div class=\"note warn\"><b class=\"lab\">참고<\/b>회화에서는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"い\" title=\"눌러서 듣기\">「い」<\/span>를 빼고 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"てる\" title=\"눌러서 듣기\">「てる」<\/span>라고 많이 말해요. (食べてる、読んでる) 편한 말투에서만 써요.<\/div><div class=\"note warn\"><b class=\"lab\">참고<\/b><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"てある\" title=\"눌러서 듣기\">「てある」<\/span><a class=\"xref\" href=\"../Lesson65/\">65과 →<\/a>는 누군가 의도적으로 해 둔 결과, <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ている\" title=\"눌러서 듣기\">「ている」<\/span>는 자동사의 상태에 쓰는 경우가 많아요.<\/div><h3>예문 8개<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"昼ごはんは何を食べているの?\" title=\"눌러서 듣기\"><ruby>昼<rt>ひる<\/rt><\/ruby>ごはんは<ruby>何<rt>なに<\/rt><\/ruby>を<ruby>食<rt>た<\/rt><\/ruby>べ<b>ている<\/b>の?<\/span><span class=\"rom\">hirugohan wa nani o tabete iru no?<\/span><\/div><\/div><span class=\"k kor\">점심은 뭘 먹어?<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"私もその本を読んでいる!\" title=\"눌러서 듣기\"><ruby>私<rt>わたし<\/rt><\/ruby>もその<ruby>本<rt>ほん<\/rt><\/ruby>を<ruby>読<rt>よ<\/rt><\/ruby>ん<b>でいる<\/b>!<\/span><span class=\"rom\">watashi mo sono hon o yonde iru!<\/span><\/div><\/div><span class=\"k kor\">저도 그 책을 읽고 있어요!<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"いつからサッカーをやっているのです
