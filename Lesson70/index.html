<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 70, "ja": "てもいいです", "ko": "~해도 된다 (てもいいです)", "en": "is OK to..; is alright to..; may I..?", "part": "부탁·권유·허가·금지", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">~해도 된다, ~해도 괜찮다, ~해도 될까요?<\/div><div class=\"d\">허가를 구하거나 허락할 때 쓰는 「てもいいです」.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>앞에 오는 말<\/th><th>붙이는 형태<\/th><\/tr><\/thead><tbody><tr><td>동사 て형<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"行っ + てもいいです / ていい\" title=\"눌러서 듣기\">行っ + てもいいです / ていい<\/span><\/td><\/tr><tr><td>い형용사 (い → くて)<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"高く + てもいい\" title=\"눌러서 듣기\">高く + てもいい<\/span><\/td><\/tr><tr><td>な형용사·명사<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"静か + でもいい\" title=\"눌러서 듣기\">静か + でもいい<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>핵심 정리<\/h3><p><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"てもいいです\" title=\"눌러서 듣기\">「てもいいです」<\/span>는 '~해도 괜찮습니다'라는 <b>허가<\/b>를 나타내요. 끝에 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"か\" title=\"눌러서 듣기\">「か」<\/span>를 붙이면 '~해도 될까요?'라는 허락을 구하는 질문이 돼요.<\/p><ul class=\"rules\"><li>行ってもいいですか → 가도 됩니까?<\/li><li><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"も\" title=\"눌러서 듣기\">「も」<\/span>는 생략할 수 있어요. 行って<b>いい<\/b>? (편한 말투)<\/li><li>허락할 때 → <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"はい、いいですよ\" title=\"눌러서 듣기\">「はい、いいですよ」<\/span> / 허락하지 않을 때 → <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"いいえ、だめです\" title=\"눌러서 듣기\">「いいえ、だめです」<\/span><\/li><\/ul><h3>다른 품사<\/h3><ul class=\"rules\"><li>い형용사: い → くてもいい (高くてもいい)<\/li><li>な형용사·명사: + でもいい (静かでもいい)<\/li><li>부정: <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"なくてもいい\" title=\"눌러서 듣기\">「なくてもいい」<\/span><a class=\"xref\" href=\"../Lesson40/\">40과 →<\/a> (~하지 않아도 된다)<\/li><\/ul><div class=\"note warn\"><b class=\"lab\">참고<\/b>금지는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"てはいけない\" title=\"눌러서 듣기\">「てはいけない」<\/span><a class=\"xref\" href=\"../Lesson69/\">69과 →<\/a>입니다.<\/div><h3>예문 9개<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"トイレに行ってもいいですか?\" title=\"눌러서 듣기\">トイレに<ruby>行<rt>い<\/rt><\/ruby>っ<b>てもいいです<\/b>か?<\/span><span class=\"rom\">toire ni ite mo ii desu ka?<\/span><\/div><\/div><span class=\"k kor\">화장실에 가도 됩니까?<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"うん、行ってもいいですよ!\" title=\"눌러서 듣기\">うん、<ruby>行<rt>い<\/rt><\/ruby>っ<b>てもいいです<\/b>よ!<\/span><span class=\"rom\">un ite mo ii desu yo!<\/span><\/div><\/div><span class=\"k kor\">응, 가도 돼요!<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"それを食べてもいいですか。\" title=\"눌러서 듣기\">それを<ruby>食<rt>た<\/rt><\/ruby>べ<b>てもいいです<\/b>か。<\/span><span class=\"rom\">sore o tabete mo ii desu ka<\/span><\/div><\/div><span class=\"k kor\">그거 먹어도 됩니까?<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"私も一緒に行っていい?\" title=\"눌러서 듣기\"><ruby>私<rt>わたし<\/rt><\/ruby>も<ruby>一緒<rt>いっしょ<\/rt><\/ruby>に<ruby>行<rt>い<\/rt><\/ruby>っ<b>ていい?<\/b><\/span><span class=\"rom\">watashi mo issho ni ite ii?<\/span><\/div><\/div><span class=\"k kor\">나도 같이 가도 돼?<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"ここに座ってもいいですか?\" title=\"눌러서 듣기\">ここに<ruby>座<rt>すわ<\/rt><\/ruby>っ<b>てもいいですか<\/b>?<\/span><span class=\"rom\">koko ni suwate mo ii desu ka?<\/span><\/div><\/div><span class=\"k kor\">여기에 앉아도 됩니까?<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"一つ質問を聞いていいですか?\" title=\"눌러서
