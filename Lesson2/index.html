<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 2, "ja": "だ・です", "ko": "~이다 (だ・です)", "en": "to be (am, is, are, were, used to)", "part": "이다·형용사", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">~이다, ~입니다 (현재·과거, 긍정·부정)<\/div><div class=\"d\">명사 문장을 만드는 기본 표현. だ(반말)·です(정중)와 과거·부정 형태를 익혀요.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>구분<\/th><th>형태<\/th><\/tr><\/thead><tbody><tr><td>현재 긍정<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"だ  / です\" title=\"눌러서 듣기\">だ (반말) / です (정중)<\/span><\/td><\/tr><tr><td>과거 긍정<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"だった  / でした\" title=\"눌러서 듣기\">だった (반말) / でした (정중)<\/span><\/td><\/tr><tr><td>현재 부정<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"じゃない・ではない / じゃありません・ではありません\" title=\"눌러서 듣기\">じゃない・ではない / じゃありません・ではありません<\/span><\/td><\/tr><tr><td>과거 부정<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"じゃなかった・ではなかった / じゃありませんでした・ではありませんでした\" title=\"눌러서 듣기\">じゃなかった・ではなかった / じゃありませんでした・ではありませんでした<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>だ와 です<\/h3><p><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"だ\" title=\"눌러서 듣기\">「だ」<\/span>와 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"です\" title=\"눌러서 듣기\">「です」<\/span>는 뜻이 완전히 같고, <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"です\" title=\"눌러서 듣기\">「です」<\/span>가 더 정중합니다. 헷갈리면 항상 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"です\" title=\"눌러서 듣기\">「です」<\/span>를 쓰면 안전해요.<\/p><ul class=\"rules\"><li>영어의 am·is·are처럼 사람(주어)에 따라 형태가 바뀌지 않아요. 모두 같은 형태입니다.<\/li><li>일본어는 '주어 - 목적어 - 동사(서술어)' 순서라서 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"私はクリスです\" title=\"눌러서 듣기\">「私はクリスです」<\/span>는 '나는 크리스 이다'처럼 끝에 서술어가 옵니다.<\/li><\/ul><h3>현재 긍정: だ・です<\/h3><ul class=\"exs\"><li><div class=\"alt\">
