<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 12, "ja": "があります", "ko": "~이 있다 (사물·があります)", "en": "there is; is (non-living things)", "part": "존재·희망·의지", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">~이 있다, ~을 가지고 있다 (움직이지 않는 사물)<\/div><div class=\"d\">사물이 '있다'고 말할 때 쓰는 「ある・あります」. 장소를 말할 때는 「に」를 써요.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>구분<\/th><th>형태<\/th><\/tr><\/thead><tbody><tr><td>현재 긍정<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"がある / があります\" title=\"눌러서 듣기\">がある / があります<\/span><\/td><\/tr><tr><td>과거 긍정<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"があった / がありました\" title=\"눌러서 듣기\">があった / がありました<\/span><\/td><\/tr><tr><td>현재 부정<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"がない / がありません\" title=\"눌러서 듣기\">がない / がありません<\/span><\/td><\/tr><tr><td>과거 부정<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"がなかった / がありませんでした\" title=\"눌러서 듣기\">がなかった / がありませんでした<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>핵심 정리<\/h3><p><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"あるあります\" title=\"눌러서 듣기\">「ある・あります」<\/span>는 사람·동물이 아닌 <b>사물<\/b>이 '있다'고 할 때 써요. 사람·동물에는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"います\" title=\"눌러서 듣기\">「います」<\/span><a class=\"xref\" href=\"../Lesson14/\">14과 →<\/a>를 씁니다.<\/p><ul class=\"rules\"><li><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"何がありますか\" title=\"눌러서 듣기\">「何がありますか」<\/span> → '무엇이 있습니까?'<\/li><li>소유('가지고 있다')의 뜻으로도 써요. <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"お金がない\" title=\"눌러서 듣기\">「お金がない」<\/span> = 돈이 없다.<\/li><\/ul><h3>が와 に<\/h3><p>존재하는 장소를 말할 때는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"が\" title=\"눌러서 듣기\">「が」<\/span> 대신 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"に\" title=\"눌러서 듣기\">「に」<\/span>나 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"は\" title=\"눌러서 듣기\">「は」<\/span>를 써요. <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"にがあります\" title=\"눌러서 듣기\">「～に～があります」<\/span> = '~에 ~이 있다'.<\/p><h3>기본 쓰임<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"たくさんの宿題があります。\" title=\"눌러서 듣기\">たくさんの<ruby>宿題<rt>しゅくだい<\/rt><\/ruby><b>があります<\/b>。<\/span><span class=\"rom\">takusan no shukudai ga arimasu<\/span><\/div><\/div><span class=\"k kor\">숙제가 많이 있습니다.<\/span><\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"カバンがテーブルの上にあります。\" title=\"눌러서 듣기\">カバンがテーブルの<ruby>上<rt>うえ<\/rt><\/ruby><b>にあります<\/b>。<\/span><span class=\"rom\">kaban ga teeburu no ue ni arimasu<\/span><\/div><\/div><span class=\"k kor\">가방이 테이블 위에 있습니다.<\/span><\/li><\/ul><h3>의문문·부정문<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"言いたいことがありますか?\" title=\"눌러서 듣기\"><ruby>言<rt>い<\/rt><\/ruby>いたいこと<b>があります<\/b>か?<\/span><span class=\"rom\">iitai koto ga arimasu ka?<\/span><\/div><\/div><span class=\"k kor\">하고 싶은 말이 있습니까?<\/span><\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"お金がないんだ。\" title=\"눌러서 듣기\">お<ruby>金<rt>かね<\/rt><\/ruby><b>がない<\/b>んだ。<\/span><span class=\"rom\">okane ga nai n da<\/span><\/div><\/div><span class=\"k kor\">돈이 없어.<\/span><\/li><\/ul><h3>예문 7개<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"人気がある。\" title=\"눌러서 듣기\"><ruby>人気<rt>にんき<\/rt><\/ruby><b>がある<\/b>。<\/span><span class=\"rom\">ninki ga aru<\/span><\/div><\/div><span class=\"k kor\">인기가 있다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0
