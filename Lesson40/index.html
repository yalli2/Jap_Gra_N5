<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 40, "ja": "なくてもいい", "ko": "~하지 않아도 된다 (なくてもいい)", "en": "don't have to", "part": "부탁·권유·허가·금지", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">~하지 않아도 된다, ~할 필요 없다<\/div><div class=\"d\">하지 않아도 괜찮다고 말하는 표현. ない형의 い를 くて로 바꿔요.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>앞에 오는 말<\/th><th>붙이는 형태<\/th><\/tr><\/thead><tbody><tr><td>동사 ない형 (い → くて)<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"行かない → 行かなくても + いい\" title=\"눌러서 듣기\">行かない → 行かなくても + いい<\/span><\/td><\/tr><tr><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"も\" title=\"눌러서 듣기\">「も」<\/span> 생략<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"行かなくて + いい\" title=\"눌러서 듣기\">行かなくて + いい<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>핵심 정리<\/h3><p><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"なくてもいい\" title=\"눌러서 듣기\">「なくてもいい」<\/span>는 '~하지 않아도 된다'는 허가·불필요를 나타내요.<\/p><ul class=\"rules\"><li>行かない → 行か<b>なくても<\/b>いい (가지 않아도 된다)<\/li><li><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"も\" title=\"눌러서 듣기\">「も」<\/span>는 생략해도 돼요: 行か<b>なくて<\/b>いい<\/li><li>정중하게는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"なくてもいいです\" title=\"눌러서 듣기\">「なくてもいいです」<\/span>라고 말해요.<\/li><\/ul><div class=\"note warn\"><b class=\"lab\">참고<\/b><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ても\" title=\"눌러서 듣기\">「ても」<\/span><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"てもいいです\" title=\"눌러서 듣기\">「てもいいです」<\/span><a class=\"xref\" href=\"../Lesson70/\">70과 →<\/a>를 부정으로 바꾼 형태예요. 반대인 '~해야 한다'는 <a class=\"xref\" href=\"../Lesson41/\">41과 →<\/a> <a class=\"xref\" href=\"../Lesson42/\">42과 →<\/a> <a class=\"xref\" href=\"../Lesson43/\">43과 →<\/a>을 보세요.<\/div><h3>예문 10개<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"明日は休みだから、学校に行かなくてもいい。\" title=\"눌러서 듣기\"><ruby>明日<rt>あした<\/rt><\/ruby>は<ruby>休<rt>やす<\/rt><\/ruby>みだから、<ruby>学校<rt>がっこう<\/rt><\/ruby>に<ruby>行<rt>い<\/rt><\/ruby>か<b>なくてもいい<\/b>。<\/span><span class=\"rom\">ashita wa yasumi da kara gakkou ni ikanakute mo ii<\/span><\/div><\/div><span class=\"k kor\">내일은 휴일이니까 학교에 가지 않아도 된다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"空港まで来なくてもいいよ。\" title=\"눌러서 듣기\"><ruby>空港<rt>くうこう<\/rt><\/ruby>まで<ruby>来<rt>こ<\/rt><\/ruby><b>なくてもいい<\/b>よ。<\/span><span class=\"rom\">kuukou made konakute mo ii yo<\/span><\/div><\/div><span class=\"k kor\">공항까지 오지 않아도 돼.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"好きじゃないなら、食べなくてもいいですよ。\" title=\"눌러서 듣기\"><ruby>好<rt>す<\/rt><\/ruby>きじゃないなら、<ruby>食<rt>た<\/rt><\/ruby>べ<b>なくてもいい<\/b>ですよ。<\/span><span class=\"rom\">suki ja nai nara tabenakute mo ii desu yo<\/span><\/div><\/div><span class=\"k kor\">좋아하지 않으면 먹지 않아도 돼요.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"来なくてもいいですよ。私一人で行くから。\" title=\"눌러서 듣기\"><ruby>来<rt>こ<\/rt><\/ruby><b>なくてもいい<\/b>ですよ。<ruby>私<rt>わたし<\/rt><\/ruby><ruby>一人<rt>ひとり<\/rt><\/ruby>で<ruby>行<rt>い<\/rt><\/ruby>くから。<\/span><span class=\"rom\">konakute mo ii desu yo watashi hitori de iku kara<\/span><\/div><\/div><span class=\"k kor\">오지 않아도 돼요. 저 혼자 갈 테니까.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"無理しなくてもいいですよ。\" title=\"눌러서 듣기\"><ruby>無理<rt>むり<\/rt><\/ruby>し<b>なくてもいい<\/b>ですよ。<\/span><span class=\"rom\">muri shinakute mo ii desu yo<\/span><\/div><\/div><span class=\"k kor\">무리하지 않아도 돼요.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"明日は授業がないから大学に行かなくてもいいです。\" title=\"눌러서 듣기
