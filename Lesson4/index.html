<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 4, "ja": "だろう", "ko": "~일 것이다, ~겠지 (だろう)", "en": "I think; it seems; probably; right?", "part": "문말 표현", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">~일 것이다, ~겠지, ~일까? (추측·확인)<\/div><div class=\"d\">추측과 확인을 나타내는 반말 표현. 「でしょう」보다 편한 말투예요.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>앞에 오는 말<\/th><th>붙이는 형태<\/th><\/tr><\/thead><tbody><tr><td>동사 (사전형)<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"来る + だろう\" title=\"눌러서 듣기\">来る + だろう<\/span><\/td><\/tr><tr><td>명사<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"雨 + だろう\" title=\"눌러서 듣기\">雨 + だろう<\/span><\/td><\/tr><tr><td>な형용사<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"きれい + だろう\" title=\"눌러서 듣기\">きれい + だろう<\/span><\/td><\/tr><tr><td>い형용사<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"暑い + だろう\" title=\"눌러서 듣기\">暑い + だろう<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>핵심 정리<\/h3><p><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"だろう\" title=\"눌러서 듣기\">「だろう」<\/span>는 '~일 것이다 / ~겠지'라는 <b>추측<\/b>, 그리고 상대에게 '~지?'라고 <b>확인<\/b>하는 뜻으로 써요. 어느 쪽인지는 말투(억양)와 상황으로 알 수 있어요.<\/p><ul class=\"rules\"><li>줄여서 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"だろ\" title=\"눌러서 듣기\">「だろ」<\/span>라고도 하지만 뜻은 같아요.<\/li><li>정중한 말은 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"でしょう\" title=\"눌러서 듣기\">「でしょう」<\/span><a class=\"xref\" href=\"../Lesson7/\">7과 →<\/a>입니다.<\/li><\/ul><h3>추측과 확인<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"嘘だろう。\" title=\"눌러서 듣기\"><ruby>嘘<rt>うそ<\/rt><\/ruby><b>だろう<\/b>。<\/span><span class=\"rom\">uso darou<\/span><\/div><\/div><span class=\"k kor\">거짓말이지? (설마 거짓말이겠지)<\/span><\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"雨が降るだろう。\" title=\"눌러서 듣기\"><ruby>雨<rt>あめ<\/rt><\/ruby>が<ruby>降<rt>ふ<\/rt><\/ruby>る<b>だろう<\/b>。<\/span><span class=\"rom\">ame ga furu darou<\/span><\/div><\/div><span class=\"k kor\">비가 올 것 같다. / 비가 오겠지.<\/span><\/li><\/ul><h3>의문사와 함께 — '~일까?'<\/h3><p>의문사와 함께 쓰면 혼잣말로 '무엇일까?' 하고 궁금해하는 느낌이 돼요.<\/p><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"それは何だろう。\" title=\"눌러서 듣기\">それは<ruby>何<rt>なん<\/rt><\/ruby><b>だろう<\/b>。<\/span><span class=\"rom\">sore wa nan darou<\/span><\/div><\/div><span class=\"k kor\">그건 뭘까?<\/span><\/li><\/ul><h3>예문 8개<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"彼はもうすぐ来るだろう。\" title=\"눌러서 듣기\"><ruby>彼<rt>かれ<\/rt><\/ruby>はもうすぐ<ruby>来<rt>く<\/rt><\/ruby>る<b>だろう<\/b>。<\/span><span class=\"rom\">kare wa mou sugu kuru darou<\/span><\/div><\/div><span class=\"k kor\">그는 곧 올 것이다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"そうだろうと思ったよ。\" title=\"눌러서 듣기\">そう<b>だろう<\/b>と<ruby>思<rt>おも<\/rt><\/ruby>ったよ。<\/span><span class=\"rom\">sou darou to omota yo<\/span><\/div><\/div><span class=\"k kor\">그럴 거라고 생각했어.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"明日はたぶん雨が降るだろう。空に雲がたくさんあるから。\" title=\"눌러서 듣기\"><ruby>明日<rt>あした<\/rt><\/ruby>はたぶん<ruby>雨<rt>あめ<\/rt><\/ruby>が<ruby>降<rt>ふ<\/rt><\/ruby>る<b>だろう<\/b>。<ruby>空<rt>そら<\/rt><\/ruby>に<ruby>雲<rt>くも<\/rt><\/ruby>がたくさんあるから。<\/span><span class=\"rom\">ashita wa tabun ame ga furu darou sora ni kumo ga takusan aru kara<\/span><\/div><\/div><span class=\"k kor\">내일은 아마 비가 올 것이다. 하늘에 구름이 많이 있으니까.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"間違いないだろう。\" title=\"눌러서 듣기\"
