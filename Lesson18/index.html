<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 18, "ja": "一緒に", "ko": "함께, 같이 (一緒に)", "en": "together", "part": "부탁·권유·허가·금지", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">함께, 같이<\/div><div class=\"d\">누군가와 함께 무엇을 할 때 쓰는 「一緒に」. 함께하는 사람 뒤에 「と」를 붙여요.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>형태<\/th><th>뜻<\/th><\/tr><\/thead><tbody><tr><td>一緒に + 동사<\/td><td>함께 ~하다<\/td><\/tr><tr><td>사람 + と + 一緒に + 동사<\/td><td>(사람)과 함께 ~하다<\/td><\/tr><\/tbody><\/table><\/div><h3>핵심 정리<\/h3><p><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"一緒に\" title=\"눌러서 듣기\">「一緒に(いっしょに)」<\/span>는 '함께, 같이'라는 뜻이에요. 같이 하는 사람이 누구인지 말할 때는 앞에 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"と\" title=\"눌러서 듣기\">「と」<\/span>를 붙여요.<\/p><ul class=\"rules\"><li><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"一緒に行きませんか\" title=\"눌러서 듣기\">「一緒に行きませんか」<\/span> → 같이 가지 않을래요? (권유 <a class=\"xref\" href=\"../Lesson31/\">31과 →<\/a>)<\/li><li><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"友だちと一緒に行きます\" title=\"눌러서 듣기\">「友だちと一緒に行きます」<\/span> → 친구와 함께 갑니다.<\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"一緒に行きませんか?\" title=\"눌러서 듣기\"><b><ruby>一緒<rt>いっしょ<\/rt><\/ruby>に<\/b><ruby>行<rt>い<\/rt><\/ruby>きませんか?<\/span><span class=\"rom\">issho ni ikimasen ka?<\/span><\/div><\/div><span class=\"k kor\">같이 가지 않을래요?<\/span><\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"彼女と一緒にレストランへ行きます。\" title=\"눌러서 듣기\"><ruby>彼女<rt>かのじょ<\/rt><\/ruby><b>と<ruby>一緒<rt>いっしょ<\/rt><\/ruby>に<\/b>レストランへ<ruby>行<rt>い<\/rt><\/ruby>きます。<\/span><span class=\"rom\">kanojo to issho ni resutoran e ikimasu<\/span><\/div><\/div><span class=\"k kor\">여자친구와 함께 레스토랑에 갑니다.<\/span><\/li><\/ul><div class=\"note warn\"><b class=\"lab\">참고<\/b><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"と\" title=\"눌러서 듣기\">「と」<\/span>는 '~와/과'를 뜻하는 조사예요. <a class=\"xref\" href=\"../Lesson71/\">71과 →<\/a><\/div><h3>예문 7개<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"一緒に日本語を勉強しましょう。\" title=\"눌러서 듣기\"><b><ruby>一緒<rt>いっしょ<\/rt><\/ruby>に<\/b><ruby>日本語<rt>にほんご<\/rt><\/ruby>を<ruby>勉強<rt>べんきょう<\/rt><\/ruby>しましょう。<\/span><span class=\"rom\">issho ni nihongo o benkyou shimashou<\/span><\/div><\/div><span class=\"k kor\">함께 일본어를 공부합시다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"今夜、カラオケに一緒に行こう。\" title=\"눌러서 듣기\"><ruby>今夜<rt>こんや<\/rt><\/ruby>、カラオケに<b><ruby>一緒<rt>いっしょ<\/rt><\/ruby>に<\/b><ruby>行<rt>い<\/rt><\/ruby>こう。<\/span><span class=\"rom\">konya karaoke ni issho ni ikou<\/span><\/div><\/div><span class=\"k kor\">오늘 밤 노래방에 함께 가자.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"ずっと彼と一緒にいたい。\" title=\"눌러서 듣기\">ずっと<ruby>彼<rt>かれ<\/rt><\/ruby><b>と<ruby>一緒<rt>いっしょ<\/rt><\/ruby>に<\/b>いたい。<\/span><span class=\"rom\">zutto kare to issho ni itai<\/span><\/div><\/div><span class=\"k kor\">계속 그와 함께 있고 싶어.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"明日の朝、一緒にジムに行きませんか?\" title=\"눌러서 듣기\"><ruby>明日<rt>あした<\/rt><\/ruby>の<ruby>朝<rt>あさ<\/rt><\/ruby>、<b><ruby>一緒<rt>いっしょ<\/rt><\/ruby>に<\/b>ジムに<ruby>行<rt>い<\/rt><\/ruby>きませんか?<\/span><span class=\"rom\">ashita no asa issho ni jimu ni ikimasen ka?<\/span><\/div><\/div><span class=\"k kor\">내일 아침 같이 헬스장에 가지 않을래요?<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"今朝、友だちと一緒に図書館に行きました。\" title=\"눌러서 듣기\"><ruby>今朝<rt>けさ<\/rt><\/ruby>、<ruby>友<rt>とも<\/rt><\/ruby>だち<b>と<ruby>一緒<rt>いっしょ<\/r
