<script>
const IDX = [{"id": 1, "ja": "ちゃいけない・じゃいけない", "ko": "~하면 안 돼 (회화체 금지)", "en": "must not do (spoken Japanese)", "cat": "부탁·권유·허가·금지", "g": 1, "d": "「てはいけない」의 회화체. て형의 て를 ちゃ(で는 じゃ)로 바꿔 '~하면 안 돼'라고 말해요.", "n": 28, "ne": 10, "kw": "~하면 안 돼, ~해서는 안 돼요 (말할 때 쓰는 편한 표현) 자기 전에 스마트폰을 보면 안 돼. 여기는 위험하니까 들어가면 안 돼. 해서는 안 될 일을 해 버렸어… 자신감을 잃으면 안 돼요! 그렇게 수업을 빼먹으면 안 돼. 그를 신용해서는 안 돼. 빨간 신호를 무시하면 안 됩니다! 채소를 다 먹을 때까지 디저트를 먹으면 안 돼. 아이들 앞에서 나쁜 말을 하면 안 됩니다. 20세 미만인 사람은 술을 마시면 안 됩니다."}, {"id": 2, "ja": "だ・です", "ko": "~이다 (だ・です)", "en": "to be (am, is, are, were, used to)", "cat": "이다·형용사", "g": 1, "d": "명사 문장을 만드는 기본 표현. だ(반말)·です(정중)와 과거·부정 형태를 익혀요.", "n": 20, "ne": 4, "kw": "~이다, ~입니다 (현재·과거, 긍정·부정) 오늘은 일요일이네. 그는 내 친구입니다. 일본 문화를 좋아합니다. 옛날에는 축구가 취미였지만, 지금은 하지 않는다."}, {"id": 3, "ja": "だけ", "ko": "~만, ~뿐 (だけ)", "en": "only; just; as much as", "cat": "시간·상태·정도·비교", "g": 1, "d": "「だけ」는 '오직 ~뿐'과 '~할 수 있는 만큼'을 나타내요. 동사·명사·형용사 뒤에 붙습니다.", "n": 28, "ne": 9, "kw": "~만, ~뿐, ~하는 만큼 내가 가진 돈은 이것뿐이다. 잠깐 보고 있을 뿐이에요. 싫어하는 음식은 토마토뿐이다. 그냥 이야기하고 있었을 뿐이에요. 문제는 그것뿐이라고 생각하니? 저는 혼자서도(혼자만으로) 할 수 있어요. 가능한 한 새로운 한자를 공부하고 싶다. 그 여자아이는 그저 울기만 했다. 그녀가 신뢰할 수 있는 사람은 그뿐이다."}, {"id": 4, "ja": "だろう", "ko": "~일 것이다, ~겠지 (だろう)", "en": "I think; it seems; probably; right?", "cat": "문말 표현", "g": 1, "d": "추측과 확인을 나타내는 반말 표현. 「でしょう」보다 편한 말투예요.", "n": 28, "ne": 8, "kw": "~일 것이다, ~겠지, ~일까? (추측·확인) 그는 곧 올 것이다. 그럴 거라고 생각했어. 내일은 아마 비가 올 것이다. 하늘에 구름이 많이 있으니까. 틀림없을 것이다. 아마 이 비는 한 시간쯤이면 그칠 것이다. 저기 있는 사람은 누구일까? 이 고기는 이제 먹지 않는 편이 좋을 것이다. 이미 상해 버렸다. 왜 일본의 여름은 이렇게 더울까…?"}, {"id": 5, "ja": "で", "ko": "~에서, ~로 (で)", "en": "in; at; on; by; with; via", "cat": "조사", "g": 1, "d": "행동이 일어나는 장소, 수단·방법, 합계, 이유를 나타내는 조사 「で」의 4가지 쓰임을 배워요.", "n": 28, "ne": 9, "kw": "~에서, ~로, ~(으)로, ~해서 (장소·수단·원인 등) 자전거로 갑니다. 다 같이 갑시다! 가끔 혼자서 노래방에 갑니다. 어떤 이유로 그는 벌레를 무서워한다. 그 셔츠 어디서 샀어요? 역에서 만나요. 여기서 전화하지 말아 주세요. 어디서 일본어를 배웠어요? 유튜브로 일본어를 공부합니다."}, {"id": 6, "ja": "でも", "ko": "하지만, 그러나 (でも)", "en": "but; however", "cat": "접속·이유", "g": 1, "d": "문장 맨 앞에서 앞 내용과 반대되는 말을 이을 때 쓰는 접속사예요.", "n": 28, "ne": 7, "kw": "하지만, 그렇지만 (접속사) 저는 생선을 좋아합니다. 하지만 고기도 좋아합니다. 빵집에 갔습니다. 하지만 아무것도 사지 않았습니다. 동물을 좋아합니다. 하지만 개를 가장 좋아합니다. 도서관에 갔습니다. 하지만 집중할 수 없었습니다. 슈퍼에 갔습니다. 하지만 지갑을 잊어버렸어요! 오늘 아침 학교에 갔습니다. 하지만 쉬는 날이었습니다. 일본 사람과 더 이야기하고 싶습니다. 하지만 제 일본어는 그다지 능숙하지 않습니다."}, {"id": 7, "ja": "でしょう", "ko": "~일 것입니다, ~죠? (でしょう)", "en": "I think; it seems; probably; right?", "cat": "문말 표현", "g": 1, "d": "「だろう」의 정중한 형태. 추측('~일 거예요')과 확인('~죠?')을 나타내요.", "n": 28, "ne": 7, "kw": "~일 것입니다, ~죠?, ~겠지요 (추측·확인, 정중) 저 사람은 누구일까요? 좋겠네요. (괜찮은 것 같네요.) 이 문제는 쉽죠? 그는 곧 올 겁니다. 열심히 하면 좋은 대학에 갈 수 있을 겁니다. 오늘 시합에서는 분명 A팀이 이길 겁니다. 이 문제는 내일 시험에 나올까요?"}, {"id": 8, "ja": "どんな", "ko": "어떤 ~ (どんな)", "en": "what kind of; what sort of", "cat": "의문", "g": 1, "d": "「どんな + 명사」로 사람·사물의 성질이나 종류를 물어요.", "n": 28, "ne": 8, "kw": "어떤, 어떠한 (사물·사람의 상태나 성질을 묻는 말) 베트남은 어떤 나라입니까? 어떤 일을 하십니까? 어떤 음식을 좋아하세요? 어떤 컴퓨터를 가지고 계세요? 어떤 차를 타고 계세요? 오늘은 어떤 날씨입니까? 새 선생님은 어떤 분입니까? 금연하기 위해 어떤 방법을 썼습니까?"}, {"id": 9, "ja": "どうして", "ko": "왜, 어떻게 (どうして)", "en": "why; for what reason; how", "cat": "의문", "g": 1, "d": "이유('왜')와 방법·경위('어떻게')를 묻는 「どうして」. 문장 앞에도, 문장 중간에도 쓸 수 있어요.", "n": 26, "ne": 8, "kw": "왜, 어째서, 어떻게 (이유나 방법을 묻는 말) 왜 안 와? 어쩌다 그렇게 됐어? 어떻게(왜) 그걸 알고 있어? 왜 일본에 왔어요? 왜 일본의 여름은 이렇게 더울까… 너는 어쩌다 다쳤니? 어쩌다 그 사고가 일어났는가? 어떻게 그녀와 알게 되었습니까?"}, {"id": 10, "ja": "どうやって", "ko": "어떻게 (どうやって)", "en": "how; in what way; by what means", "cat": "의문", "g": 1, "d": "방법이나 수단을 묻는 「どうやって」. 문장 앞이나 중간에 올 수 있어요.", "n": 28, "ne": 8, "kw": "어떻게, 어떤 방법으로, 어떤 수단으로 역까지 어떻게 갑니까? 이건 어떻게 사용합니까? 이건 어떻게 먹습니까? 리사 씨는 매일 어떻게 학교에 옵니까? 어떻게 그녀를 만났습니까? 당신은 어떻게 한자를 외웁니까? 이건 어떻게 요리하는 겁니까? 나는 그가 어떻게 혼자서 그것을 했는지 모른다."}, {"id": 11, "ja": "が", "ko": "~이/가, 그러나 (が)", "en": "subject marker; however; but", "cat": "조사", "g": 1, "d": "주어를 나타내는 「が」와 두 문장을 이어 '~하지만'을 뜻하는 「が」, 두 가지 쓰임을 배워요.", "n": 26, "ne": 9, "kw": "~이/가 (주어를 나타냄) / ~하지만 (역접) 내일은 비가 온다. 어쩔 수 없다. (방법이 없다 — 자주 쓰는 표현) 편의점이 가까이에 있습니다. 그는 빚이 있다. 오늘은 할 일이 많이 있다. 그는 돈은 있지만 바보 같은 남자다. 저는 일본어를 말할 수는 있지만 읽을 수는 없습니다. 이 카메라를 사고 싶지만 돈이 없다. 죄송합니다만, 오늘은 만석입니다."}, {"id": 12, "ja": "があります", "ko": "~이 있다 (사물·があります)", "en": "there is; is (non-living things)", "cat": "존재·희망·의지", "g": 1, "d": "사물이 '있다'고 말할 때 쓰는 「ある・あります」. 장소를 말할 때는 「に」를 써요.", "n": 24, "ne": 7, "kw": "~이 있다, ~을 가지고 있다 (움직이지 않는 사물) 인기가 있다. 지난달에는 돈이 전혀 없었다. 방에 텔레비전이 있습니다. 일본에 좋아하지 않는 점도 있습니다. 이 맨션에는 방이 세 개 있습니다. 그는 돈이 있으니까 새 차를 살 수 있다. 오늘 밤 볼일이 있어서 못 간다."}, {"id": 13, "ja": "がほしい", "ko": "~을 갖고 싶다 (がほしい)", "en": "to want something", "cat": "존재·희망·의지", "g": 1, "d": "물건을 갖고 싶을 때 쓰는 표현. 명사 뒤에 「がほしい」를 붙여요.", "n": 28, "ne": 10, "kw": "~을/를 갖고 싶다, ~이 필요하다 더 많은 돈을 갖고 싶어요. 여자친구가 갖고 싶다. 돈이 아주 많이 갖고 싶다. (が와 ほしい를 떼어 써도 됨) 아이를 몇 명 갖고 싶으세요? 새 GoPro 카메라를 갖고 싶어요! 언젠가 내 집을 갖고 싶어요. 제가 원하는 것은 자유입니다. 일본에서 만든 차를 갖고 싶다. 요즘 일이 너무 바빠서 쉴 시간이 갖고 싶다. 그가 가진 것 같은 컴퓨터를 갖고 싶다."}, {"id": 14, "ja": "がいます", "ko": "~이 있다 (사람·동물, がいます)", "en": "there is; to be; is (living things)", "cat": "존재·희망·의지", "g": 1, "d": "사람이나 동물이 '있다'고 말할 때 쓰는 「いる・います」. 가족·연인이 있는지도 이렇게 말해요.", "n": 27, "ne": 7, "kw": "~이 있다, ~이 있다(소유) — 사람·동물에게 쓰는 '있다' 테이블 아래에 고양이가 있다. 너는 남자친구가 있어? 저는 형제가 없어요. 남동생 한 명, 여동생 한 명이 있습니다. 그 방에 개가 있다. 지금 학교에는 아무도 없습니다. 도쿄역에는 관광객이 아주 많이 있다."}, {"id": 15, "ja": "ほうがいい", "ko": "~하는 편이 좋다 (ほうがいい)", "en": "had better; it'd be better to; should~", "cat": "부탁·권유·허가·금지", "g": 1, "d": "충고나 조언을 할 때 쓰는 표현. 긍정은 た형, 부정은 ない형 뒤에 붙여요.", "n": 28, "ne": 8, "kw": "~하는 편이 좋다, ~하는 게 좋겠다 (충고·조언) 피곤하면 일찍 자는 게 좋아. 더운 날에는 물을 많이 마시는 게 좋아요. 자기 전에는 스마트폰을 사용하지 않는 게 좋아. 매일 일본어를 연습하는 게 좋아요. 모를 때는 선생님께 물어보는 게 좋아요. 고기만 먹지 말고 채소도 먹는 게 좋아요. 밥 먹은 후에는 이를 닦는 게 좋아요. 20세가 되어도 술은 마시지 않는 게 좋다고 생각합니다."}, {"id": 16, "ja": "い-adjectives", "ko": "い형용사", "en": "i-adjectives", "cat": "이다·형용사", "g": 1, "d": "い로 끝나는 형용사의 현재·과거·부정 활용을 익혀요. 자주 쓰는 형용사 목록도 있어요.", "n": 28, "ne": 10, "kw": "い형용사 (어미가 い로 끝나는 형용사)와 그 활용 이 책은 재미있습니다. 이 라면은 맛있지 않습니다. 어제 영화는 재미있었다. 이 방은 넓지 않았다. 후지산은 높습니다. 오늘은 춥지 않습니다. 그 가방은 쌌습니다. 어제는 바쁘지 않았다. 저 가게의 케이크는 아주 맛있습니다. 겨울 바다는 차갑지 않았습니다."}, {"id": 17, "ja": "一番", "ko": "가장, 제일 (一番)", "en": "the most; the best", "cat": "시간·상태·정도·비교", "g": 1, "d": "'가장 ~하다'를 말할 때 쓰는 「一番(いちばん)」. 「がいちばん」과 「いちばん + 말」 두 가지 패턴이 있어요.", "n": 28, "ne": 8, "kw": "가장, 제일, 최고 (최상급) 그가 가장 열심히 일했다. 가을이 가장 좋아하는 계절이에요. 저는 브로콜리를 가장 싫어해요. 오전 중이 컨디션이 가장 좋다. 맨 앞에 앉아 있는 사람은 누구예요? 가장 빨리 예약할 수 있는 날은 언제예요? 가장 아름다운 꽃이 가장 빨리 시든다. 형제 중에서 누가 가장 키가 큽니까?"}, {"id": 18, "ja": "一緒に", "ko": "함께, 같이 (一緒に)", "en": "together", "cat": "부탁·권유·허가·금지", "g": 1, "d": "누군가와 함께 무엇을 할 때 쓰는 「一緒に」. 함께하는 사람 뒤에 「と」를 붙여요.", "n": 28, "ne": 7, "kw": "함께, 같이 함께 일본어를 공부합시다. 오늘 밤 노래방에 함께 가자. 계속 그와 함께 있고 싶어. 내일 아침 같이 헬스장에 가지 않을래요? 오늘 아침 친구와 함께 도서관에 갔어요. 우리 집 개와 함께 산책하는 걸 좋아해요. 다음 주에 가족과 함께 후지산을 보러 갈 거야."}, {"id": 19, "ja": "いつも", "ko": "항상, 늘 (いつも)", "en": "always; usually; habitually", "cat": "시간·상태·정도·비교", "g": 1, "d": "늘 일어나는 일이나 습관을 나타내는 부사 「いつも」.", "n": 28, "ne": 8, "kw": "항상, 늘, 보통, 습관적으로 그는 항상 활기차네요. 여동생은 항상 자고 있다. 항상 밤 10시에 잡니다. 점심은 항상 낫토를 먹습니다. 일하러 가기 전에 항상 헬스장에 갑니다. 항상 자전거로 학교에 오지만 오늘은 걸었습니다. 오늘은 평소와 같은 하루였다. 너와 항상 함께 있고 싶어."}, {"id": 20, "ja": "じゃない・ではない", "ko": "~이/가 아니다 (じゃない・ではない)", "en": "to not be (am not; is not; are not)", "cat": "이다·형용사", "g": 1, "d": "「だ・です」의 부정형. 반말은 じゃない/ではない, 정중하게는 じゃありません/ではありません.", "n": 28, "ne": 7, "kw": "~이 아니다 (현재·과거 부정) 당신은 혼자가 아니야. 위험하지 않아? 그럴 생각이 아니었어. 미안해요! 일부러 그런 게 아니었어요. 고기는 별로 좋아하지 않아요. 어릴 때는 채소를 좋아하지 않았다. 나는 일본어를 잘하지 못해."}, {"id": 21, "ja": "か", "ko": "~입니까? (의문 조사 か)", "en": "question particle", "cat": "조사", "g": 2, "d": "문장 끝에 붙여 질문을 만드는 조사 「か」. 우리말의 물음표 역할을 해요.", "n": 28, "ne": 8, "kw": "~입니까? ~ㄹ까요? (문장 끝에 붙어 질문을 만듦) 뭐예요? 실례합니다만, 당신도 학생입니까? 당신의 이름은 무엇입니까? 잘 지내십니까? 그는 몇 살입니까? 괜찮으세요? 저와 점심 먹지 않을래요? 왜 이걸 모르는 거야?"}, {"id": 22, "ja": "か～か", "ko": "~이나, ~(인지) ~인지 (か～か)", "en": "or", "cat": "조사", "g": 2, "d": "두 가지 이상의 선택지를 이을 때 쓰는 「か～か」. '~이나 ~', '~인지 ~인지'를 뜻해요.", "n": 26, "ne": 6, "kw": "~(이)거나 ~, ~인지 ~인지 (둘 이상 중에서 고를 때) 내일은 비가 올지 어떨지 모르겠다. 차나 커피가 마시고 싶다. 맞을지 빗나갈지. (한 번 해 보는 거다) 할지 안 할지 빨리 정해 주세요. 다음 주 월요일이나 화요일에 교토에 갑니다. 죽느냐 사느냐."}, {"id": 23, "ja": "から", "ko": "~이니까, ~부터 (から)", "en": "because; since; from", "cat": "접속·이유", "g": 2, "d": "이유('~이니까')와 출발점('~부터')을 나타내는 「から」. 앞에 오는 말에 따라 형태가 달라요.", "n": 28, "ne": 5, "kw": "① ~이니까, ~이므로 (이유)  ② ~부터, ~에서 (출발점) 날씨가 좋으니까 밖에 나가고 싶다. 금방 돌아올 테니까 여기서 잠깐 기다려 주세요. 앞으로도 잘 부탁드립니다. 여기에서 저 역까지 걸어서 얼마나 걸립니까? 가게는 몇 시부터 몇 시까지 열려 있습니까?"}, {"id": 24, "ja": "方", "ko": "~하는 법 (方 · かた)", "en": "the way of doing something; how to do", "cat": "시간·상태·정도·비교", "g": 2, "d": "동사 ます형에서 「ます」를 뺀 말에 「方」를 붙여 '~하는 법'을 만들어요.", "n": 28, "ne": 7, "kw": "~하는 방법, ~하는 방식 컴퓨터 사용법을 모릅니다. 케이크 만드는 법을 알고 있어요? 젓가락 쓰는 법이 능숙하시네요. (일본에서 자주 듣는 말) 저 선생님의 가르치는 방식은 아주 알기 쉽습니다. 그의 삶의 방식은 멋있습니다. 이 한자의 읽는 법을 가르쳐 주세요. ATM 사용법을 가르쳐 주실 수 있을까요?"}, {"id": 25, "ja": "けど", "ko": "~지만 (けど)", "en": "but; however; although", "cat": "접속·이유", "g": 2, "d": "서로 반대되는 두 내용을 이을 때 쓰는 회화체 접속 표현.", "n": 28, "ne": 8, "kw": "~지만, ~이지만, ~인데 (역접) 일은 힘들지만 즐겁다. 돈은 없지만 꿈은 있다. 운동은 잘하지 않지만 좋아해요. 미안하지만 내일 파티에는 갈 수 없어요. 졸리지만 아직 숙제가 있어서 잘 수 없어요. 공부를 많이 했지만 시험 점수는 좋지 않았습니다. 울었지만 후회는 하지 않아요. 집세는 비싸지만 이 맨션이 정말 좋아요."}, {"id": 26, "ja": "けれども", "ko": "~지만 (けれども)", "en": "but; however; although", "cat": "접속·이유", "g": 2, "d": "「けど」의 정중한 말. 「けれど」「けれども」 모두 같은 뜻이에요.", "n": 28, "ne": 8, "kw": "~지만, ~이지만, ~인데 (역접, 「けど」보다 정중) 이 카메라는 비쌌지만 금방 고장 나 버렸습니다. 밖은 춥지만 집 안은 따뜻합니다. 졸리지만 아직 숙제가 있어서 잘 수 없어요. 눈이 오고 있지만 슈퍼에 갑니다. 돈은 별로 없습니다. 하지만 매일 행복합니다. 선생님은 수업 중에는 엄하지만 수업 밖에서는 상냥합니다. 그는 젊지만 경험이 있다. 열차가 늦었지만 어떻게든 시간에 맞췄다."}, {"id": 27, "ja": "まだ", "ko": "아직 (まだ)", "en": "still; not yet", "cat": "시간·상태·정도·비교", "g": 2, "d": "어떤 상태가 계속되고 있음('아직 ~하고 있다')이나 아직 안 됐음('아직 ~않다')을 나타내는 부사.", "n": 28, "ne": 7, "kw": "아직, 여전히 / 아직 ~하지 않았다 아직이에요? (아직 안 됐나요?) 아직도 덥다. 선생님은 아직 오지 않았다. 벌써 10시인데 동생이 아직 자고 있다. 아직 한 시간이나 있어. 포기하기엔 아직 일러! 저는 숙제가 아직 끝나지 않았습니다."}, {"id": 28, "ja": "まだ～ていません", "ko": "아직 ~하지 않았다 (まだ～ていません)", "en": "have not yet", "cat": "시간·상태·정도·비교", "g": 2, "d": "'아직 ~하지 않았다'를 말하는 표현. 「まだ + 동사 て형 + いません」.", "n": 28, "ne": 9, "kw": "아직 ~하지 않았다, 아직 ~하지 못했다 버스는 아직 오지 않았습니다. 아직 결정되지 않았습니다. 저는 아직 아침을 먹지 않았습니다. 이번 주 새 단어를 아직 외우지 못했습니다. 아버지는 아직 돌아오지 않았다. 아직 숙제를 하지 않았다. 내일이 마감인 리포트가 아직 끝나지 않아서 놀러 갈 수 없다. 나는 아직 포기하지 않았다고! 내가 아는 한 그녀는 아직 결혼하지 않았습니다."}, {"id": 29, "ja": "まで", "ko": "~까지 (まで)", "en": "until ~; as far as ~; to (an extent); even ~", "cat": "조사", "g": 2, "d": "끝나는 시점이나 도착 지점, 정도를 나타내는 조사. 「から」와 짝을 이뤄 자주 써요.", "n": 28, "ne": 10, "kw": "~까지 (시간·장소·정도) 어제까지 휴가였습니다. 여기서 거기까지는 멀어요! 역까지 가고 싶은데요, 어떻게 가면 되나요? 끝까지 힘내! 집까지 차로 바래다 드릴게요. 아침부터 밤까지 계속 한자를 공부했습니다. 가게는 몇 시부터 몇 시까지 열려 있습니까? 선생님, 몇 시까지 학교에 계십니까? 점심때까지는 리포트를 다 써 놓았습니다. 비가 오고 있어. 역까지 데려다 줄까?"}, {"id": 30, "ja": "前に", "ko": "~하기 전에, ~ 앞에 (前に)", "en": "before ~; in front of ~", "cat": "시간·상태·정도·비교", "g": 2, "d": "시간의 '전'과 장소의 '앞'을 나타내는 「前に」. 동사 사전형·명사 + の 뒤에 붙여요.", "n": 28, "ne": 10, "kw": "~하기 전에, ~ 전에 (시간) / ~ 앞에 (장소) 문을 열기 전에 노크 정도는 해 주세요. 편의점 앞에 자전거가 많이 있습니다. 여행 전에 표를 사 둡니다. 밥 먹기 전에 손을 씻읍시다. 시험 전에 열심히 공부했습니다. 대학을 졸업하기 전에 유학하고 싶다. 23시 전에 자야 합니다. 자기 전에 양치하는 걸 잊지 마. 시합 전에 아직 일주일이 있으니 더 연습합시다. 우리 학교 앞에는 아름다운 공원이 있습니다."}, {"id": 31, "ja": "ませんか", "ko": "~하지 않을래요? (ませんか)", "en": "would you; do you want to; shall we~", "cat": "부탁·권유·허가·금지", "g": 2, "d": "상대에게 정중하게 권유하거나 부탁할 때 쓰는 「ませんか」.", "n": 24, "ne": 8, "kw": "~하지 않을래요?, ~하시겠어요?, ~할까요? (권유·부탁) 오늘 같이 먹지 않을래요? 우리 집에서 영화 보지 않을래요? 차 한잔 하지 않을래요? 일요일에 테니스 치지 않을래요? 내일 자전거로 학교에 가지 않을래요? 벌써 어두워졌네요. 집에 가지 않을래요? 사진을 찍어 주지 않겠어요? 제 일을 도와주지 않겠어요?"}, {"id": 32, "ja": "ましょう", "ko": "~합시다 (ましょう)", "en": "let's ~; shall we ~", "cat": "부탁·권유·허가·금지", "g": 2, "d": "함께 무언가를 하자고 제안할 때 쓰는 「ましょう」.", "n": 28, "ne": 10, "kw": "~합시다, ~하죠 (권유·제안) 갑시다! 역에서 만납시다! 벌써 밥 먹을 시간이야, 빨리 먹읍시다! 집에 가기 전에 교실을 깨끗이 합시다. 함께 일본어를 공부합시다! 벌써 어두워졌으니까 집에 갑시다. 다음 주에 초밥을 먹으러 가요! 10시가 되면 나갑시다. 전등을 켜서 방을 밝게 합시다. 결정하기 전에 데이터를 더 수집합시다."}, {"id": 33, "ja": "ましょうか", "ko": "~할까요? (ましょうか)", "en": "shall I ~; used to offer help to the listener", "cat": "부탁·권유·허가·금지", "g": 2, "d": "상대에게 도움을 제안하거나 '~할까요?'라고 물을 때 쓰는 「ましょうか」.", "n": 28, "ne": 8, "kw": "~할까요? (제가 ~해 드릴까요?, 우리 ~할까요?) 창문을 열까요? 도와드릴까요? 짐을 들어 드릴까요? 택시를 불러 드릴까요? 제가 설거지를 할까요? 사진을 찍어 드릴까요? 샐러드를 만들까요? 다음 회의는 다음 주로 할까요? 아니면 다다음 주가 좋을까요?"}, {"id": 34, "ja": "も", "ko": "~도 (も)", "en": "too; also; as well", "cat": "조사", "g": 2, "d": "'~도'를 뜻하는 조사. 앞의 조사 「は」「が」「を」 자리에 대신 들어가요.", "n": 28, "ne": 9, "kw": "~도, ~(이)나, ~도 또한 저도 할 수 있어. 단 것도 매운 것도 좋아해요. 노래방에는 모두가 왔습니다. 선생님도 왔습니다. 저는 일본어도 영어도 베트남어도 할 수 있어요. 당신도 배고프죠? 저도 일본어를 공부하고 있어요! 제 아내도 아이도 옵니다. 저도 일본에서 유학한 적이 있어요. 출근할 때 자전거도 전철도 이용하고 있습니다."}, {"id": 35, "ja": "もう", "ko": "벌써, 이제, 더 (もう)", "en": "already; anymore; again; other", "cat": "시간·상태·정도·비교", "g": 2, "d": "상황에 따라 '이미', '더 이상', '더', '또'를 나타내는 다용도 부사 「もう」.", "n": 28, "ne": 10, "kw": "이미, 벌써 / 이제 (~않다) / 더, 또 / 아이참 (짜증) 벌써 점심시간이야. 빨리 먹읍시다! 숙제는 벌써 끝났어? 맥주 한 잔 더 주세요! 음료는 전부 마셨습니다. 이제 없습니다. 조금만 더 기다려 주세요. 커피는 이제 마시지 않기로 했습니다. 이 더위는 이제 견딜 수 없다. 더는 참을 수 없어. 벌써 10시인데 그는 아직 자고 있습니다. 그녀와 결혼한 지 벌써 5년이 됩니다."}, {"id": 36, "ja": "な-adjectives", "ko": "な형용사", "en": "na-adjectives", "cat": "이다·형용사", "g": 2, "d": "명사를 꾸밀 때 「な」가 붙는 형용사. 명사처럼 활용해서 익히기 쉬워요.", "n": 28, "ne": 8, "kw": "な형용사 (명사를 꾸밀 때 な가 붙는 형용사)와 그 활용 이 동네는 아주 조용합니다. 그녀는 노래를 잘하지 않습니다. 저는 고양이를 좋아합니다. 저 사람은 유명한 가수입니다. 어제의 공원은 깨끗했습니다. 이 방은 깨끗하지 않았다. 여기는 번화한 동네입니다. 형은 요리를 잘했다."}, {"id": 37, "ja": "なあ", "ko": "~네, ~일까 (なあ)", "en": "sentence ending particle; confirmation; admiration, etc", "cat": "문말 표현", "g": 2, "d": "혼잣말로 감탄하거나 궁금해할 때 쓰는 종조사 「なあ・な」. 「かな」는 '~일까?'.", "n": 26, "ne": 9, "kw": "~네, ~구나, ~일까 (감탄·희망·혼잣말·확인의 종조사) 사람이 정말 많네. 이거 정말 맛있다. 점점 더워지네. 그게 정말일까…? 내일은 날씨가 갤까? 화장실은 어디일까…? 머리가 아프다…. 새 자전거가 갖고 싶다~. 혼자서 전부 만들었어요? 정말 대단하다!"}, {"id": 38, "ja": "ないで", "ko": "~하지 않고 (ないで)", "en": "without doing~ ; To do [B] without doing [A]", "cat": "부탁·권유·허가·금지", "g": 2, "d": "어떤 행동을 하지 않은 채로 다른 행동을 할 때 쓰는 「ないで」.", "n": 28, "ne": 8, "kw": "~하지 않고, ~하지 않은 채로 커피에는 항상 설탕을 넣지 않고 마십니다. 그녀는 우산을 들지 않고 나가 버렸다. 어제는 피곤해서 불을 끄지 않고 자 버렸다. 오늘 아침 아침밥을 먹지 않고 출근했습니다. 어제 목욕을 하지 않고 자 버렸다. 내일은 시험이라 오늘 밤은 자지 않고 공부합니다. 요즘 시원해서 에어컨을 켜지 않고 잡니다. 아침밥을 먹지 않고 학교에 왔더니 배가 고프다."}, {"id": 39, "ja": "ないでください", "ko": "~하지 말아 주세요 (ないでください)", "en": "please don't do", "cat": "부탁·권유·허가·금지", "g": 2, "d": "상대에게 하지 말아 달라고 정중하게 부탁할 때 쓰는 「ないでください」.", "n": 28, "ne": 7, "kw": "~하지 말아 주세요, ~하지 마세요 울지 말아 주세요. 이 컴퓨터를 사용하지 말아 주세요. 내일 약속을 잊지 마세요! 저를 걱정하지 마세요. 길을 막지 말아 주세요. 사무실에서 먹지 말아 주세요. 혼자 있고 싶으니까 여기에 오지 말아 주세요."}, {"id": 40, "ja": "なくてもいい", "ko": "~하지 않아도 된다 (なくてもいい)", "en": "don't have to", "cat": "부탁·권유·허가·금지", "g": 2, "d": "하지 않아도 괜찮다고 말하는 표현. ない형의 い를 くて로 바꿔요.", "n": 28, "ne": 10, "kw": "~하지 않아도 된다, ~할 필요 없다 내일은 휴일이니까 학교에 가지 않아도 된다. 공항까지 오지 않아도 돼. 좋아하지 않으면 먹지 않아도 돼요. 오지 않아도 돼요. 저 혼자 갈 테니까. 무리하지 않아도 돼요. 내일은 수업이 없으니까 대학에 가지 않아도 됩니다. 시간이 아직 많이 있으니까 그렇게 서두르지 않아도 돼. 외식하지 않아도 돼. 집에서 먹자. 그 책은 줄게, 돌려주지 않아도 되니까. 초등학생 이하는 돈을 내지 않아도 됩니다."}, {"id": 41, "ja": "なくちゃ", "ko": "~해야 한다 (なくちゃ)", "en": "must do; need to; gotta do", "cat": "부탁·권유·허가·금지", "g": 3, "d": "의무를 나타내는 회화체. ない형의 「い」를 빼고 「くちゃ」를 붙여요.", "n": 28, "ne": 10, "kw": "~해야 한다, ~해야겠다 (회화체 의무) 가야겠다. 벌써 자야겠다. 새 차를 사야지. 잘 생각해야 해. 너여야만 해! 그는 갚아야 하는 빚이 있다. 왜 내가 해야 하는 거야? 바로 경찰에 연락해야 합니다. 돌봐야 하는 아이가 있다. 미안해요. 빨리 집에 가야 해요."}, {"id": 42, "ja": "なくてはいけない", "ko": "~해야 한다 (なくてはいけない)", "en": "must do; need to do", "cat": "부탁·권유·허가·금지", "g": 3, "d": "의무를 나타내는 표현. ない형의 い를 くて로 바꾸고 「はいけない」를 붙여요.", "n": 28, "ne": 10, "kw": "~해야 한다, ~하지 않으면 안 된다 정말 지금 바로 가야 한다. 서둘러야 한다. 벌써 10시다. 자야 한다. 일본어를 더 공부해야 한다. 꽃에 물을 줘야 합니다. 내일 일찍 일어나야 합니다. 채소를 먹어야 해요! JLPT를 봐야 합니다. 이제 돌아가야 합니다. 일본어 실력을 향상시켜야 합니다."}, {"id": 43, "ja": "なくてはならない", "ko": "~해야 한다 (なくてはならない)", "en": "must do; need to do", "cat": "부탁·권유·허가·금지", "g": 3, "d": "「なくてはいけない」와 같은 뜻의 의무 표현. 「ならない」를 써요.", "n": 28, "ne": 10, "kw": "~해야 한다, ~하지 않으면 안 된다 서둘러야 한다. 정말 지금 바로 가야 한다. 벌써 10시다. 자야 한다. 일본어를 더 공부해야 한다. 꽃에 물을 줘야 합니다. 내일 일찍 일어나야 합니다. 채소를 먹어야 해요! 일본어능력시험을 봐야 합니다. 이제 돌아가야 합니다. 일본어 실력을 향상시켜야 합니다."}, {"id": 44, "ja": "なる", "ko": "~이/가 되다, ~해지다 (なる)", "en": "to become", "cat": "시간·상태·정도·비교", "g": 3, "d": "상태의 변화를 나타내는 「なる」. 명사·な형용사는 「になる」, い형용사는 「くなる」.", "n": 28, "ne": 10, "kw": "~이/가 되다, ~해지다 커졌네! (점점 커지고 있네) 오늘은 더워질 것 같다. 올해 저는 20세가 됩니다. 어두워지기 전에 집에 가고 싶다. 더 강해지기 위해 매일 운동하고 있습니다. 일본어가 능숙해지고 있네요. 장래에 무엇이 되고 싶으세요? 6월에 들어서 좀 더워졌네. 어두워졌네요. 슬슬 돌아갈까요? 오늘 행사는 취소되었습니다."}, {"id": 45, "ja": "んです", "ko": "~(인) 거예요 (んです)", "en": "to explain something; show emphasis", "cat": "문말 표현", "g": 3, "d": "이유를 설명하거나 감정을 강조할 때 쓰는 「んです」. 반말은 「んだ」.", "n": 28, "ne": 8, "kw": "~(인) 거예요, ~(거)든요 (설명·이유·강조) 뭘 마시고 싶으세요? 차를 마시고 싶어요. 졸리지 않으세요? 몸 상태가 좋지 않거든요. 지금부터 아르바이트하러 가. 나는 아침에 약해. 언젠가 일본에 갈 거야! 사고 싶은데 돈이 없어."}, {"id": 46, "ja": "ね", "ko": "~네요, ~죠? (ね)", "en": "isn't it? right? eh?", "cat": "문말 표현", "g": 3, "d": "상대에게 동의를 구하거나 공감할 때 문장 끝에 붙이는 「ね」.", "n": 28, "ne": 10, "kw": "~네요, ~죠?, ~지? (공감·확인의 종조사) 귀엽네. 그렇네요. 오늘 날씨가 좋네요. 나중에 봐! 또 메일할게, 알았지? 그거 힘들겠네요. 아주 피곤한 목소리네. (괜찮아?) 일본어를 잘하시네요! 당신은 운동을 못하네요. (그렇죠?) 오늘도 하루 힘내요, 알았죠?"}, {"id": 47, "ja": "に", "ko": "~에 (に)", "en": "destination particle; in; at; on; to", "cat": "조사", "g": 3, "d": "존재하는 장소, 시각, 목적지, 대상을 나타내는 조사 「に」의 쓰임을 배워요.", "n": 26, "ne": 9, "kw": "~에, ~에게, ~(으)로 (장소·시간·도착점·대상) 다음 달 대학에 들어간다. 어떻게 학교에 다니고 있어요? 당신은 몇 시에 슈퍼에 갑니까? 그는 대학에 들어가기 위한 노력을 하고 있다. 일본에 온 적은 있습니까? 저 나무 아래에 큰 개가 있습니다. 지금 집 안에 있어요. 여기에 이름을 써 주세요. 미국에는 어느 정도 체류합니까?"}, {"id": 48, "ja": "にいく", "ko": "~하러 가다 (にいく)", "en": "go to do", "cat": "존재·희망·의지", "g": 3, "d": "목적을 가지고 어딘가에 갈 때 쓰는 「に行く」. 동사 ます형 + に行く.", "n": 28, "ne": 10, "kw": "~하러 가다, ~하러 갔다 (목적) 친구 집에 놀러 간다. 일본에 공부하러 갈 생각이에요! 도쿄에는 뭐 하러 가? 우리는 공원에 축구하러 갈 생각이다. 멕시코에 친구를 만나러 갑니다. 잠깐 뛰고 올게요. 내일 친구와 함께 일본 음식을 먹으러 갑니다. 저는 이번에는 베트남으로 여행하러 갑니다. 쓰레기를 버리러 갑니다. 오늘 밤 라멘 먹으러 갑시다!"}, {"id": 49, "ja": "にする", "ko": "~(으)로 하다 (にする)", "en": "to decide on", "cat": "존재·희망·의지", "g": 3, "d": "여러 선택지 중에서 하나를 정하거나, 어떤 상태로 만들 때 쓰는 「にする」.", "n": 28, "ne": 9, "kw": "~(으)로 하다, ~(으)로 정하다, ~하게 만들다 어느 걸로 할래? 마실 건 뭘로 할래? 차로 할게. 나는 내일과 다음 주 화요일을 쉬는 날로 한다. 이걸로 하겠습니다. 오늘은 방을 깨끗이 하겠습니다. 너를 행복하게 해 줄게. 홍차로 하시겠어요, 아니면 커피로 하시겠어요? 올해는 멋진 해로 만들 거예요!"}, {"id": 50, "ja": "に/へ", "ko": "~로, ~에 (に/へ 방향)", "en": "to (indicates direction / destination)", "cat": "조사", "g": 3, "d": "가는 방향이나 목적지를 나타낼 때 「に」와 「へ」는 바꿔 쓸 수 있어요.", "n": 28, "ne": 8, "kw": "~로, ~에 (방향·목적지) 일본에 돌아가고 싶다. 일본에 온 적이 있습니까? 어떻게 학교에 다니고 있어요? 오늘은 회사에 가고 싶지 않다. 어디에 갔어요? 집으로 향하고 있는 중입니다. 거기에 가려면 차로 6시간 걸린다. 매년 홋카이도에 스키를 타러 간다."}, {"id": 51, "ja": "の", "ko": "~의 (の)", "en": "possessive particle", "cat": "조사", "g": 3, "d": "명사와 명사를 이어 '~의'를 나타내는 소유 조사 「の」.", "n": 28, "ne": 9, "kw": "~의, ~의 것 (소유·소속·수식) 당신의 이름은 무엇입니까? 당신의 개입니까? 이것은 누구의 가방입니까? 제 선생님은 아주 좋은 선생님이다. 남자친구가 좋아하는 요리는 카레입니다. 여자친구의 아버지는 아주 무섭습니다. 제가 가장 좋아하는 계절은 가을이다. 이 카메라는 제 것이 아니라 친구 것입니다. 여름 더위 때문에 저는 수면이 부족합니다."}, {"id": 52, "ja": "のです", "ko": "~(인) 겁니다 (のです)", "en": "to explain something; show emphasis", "cat": "문말 표현", "g": 3, "d": "「んです」와 같은 표현. 「のです」는 좀 더 격식을 차린 말투예요.", "n": 28, "ne": 8, "kw": "~(인) 겁니다, ~(거)든요 (설명·이유·강조) 어디에 가고 싶은 겁니까? 어떻게 다른 거야? 무엇을 말하고 싶은 겁니까? 당신은 상냥하군요. 점심을 먹지 않았군요. 오늘은 학교에 가는군요. 네가 나쁜 거야. 먹기 위해 사는 것이 아니다. 살기 위해 먹는 것이다."}, {"id": 53, "ja": "のが下手", "ko": "~하는 게 서툴다 (のが下手)", "en": "to be bad at doing something", "cat": "시간·상태·정도·비교", "g": 3, "d": "동사 사전형 뒤에 「のが下手」를 붙여 '~하는 게 서툴다'고 말해요.", "n": 28, "ne": 7, "kw": "~하는 것이 서툴다, ~을 못하다 그는 젓가락을 쓰는 게 서투르다. 어머니는 요리를 못하신다. 나는 사람과 이야기하는 게 서툴다. 한자를 공부하는 게 서툴러요. 일본어 글자를 쓰는 게 서툴다. 언니는 노래를 못 부른다고 생각해요. 트라이애슬론을 해 보고 싶지만 수영이 서툴다."}, {"id": 54, "ja": "のが上手", "ko": "~하는 게 능숙하다 (のが上手)", "en": "to be good at", "cat": "시간·상태·정도·비교", "g": 3, "d": "동사 사전형 뒤에 「のが上手」를 붙여 '~하는 걸 잘한다'고 말해요.", "n": 28, "ne": 8, "kw": "~하는 것이 능숙하다, ~을 잘하다 당신은 가르치는 걸 잘해요. 그는 노래를 잘한다. 그녀는 피아노를 잘 친다. 당신은 젓가락을 잘 쓰시네요. 저는 그다지 일본어를 잘 말하지 못합니다. 고등학교 때는 운동을 잘했지만 지금은 다르다. 저는 어머니만큼 요리를 잘하지 못합니다. 시간을 관리하는 걸 잘하지 못한다."}, {"id": 55, "ja": "のが好き", "ko": "~하는 걸 좋아하다 (のが好き)", "en": "to like doing something", "cat": "시간·상태·정도·비교", "g": 3, "d": "동사 사전형 뒤에 「のが好き」를 붙여 '~하는 걸 좋아한다'고 말해요.", "n": 28, "ne": 9, "kw": "~하는 것을 좋아하다 저는 자는 걸 좋아해요. 만화책 읽는 걸 좋아한다. 여동생은 요리하는 걸 좋아해요. 너, 운동하는 거 좋아하는구나. 그녀는 야구 경기를 보는 걸 좋아해요. 저는 무언가를 먹으면서 영화 보는 걸 정말 좋아해요. 기차와 버스 중 어느 쪽을 타는 걸 좋아해요? 제 남편은 제가 밤에 외출하는 걸 좋아하지 않는다. 많은 일본 사람들은 많은 사람 앞에서 자기 의견을 표현하는 걸 좋아하지 않는다."}, {"id": 56, "ja": "の中で[A]が一番", "ko": "~ 중에서 A가 가장 ~ (の中でAが一番)", "en": "out of this group, [A] is best", "cat": "시간·상태·정도·비교", "g": 3, "d": "어떤 그룹 안에서 1등인 것을 말하는 비교 표현.", "n": 28, "ne": 8, "kw": "~ 중에서 (A)가 가장 ~하다 가족 중에서 아버지가 가장 키가 큽니다. 팀에서 야마다가 가장 강하다! 일본 음식 중에서 라멘을 가장 좋아한다. 반에서 제시카가 가장 똑똑하다. 세계에서 일본이 가장 안전한 나라입니다. 그녀는 반에서 글씨가 가장 예쁘다. 친구들 중에서는 크리스가 가장 선배다. 읽은 책 중에서 해리 포터를 가장 좋아한다."}, {"id": 57, "ja": "ので", "ko": "~이기 때문에, ~니까 (ので)", "en": "because of; given that; since", "cat": "접속·이유", "g": 3, "d": "이유를 부드럽게 설명하는 「ので」. 명사·な형용사는 「なので」가 돼요.", "n": 28, "ne": 8, "kw": "~이기 때문에, ~니까 (객관적인 이유) 좀 추우니까 창문을 닫아도 될까요? 잠깐 볼일이 있어서 먼저 돌아가겠습니다. 태풍이 오니까 내일 수업에는 오지 않아도 됩니다. 배가 아프니까 약을 주세요. 그녀가 아주 예뻐서 금방 좋아하게 되었습니다. 지금부터 가니까 잠시만 기다려 주세요. 비가 내리고 있었기 때문에 시합이 중지되었습니다. 왼손으로 먹으려 했지만 어려웠기 때문에 그만두었습니다."}, {"id": 58, "ja": "を", "ko": "~을/를 (を)", "en": "object marker particle", "cat": "조사", "g": 3, "d": "동작의 대상(목적어)을 나타내는 조사 「を」. '명사 + を + 동사' 형태로 써요.", "n": 28, "ne": 8, "kw": "~을/를 (목적어를 나타냄) 일본어를 공부하고 있습니다. 일본어를 말합니다. 오늘은 아침밥을 먹지 않았습니다. 벌써 숙제를 했습니다. 매일 달리기를 합니다. 생선을 먹은 적이 없다. 매주 새 한자를 배운다. 피자를 먹는 것을 아주 좋아한다."}, {"id": 59, "ja": "をください", "ko": "~을/를 주세요 (をください)", "en": "please give me~", "cat": "부탁·권유·허가·금지", "g": 3, "d": "물건이나 도움을 달라고 정중히 요청하는 표현. 주문할 때도 많이 써요.", "n": 28, "ne": 8, "kw": "~을/를 주세요 실례합니다, 물 좀 주세요. 이걸 주세요. 커피 두 잔 주세요. 시간을 조금 주세요. 바로 답장을 주세요. 저희에게 조언을 해 주세요. 역에 도착하면 전화 주세요. 배가 아프니까 약을 주세요."}, {"id": 60, "ja": "しかし", "ko": "그러나, 하지만 (しかし)", "en": "but; however", "cat": "접속·이유", "g": 3, "d": "앞 내용과 반대되는 말을 이을 때 쓰는, 「でも」보다 딱딱한 접속사.", "n": 28, "ne": 8, "kw": "그러나, 하지만 (접속사) 그런데 왜? (반대 의견) 일본을 아주 좋아합니다. 하지만 일본의 여름은 매우 덥습니다. 오늘 수업은 어려웠습니다. 하지만 즐거웠습니다! 하지만 문제가 있을지도 모른다. 겨울은 춥다, 하지만 나는 좋아한다. 하지만 그는 일본어를 말하는 것도 쓰는 것도 할 수 없습니다. 일본 요리는 물론 맛있습니다. 하지만 미국 요리를 더 좋아합니다. 당신은 아마 옳을 것입니다. 하지만 저는 조금 다른 의견을 가지고 있습니다."}, {"id": 61, "ja": "すぎる", "ko": "너무 ~하다 (すぎる)", "en": "too much", "cat": "시간·상태·정도·비교", "g": 4, "d": "정도가 지나칠 때 쓰는 「すぎる」. 동사·형용사 어간에 붙여요.", "n": 28, "ne": 10, "kw": "너무 ~하다, 지나치게 ~하다 이 셔츠는 너무 크다. 올해 여름은 너무 더웠다. 겨울이 너무 일찍 왔다. 이 문제는 너무 쉽습니다. 너무 행복해서 죽을 것 같다. 한자를 외우는 것은 저에게는 너무 어렵다. 이 레스토랑은 좀 너무 비싸다. 다른 곳으로 합시다. 이 회사는 월급이 너무 적습니다. 미안해요, 제가 좀 너무 심하게 말했네요. 어젯밤에 좀 너무 많이 마셨습니다."}, {"id": 62, "ja": "たことがある", "ko": "~한 적이 있다 (たことがある)", "en": "to have done something before", "cat": "시간·상태·정도·비교", "g": 4, "d": "과거의 경험을 말할 때 쓰는 「たことがある」. 동사 た형에 붙여요.", "n": 28, "ne": 9, "kw": "~한 적이 있다 / ~한 적이 없다 (경험) 이걸 본 적이 있다. 프랑스에 간 적이 있다. 그것을 들은 적이 있다. 딱 한 번 노래방에 가 본 적이 있습니다. 일본에 가 본 적 있어요? 일본은 좋아하지만 가 본 적이 없다. 정말 차를 운전해 본 적이 없습니까? 이건 아무에게도 말한 적이 없습니다. 저는 초밥을 딱 한 번밖에 먹어 본 적이 없습니다."}, {"id": 63, "ja": "たい", "ko": "~하고 싶다 (たい)", "en": "want to do something", "cat": "존재·희망·의지", "g": 4, "d": "자신이 하고 싶은 일을 말할 때 쓰는 「たい」. 동사 ます형에 붙이고, い형용사처럼 활용해요.", "n": 28, "ne": 8, "kw": "~하고 싶다 일본어를 더 공부하고 싶습니다. 선생님, 여쭤보고 싶은 게 있는데요. 빨리 결혼하고 싶다. 자전거가 고장 났으니까 새것을 사고 싶다. 어릴 때부터 계속 일본에 가고 싶었다. 피곤해서 이제 공부하고 싶지 않다. 장래에는 일본 회사에서 일하고 싶습니다. 돈이 많이 있다면 무엇을 하고 싶습니까?"}, {"id": 64, "ja": "たり～たり", "ko": "~하기도 하고 ~하기도 하다 (たり～たり)", "en": "do such things as A and B", "cat": "시간·상태·정도·비교", "g": 4, "d": "여러 동작이나 상태를 예로 들 때 쓰는 「たり～たり」.", "n": 28, "ne": 9, "kw": "~하기도 하고 ~하기도 하다, ~하거나 ~하거나 하다 쉬는 날은 수요일이기도 하고 일요일이기도 합니다. 일요일에는 쇼핑을 하거나 영화를 보거나 했다. 우리 가게는 바쁠 때도 있고 한가할 때도 있습니다. 오늘은 숙제를 하거나 방 청소를 하거나 해서 바쁩니다. 겨울방학에는 한자를 공부하거나 운동하거나 할 생각입니다. 한가할 때는 영화를 보거나 음악을 듣거나 한다. 도서관에는 책이나 잡지를 읽거나 공부하거나 하는 사람이 많다. 유학 중에 현지 요리를 먹거나 여행하거나 했습니다. 누구라도 실수를 하거나 실패하거나 합니다."}, {"id": 65, "ja": "てある", "ko": "~해 있다, ~해 두었다 (てある)", "en": "is/has been done (resulting state)", "cat": "시간·상태·정도·비교", "g": 4, "d": "누군가 의도적으로 한 일의 결과가 남아 있는 상태를 나타내는 「てある」.", "n": 28, "ne": 8, "kw": "~해져 있다, ~해 두었다 (의도적 행동의 결과 상태) 여기에는 제 이름이 쓰여 있습니다. 문이 일부러 열려 있다. 숙제는 이미 해 두었습니다. 밤에는 학교 입구가 닫혀 있다. 여기에 뭐라고 쓰여 있어? 요리가 만들어져 있으니까 오늘은 집에서 먹는다. 테니스를 치자. 10시 30분에 코트를 예약해 뒀으니까. 이미 말해 둔 것처럼, 이것도 당신 일의 일부다."}, {"id": 66, "ja": "ている", "ko": "~하고 있다, ~해 있다 (ている)", "en": "ongoing action or current state", "cat": "시간·상태·정도·비교", "g": 4, "d": "동작의 진행뿐 아니라 계속·습관·상태까지 나타내는 「ている」의 5가지 쓰임.", "n": 29, "ne": 8, "kw": "~하고 있다, ~해 있다 (진행·계속·습관·상태) 점심은 뭘 먹어? 저도 그 책을 읽고 있어요! 언제부터 축구를 하고 있습니까? 오늘 일본은 비가 내리고 있습니다. 일본에 얼마나 살고 있습니까? 그 가게는 몇 시까지 영업하고 있습니까? 야마다 씨는 아직 자고 있다고 생각해요. 저도 당신을 사랑하고 있어요."}, {"id": 67, "ja": "てから", "ko": "~하고 나서 (てから)", "en": "after doing~", "cat": "시간·상태·정도·비교", "g": 4, "d": "한 가지 일을 끝낸 뒤 다음 일을 할 때 쓰는 「てから」. 동사 て형에 붙여요.", "n": 28, "ne": 8, "kw": "~하고 나서, ~한 후에, ~한 뒤로 화장실을 사용한 후에는 손을 씻어야 합니다. 쇼핑을 하고 나서 집에 돌아갑니다. 밥을 먹고 나서 산책했습니다. 오늘은 일어나서 아직 아무것도 먹지 않았습니다. 미국에 귀국한 뒤로 살이 쪘습니다. 그가 금연한 지 2개월이 지났다. 전화를 하고 나서 와 주세요. 빈 캔은 찌그러뜨린 다음에 쓰레기로 내놓아 주세요."}, {"id": 68, "ja": "てください", "ko": "~해 주세요 (てください)", "en": "please do", "cat": "부탁·권유·허가·금지", "g": 4, "d": "상대에게 정중하게 부탁하거나 요청할 때 쓰는 「てください」.", "n": 29, "ne": 9, "kw": "~해 주세요, ~하세요 잠깐 기다려 주세요. 그만해 주세요! 더 천천히 말해 주세요. 조용히 해 주세요. 한번 해 보세요! 자, 앉으세요. 선생님, 이 문제를 모르겠어요. 한 번 더 설명해 주세요. 일본어를 가르쳐 주세요. 저에게 알려 주세요."}, {"id": 69, "ja": "てはいけない", "ko": "~하면 안 된다 (てはいけない)", "en": "must not; may not; cannot", "cat": "부탁·권유·허가·금지", "g": 4, "d": "규칙이나 금지를 나타내는 「てはいけない」. 「ちゃいけない」의 정식 표현이에요.", "n": 28, "ne": 10, "kw": "~하면 안 된다, ~해서는 안 된다 (금지) 창문을 열면 안 된다. 거짓말을 해서는 안 된다. 복도를 뛰면 안 돼요. 도서관에서 떠들면 안 된다. 오늘 시험이 있으니까 지각하면 안 된다. 실내에서 담배를 피우면 안 돼요. 웃으면 안 되는 농담이었다. 수업 중에 휴대전화를 사용하면 안 됩니다. 20세 미만인 사람은 술을 마시면 안 됩니다. 금연이란 담배를 피워서는 안 된다는 뜻입니다."}, {"id": 70, "ja": "てもいいです", "ko": "~해도 된다 (てもいいです)", "en": "is OK to..; is alright to..; may I..?", "cat": "부탁·권유·허가·금지", "g": 4, "d": "허가를 구하거나 허락할 때 쓰는 「てもいいです」.", "n": 27, "ne": 9, "kw": "~해도 된다, ~해도 괜찮다, ~해도 될까요? 화장실에 가도 됩니까? 응, 가도 돼요! 그거 먹어도 됩니까? 나도 같이 가도 돼? 여기에 앉아도 됩니까? 질문 하나 해도 될까요? 당신과 같이 가도 돼요. 지금 이야기해도 됩니까? 일부러 집에 오지 않아도 돼요."}, {"id": 71, "ja": "と", "ko": "~와/과 (と)", "en": "and; with; as; connecting particle", "cat": "조사", "g": 4, "d": "'A와 B'처럼 나열하거나 '~와 함께'라는 동반을 나타내는 조사 「と」.", "n": 29, "ne": 10, "kw": "~와/과, ~와 함께, ~(이)라고 (나열·동반) 엄마와 쇼핑하러 갔다. 그녀와 사이가 좋습니다. 당신과 이야기하고 싶지 않다. 이것과 그것은 다릅니다. 그는 베트남 사람과 결혼했다. 개와 노는 것을 아주 좋아한다. 음료와 음식 금지. 저는 항상 거기서 햄버거와 감자튀김을 먹습니다. 내일 동료와 식사하러 갈 예정입니다. 고등학교 시절 반 친구들과 연락하고 있습니까?"}, {"id": 72, "ja": "とき", "ko": "~할 때 (とき)", "en": "when; at this time", "cat": "시간·상태·정도·비교", "g": 4, "d": "어떤 상황이나 시점을 나타내는 「とき」. 앞에 오는 말에 따라 형태가 달라요.", "n": 28, "ne": 10, "kw": "~할 때, ~일 때 모를 때는 빨리 선생님께 물어봐요. 길을 건널 때 차를 조심하세요. 시간이 없을 때는 아침밥을 먹지 않습니다. 몸 상태가 안 좋을 때 따뜻한 차를 마십니다. 졸릴 때 항상 초콜릿을 먹습니다. 도서관에서 책을 빌릴 때 카드가 필요합니다. 아내가 아팠을 때 회사를 쉬었습니다. 한가할 때 유튜브를 봅니다. 중학생 때 처음 일본에 왔습니다. 저녁밥을 먹을 때 항상 우유를 마십니다."}, {"id": 73, "ja": "とても", "ko": "매우, 아주 (とても)", "en": "very; awfully; exceedingly", "cat": "시간·상태·정도·비교", "g": 4, "d": "정도를 강조하는 부사 「とても」. 형용사·동사 앞에 붙여요.", "n": 28, "ne": 8, "kw": "매우, 아주, 대단히 오늘은 아주 덥네요. 1월과 2월은 아주 춥습니다. 이 카레는 아주 맵네요. 그들은 아주 닮았다. 부모님을 매우 사랑한다. 어제 본 영화는 아주 재미있었다. 이 책, 아주 재미있어요. 읽어 보는 게 좋아요. 그는 아주 피곤해 보인다."}, {"id": 74, "ja": "つもり", "ko": "~할 생각이다 (つもり)", "en": "plan to ~; intend to ~", "cat": "존재·희망·의지", "g": 4, "d": "앞으로의 계획이나 의도를 말할 때 쓰는 「つもり」.", "n": 29, "ne": 8, "kw": "~할 생각이다, ~할 작정이다 오늘은 라멘을 먹을 생각이다. 당신들도 갈 생각입니까? 대학에 들어가서 일본어를 공부할 생각입니다. 몇 번을 물어봐도 당신에게 알려 줄 생각은 없습니다. 언제 일본에 유학 갈 생각이야? 들키면 어떻게 할 생각이야? 미안해요! 당신에게 상처를 줄 생각은 아니었어요. 만약 JLPT에 붙으면 일본 회사에서 일할 생각이다."}, {"id": 75, "ja": "は", "ko": "~은/는 (は)", "en": "topic marker", "cat": "조사", "g": 4, "d": "말하는 화제를 나타내는 조사 「は」. 읽을 때는 「わ」로 발음해요.", "n": 29, "ne": 8, "kw": "~은/는 (화제를 나타내는 조사) 저는 존입니다. 그것은 재미있다. 오늘은 전철로 왔습니다. 금요일은 한가합니까? 운동을 하는 것은 싫습니다. 좋아하는 음식은 무엇입니까? 제 대학은 그 역 근처에 있다. 그를 설득하는 것은 불가능했다."}, {"id": 76, "ja": "は～より・・・です", "ko": "A는 B보다 ~다 (はより)", "en": "[A] is more ~ than [B]", "cat": "시간·상태·정도·비교", "g": 4, "d": "두 명사를 비교할 때 쓰는 「は～より…です」.", "n": 28, "ne": 7, "kw": "A는 B보다 ~하다 (비교) 책은 영화보다 재미있습니다. 오늘은 어제보다 바쁩니다. 전철은 버스보다 빠릅니다. 미국인은 일본인보다 키가 큽니다. 홋카이도는 대만보다 큽니다. 에베레스트산은 후지산보다 높습니다. 한자는 가타카나보다 어렵습니다."}, {"id": 77, "ja": "はどうですか", "ko": "~은 어때요? (はどうですか)", "en": "how about; how is", "cat": "조사", "g": 4, "d": "상대의 인상이나 의견을 물을 때 쓰는 「はどうですか」.", "n": 28, "ne": 8, "kw": "~은 어떻습니까? ~은 어때요? 내일은 어때요? 일본은 어때요? 날씨는 어때요? 쇼핑하러 가는 건 어때요? 일본어 공부는 어때요? 제 일본어 발음은 어때요? 새 학교는 어때요? 친구는 생겼어요? const CATS = ["문말 표현", "부탁·권유·허가·금지", "시간·상태·정도·비교", "의문", "이다·형용사", "접속·이유", "조사", "존재·희망·의지"];
const $ = s => document.querySelector(s);
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
const PROG='jap-gra-n5-progress';
const fmt = n => (Math.round(n*10)/10).toString();
const esc = s => String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
let filter='all';
function render(q){
  const pr = store.get(PROG) || {};
  const done = IDX.filter(c=>pr['ch'+c.id]).length;
  const got = IDX.reduce((a,c)=>a+(pr['ch'+c.id]?pr['ch'+c.id].score:0),0);
  const tot = IDX.reduce((a,c)=>a+(pr['ch'+c.id]?pr['ch'+c.id].total:0),0);
  q=(q||'').trim().toLowerCase();
  let last=null, cards='', shown=0;
  IDX.forEach(c=>{
    if(filter==='todo' && pr['ch'+c.id]) return;
    if(filter.startsWith('cat:') && c.cat!==filter.slice(4)) return;
    if(q && !(String(c.id)===q || (c.ja+' '+c.ko+' '+c.en+' '+c.d+' '+c.kw+' '+c.cat).toLowerCase().includes(q))) return;
    if(c.g!==last){ last=c.g; cards+=`<div class="grp">${PARTS[c.g][0]}<small translate="no">${PARTS[c.g][1]}</small></div>`; }
    shown++;
    const p=pr['ch'+c.id];
    cards+=`
      <a class="card" href="Lesson${c.id}/">
        <div class="no">${c.id}<span class="catchip">${esc(c.cat)}</span></div>
        <h2 class="jp" translate="no">${esc(c.ja)}</h2>
        <div class="ko">${esc(c.ko)}</div>
        <div class="desc">${esc(c.d)}</div>
        <div class="bar"><i style="width:${p?p.score/p.total*100:0}%"></i></div>
        <div class="meta"><span>예문 ${c.ne}개 · ${c.n}문제</span><span>${p?`최고 ${fmt(p.score)} / ${p.total}점`:'아직 풀지 않음'}</span></div>
        <span class="go">학습하기 →</span>
      </a>`;
  });
  if(!shown) cards='<div class="card soon"><div class="ko">검색 결과가 없어요</div></div>';
  $('#grid').innerHTML=cards;
  $('#prog').innerHTML=`<span>학습 진도 ${done} / ${IDX.length}</span><div class="bar"><i style="width:${done/IDX.length*100}%"></i></div>`;
  $('#sum').textContent = tot?`누적 최고 점수 ${fmt(got)} / ${tot}점 (${Math.round(got/tot*100)}%)`:'';
}
const byId = Object.fromEntries(IDX.map(c=>[c.id,c]));
$('#app').innerHTML = `
  <header class="wrap hero">
    <div class="eyebrow">JLPT N5 Grammar Master · 1–${IDX.length}과</div>
    <h1>JLPT N5 <em>일본어 문법</em></h1>
    <p>교재 1과부터 마지막 ${IDX.length}과까지 N5 문법을 한국어로 정리했어요. 과마다 핵심 설명과 예문(히라가나·로마자·소리 듣기)을 읽고, 연습문제를 풀어 바로 점수와 정답, 상세한 해설을 확인하세요.</p>
    <div class="who">
      <label for="stu">이름</label><input id="stu" type="text" placeholder="이름을 입력하세요" autocomplete="off">
      <div class="overall" id="prog"></div>
    </div>
    <div class="sum" id="sum" style="margin-top:8px"></div>
  </header>
  <main class="wrap">
    <ol class="steps"><li><b>설명과 예문 읽기</b> — 일본어를 누르면 소리가 나요. 히라가나·로마자·한국어 뜻은 켜고 끌 수 있어요.</li><li><b>연습문제 5종</b> — 뜻 고르기, 일본어 고르기, 빈칸 채우기, 듣고 고르기, 직접 쓰기(로마자 입력 가능)를 풀어요.</li><li><b>채점하기</b>로 점수와 정답, 해설을 확인하고 틀린 문제만 다시 풀어요.</li></ol>
    <details class="plan"><summary>📚 추천 학습 순서 (주제별로 묶어서 공부하기)</summary>
      <p>교재의 과 번호는 알파벳(로마자) 순서예요. 문법을 처음 배운다면 아래처럼 주제별로 묶어서 공부하면 이해가 쉬워요.</p>
      <div class="plan-grid">${PLAN.map(([t,d,ids])=>`<div><h3>${t} <small style="font-weight:500;color:var(--muted)">${d}</small></h3>${ids.map(i=>`<a href="Lesson${i}/"><b>${i}</b> ${esc(byId[i].ko)}</a>`).join('')}</div>`).join('')}</div>
    </details>
    <div class="tools">
      <input class="find" id="find" type="search" placeholder="과 번호·한국어·일본어 검색 (예: 때, 12, たい)" aria-label="과 검색">
      <div class="chipbar" id="chips"><button type="button" data-f="all" aria-pressed="true">전체</button>${CATS.map(c=>`<button type="button" data-f="cat:${esc(c)}" aria-pressed="false">${esc(c)}</button>`).join('')}<button type="button" data-f="todo" aria-pressed="false">아직 안 푼 과</button></div>
    </div>
    <div class="grid" id="grid"></div>
    <footer class="site">교재: JLPT N5 Grammar Master (JLPTsensei.com). 한국어 해설과 연습문제는 수업용으로 새로 만들었습니다. 예문의 히라가나와 로마자는 학습을 돕기 위해 자동 생성한 것이므로 일부 읽기에 오류가 있을 수 있어요.</footer>
  </main>`;
$('#stu').value = store.get('gdu-name')||'';
$('#stu').addEventListener('input',e=>store.set('gdu-name',e.target.value));

$('#chips').addEventListener('click',e=>{

  document.querySelectorAll('#chips button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));
  render($('#find').value);
});
render('');
</script>
<script src="assets/translate.js"></script>
