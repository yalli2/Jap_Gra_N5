<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 16, "ja": "い-adjectives", "ko": "い형용사", "en": "i-adjectives", "part": "이다·형용사", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">い형용사 (어미가 い로 끝나는 형용사)와 그 활용<\/div><div class=\"d\">い로 끝나는 형용사의 현재·과거·부정 활용을 익혀요. 자주 쓰는 형용사 목록도 있어요.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>구분<\/th><th>형태 (あつい 예시)<\/th><\/tr><\/thead><tbody><tr><td>현재 긍정<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"あつい\" title=\"눌러서 듣기\">あつい (い)<\/span><\/td><\/tr><tr><td>현재 부정<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"あつくない / あつくありません\" title=\"눌러서 듣기\">あつくない / あつくありません (い → くない)<\/span><\/td><\/tr><tr><td>과거 긍정<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"あつかった\" title=\"눌러서 듣기\">あつかった (い → かった)<\/span><\/td><\/tr><tr><td>과거 부정<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"あつくなかった / あつくありませんでした\" title=\"눌러서 듣기\">あつくなかった / あつくありませんでした (い → くなかった)<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>핵심 정리<\/h3><p>일본어 형용사는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"い형용사\" title=\"눌러서 듣기\">「い형용사(い形容詞)」<\/span>와 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"な형용사\" title=\"눌러서 듣기\">「な형용사」<\/span><a class=\"xref\" href=\"../Lesson36/\">36과 →<\/a> 두 종류가 있어요. い형용사는 끝이 항상 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"い\" title=\"눌러서 듣기\">「い」<\/span>로 끝나고, 이 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"い\" title=\"눌러서 듣기\">「い」<\/span>가 활용합니다.<\/p><h3>활용 방법 (예: あつい = 덥다)<\/h3><ul class=\"rules\"><li><b>현재<\/b>: あつ<b>い<\/b>です → 덥습니다<\/li><li><b>현재 부정<\/b>: あつ<b>くない<\/b>です → 덥지 않습니다<\/li><li><b>과거<\/b>: あつ<b>かった<\/b> → 더웠다<\/li><li><b>과거 부정<\/b>: あつ<b>くなかった<\/b> → 덥지 않았다<\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"今日はあついです。\" title=\"눌러서 듣기\"><ruby>今日<rt>きょう<\/rt><\/ruby>はあつ<b>い<\/b>です。<\/span><span class=\"rom\">kyou wa atsui desu<\/span><\/div><\/div><span class=\"k kor\">오늘은 덥습니다.<\/span><\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"今日はあつくないです。\" title=\"눌러서 듣기\"><ruby>今日<rt>きょう<\/rt><\/ruby>はあつ<b>くない<\/b>です。<\/span><span class=\"rom\">kyou wa atsuku nai desu<\/span><\/div><\/div><span class=\"k kor\">오늘은 덥지 않습니다.<\/span><\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"昨日はあつかった。\" title=\"눌러서 듣기\"><ruby>昨日<rt>きのう<\/rt><\/ruby>はあつ<b>かった<\/b>。<\/span><span class=\"rom\">kinou wa atsukata<\/span><\/div><\/div><span class=\"k kor\">어제는 더웠다.<\/span><\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"昨日はあつくなかった。\" title=\"눌러서 듣기\"><ruby>昨日<rt>きのう<\/rt><\/ruby>はあつ<b>くなかった<\/b>。<\/span><span class=\"rom\">kinou wa atsuku nakata<\/span><\/div><\/div><span class=\"k kor\">어제는 덥지 않았다.<\/span><\/li><\/ul><div class=\"note warn\"><b class=\"lab\">참고<\/b>예외! <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"いい\" title=\"눌러서 듣기\">「いい(좋다)」<\/span>는 활용할 때 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"よい\" title=\"눌러서 듣기\">「よい」<\/span>로 바뀝니다: よくない(좋지 않다), よかった(좋았다), よくなかった(좋지 않았다).<\/div><div class=\"note warn\"><b class=\"lab\">참고<\/b><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"きれい\" title=\"눌러서 듣기\">「きれい」<\/span><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ゆうめい\" title=\"눌러서 듣기\">「ゆうめい」<\/span>처럼 い로 끝나지만 な형용사인 단어도 있어요. 이런 말은 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"きれいじゃない\" title=\"눌러서 듣기\">「きれいじゃない」<\/span>처럼 활용합니다.<\/div><h3>자주 쓰는 い형용사<\/h3><h4>온도<\/h4><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>일본어<\/th><th>뜻<\/th><\/tr><\/thead><tbody><tr><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"熱い\" title=\"눌러서 듣기\">熱い (あつい)<\/span><\/td><td>뜨겁다 (물건)<\/td><\/tr><tr><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"暑い\" title=\"눌러서 듣기\">暑い (あつい)<\/span><\/td><td>덥다 (날씨)<\/td><\/tr><tr><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"温かい\" title=\"눌러서 듣기\">温かい (あたたかい)<\/span><\/td><td>따뜻하다<\/td><\/tr><tr><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"温い\" title=\"눌러서 듣기\">温い (ぬるい)<\/span><\/td><td>미지근하다<\/td><\/tr><tr><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"寒い\" title=\"눌러서 듣기\">寒い (さむい)<\/span><\/td><td>춥다 (날씨)<\/td><\/tr><tr><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"涼しい\" title=\"눌러서 듣기\">涼しい (すずしい)<\/span><\/td><td>시원하다<\/td><\/tr><tr><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"冷たい\" title=\"눌러서 듣기\">冷たい (つめたい)<\/span><\/td><td>차갑다 (만졌을 때)<\/td><\/tr><\/tbody><\/table><\/div><h4>양·가격<\/h4><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>일본어<\/th><th>뜻<\/th><\/tr><\/thead><tbody><tr><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"多い\" title=\"눌러서 듣기\">多い (おおい)<\/span><\/td><td>많다<\/td><\/tr><tr><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"少ない\" title=\"눌러서 듣기\">少ない (すくない)<\/span><\/td><td>적다<\/td><\/tr><tr><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"高い\" title=\"눌러서 듣기\">高い (たかい)<\/span><\/td><td>비싸다, 높다<\/td><\/tr><tr><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"安い\" title=\"눌러서 듣기\">安い (やすい)<\/span><\/td><td>싸다<\/td><\/tr><\/tbody><\/table><\/div><h4>크기·거리<\/h4><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>일본어<\/th><th>뜻<\/th><\/tr><\/thead><tbody><tr><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"大きい\" title=\"눌러서 듣기\">大きい (おおきい)<\/span><\/td><td>크다<\/td><\/tr><tr><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"小さい\" title=\"눌러서 듣기\">小さい (ちいさい)<\/span><\/td><td>작다<\/td><\/tr><tr><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"長い\" title=\"눌러서 듣기\">長い (ながい)<\/span><\/td><td>길다<\/td><\/tr><tr><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"短い\" title=\"눌러서 듣기\">短い (みじかい)<\/span><\/td><td>짧다<\/td><\/tr><tr><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"広い\" title=\"눌러서 듣기\">広い (ひろい)<\/span><\/td><td>넓다<\/td><\/tr><tr><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"狭い\" title=\"눌러서 듣기\">狭い (せまい)<\/span><\/td><td>좁다<\/td><\/tr><tr><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"遠い\" title=\"눌러서 듣기\">遠い (とおい)<\/span><\/td><td>멀다<\/td><\/tr><tr><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"近い\" title=\"눌러서 듣기\">近い (ちかい)<\/span><\/td><td>가깝다<\/td><\/tr><tr><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"太い\" title=\"눌러서 듣기\">太い (ふとい)<\/span><\/td><td>굵다<\/td><\/tr><tr><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"細い\" title=\"눌러서 듣기\">細い (ほそい)<\/span><\/td><td>가늘다<\/td><\/tr><\/tbody><\/table><\/div><h3>예문 10개<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"この本はおもしろいです。\" title=\"눌러서 듣기\">この<ruby>本<rt>ほん<\/rt><\/ruby>はおもし<b>ろい<\/b>です。<\/span><span class=\"rom\">kono hon wa omoshiroi desu<\/span><\/div><\/div><span class=\"k kor\">이 책은 재미있습니다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"このラーメンはおいしくないです。\" title=\"눌러서 듣기\">このラーメンはおいし<b>くない<\/b>です。<\/span><span class=\"rom\">kono raamen wa oishiku nai desu<\/span><\/div><\/div><span class=\"k kor\">이 라면은 맛있지 않습니다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"昨日の映画はおもしろかった。\" title=\"눌러서 듣기\"><ruby>昨日<rt>きのう<\/rt><\/ruby>の<ruby>映画<rt>えいが<\/rt><\/ruby>はおもしろ<b>かった<\/b>。<\/span><
