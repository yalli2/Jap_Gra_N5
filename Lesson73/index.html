ui desu ne<\/span><\/div><\/div><span class=\"k kor\">오늘은 아주 덥네요.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"1月と2月はとても寒いです。\" title=\"눌러서 듣기\">1<ruby>月<rt>がつ<\/rt><\/ruby>と2<ruby>月<rt>がつ<\/rt><\/ruby>は<b>とても<\/b><ruby>寒<rt>さむ<\/rt><\/ruby>いです。<\/span><span class=\"rom\">1 gatsu to 2 gatsu wa totemo samui desu<\/span><\/div><\/div><span class=\"k kor\">1월과 2월은 아주 춥습니다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"このカレーはとても辛いですね。\" title=\"눌러서 듣기\">このカレーは<b>とても<\/b><ruby>辛<rt>つら<\/rt><\/ruby>いですね。<\/span><span class=\"rom\">kono karee wa totemo tsurai desu ne<\/span><\/div><\/div><span class=\"k kor\">이 카레는 아주 맵네요.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"彼らはとても似ている。\" title=\"눌러서 듣기\"><ruby>彼<rt>かれ<\/rt><\/ruby>らは<b>とても<\/b><ruby>似<rt>に<\/rt><\/ruby>ている。<\/span><span class=\"rom\">karera wa totemo nite iru<\/span><\/div><\/div><span class=\"k kor\">그들은 아주 닮았다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"両親のことをとても愛している。\" title=\"눌러서 듣기\"><ruby>両親<rt>りょうしん<\/rt><\/ruby>のことを<b>とても<\/b><ruby>愛<rt>あい<\/rt><\/ruby>している。<\/span><span class=\"rom\">ryoushin no koto o totemo aishite iru<\/span><\/div><\/div><span class=\"k kor\">부모님을 매우 사랑한다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"昨日見た映画はとても面白かった。\" title=\"눌러서 듣기\"><ruby>昨日<rt>きのう<\/rt><\/ruby><ruby>見<rt>み<\/rt><\/ruby>た<ruby>映画<rt>えいが<\/rt><\/ruby>は<b>とても<\/b><ruby>面白<rt>おもしろ<\/rt><\/ruby>かった。<\/span><span class=\"rom\">kinou mita eiga wa totemo omoshirokata<\/span><\/div><\/div><span class=\"k kor\">어제 본 영화는 아주 재미있었다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"この本、とても面白いですよ。読んだ方がいい。\
