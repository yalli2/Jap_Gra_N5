>」<\/span>와 <span class=\"jt\" translate=\"no\" role=\"button\" tabindex=\"0\" data-say=\"ほしい\" title=\"눌러서 듣기\">「<span translate=\"no\">ほしい<\/span>」<\/span> 사이에 다른 말이 들어가도 괜찮아요. (예문 3번)<\/li><\/ul><div class=\"note warn\"><b class=\"lab\">참고<\/b>동사에 '~하고 싶다'를 붙일 때는 <span class=\"jt\" translate=\"no\" role=\"button\" tabindex=\"0\" data-say=\"たい\" title=\"눌러서 듣기\">「<span translate=\"no\">たい<\/span>」<\/span><a class=\"xref\" href=\"../Lesson63/\">63과 →<\/a>를 씁니다. <span class=\"jt\" translate=\"no\" role=\"button\" tabindex=\"0\" data-say=\"ほしい\" title=\"눌러서 듣기\">「<span translate=\"no\">ほしい<\/span>」<\/span>는 '물건'에만 써요.<\/div><div class=\"note warn\"><b class=\"lab\">참고<\/b>내가 아닌 다른 사람이 갖고 싶어 하는 것을 말할 때는 보통 <span class=\"jt\" translate=\"no\" role=\"button\" tabindex=\"0\" data-say=\"ほしがっている\" title=\"눌러서 듣기\">「<span translate=\"no\">ほしがっている<\/span>」<\/span>를 씁니다.<\/div><h3>예문 10개<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" translate=\"no\" role=\"button\" tabindex=\"0\" data-say=\"もっとお金が欲しいです。\" title=\"눌러서 듣기\"><span translate=\"no\">もっとお<\/span><ruby><span translate=\"no\">金<\/span><rt><span translate=\"no\">かね<\/span><\/rt><\/ruby><b><span translate=\"no\">が<\/span><ruby><span translate=\"no\">欲<\/span><rt><span translate=\"no\">ほ<\/span><\/rt><\/ruby><span translate=\"no\">しい<\/span><\/b><span translate=\"no\">です<\/span>。<\/span><span class=\"rom\" translate=\"no\">motto okane ga hoshii desu<\/span><\/div><\/div><span class=\"k kor\">더 많은 돈을 갖고 싶어요.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" translate=\"no\" role=\"button\" tabindex=\"0\" data-say=\"彼女がほしい。\" title=\"눌러서 듣기\"><ruby><span translate=\"no\">彼女<\/span><rt><span translate=\"no\">かのじょ<\/span><\/rt><\/ruby><b><span translate=\"no\">がほしい<\/span><\/b>。<\/span><span class=\"rom\" translate=\"no\">kanojo ga hoshii<\/span><\/div><\/div><span class=\"k kor\">여자친구가 갖고 싶다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=
