<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 13, "ja": "がほしい", "ko": "~을 갖고 싶다 (がほしい)", "en": "to want something", "part": "존재·희망·의지", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">~을/를 갖고 싶다, ~이 필요하다<\/div><div class=\"d\">물건을 갖고 싶을 때 쓰는 표현. 명사 뒤에 「がほしい」를 붙여요.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>앞에 오는 말<\/th><th>붙이는 형태<\/th><\/tr><\/thead><tbody><tr><td>명사<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"これ + がほしい / これ + が欲しい\" title=\"눌러서 듣기\">これ + がほしい / これ + が欲しい<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>핵심 정리<\/h3><p>무언가를 '갖고 싶다'고 말할 때는 명사 뒤에 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"がほしい\" title=\"눌러서 듣기\">「がほしい」<\/span>를 붙여요. 한자로 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"が欲しい\" title=\"눌러서 듣기\">「が欲しい」<\/span>라고도 쓰지만 일상에서는 히라가나로 많이 씁니다.<\/p><ul class=\"rules\"><li>これ<b>がほしい<\/b> → 이것을 갖고 싶다.<\/li><li>우리말로는 '~을 갖고 싶다'지만 일본어에서는 조사 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"を\" title=\"눌러서 듣기\">「を」<\/span>가 아니라 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"が\" title=\"눌러서 듣기\">「が」<\/span>를 써요. (<span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"をほしい\" title=\"눌러서 듣기\">「をほしい」<\/span>는 틀린 표현)<\/li><li><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"が\" title=\"눌러서 듣기\">「が」<\/span>와 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ほしい\" title=\"눌러서 듣기\">「ほしい」<\/span> 사이에 다른 말이 들어가도 괜찮아요. (예문 3번)<\/li><\/ul><div class=\"note warn\"><b class=\"lab\">참고<\/b>동사에 '~하고 싶다'를 붙일 때는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"たい\" title=\"눌러서 듣기\">「たい」<\/span><a class=\"xref\" href=\"../Lesson63/\">63과 →<\/a>를 씁니다. <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ほしい\" title=\"눌러서 듣기\">「ほしい」<\/span>는 '물건'에만 써요.<\/div><div class=\"note warn\"><b class=\"lab\">참고<\/b>내가 아닌 다른 사람이 갖고 싶어 하는 것을 말할 때는 보통 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ほしがっている\" title=\"눌러서 듣기\">「ほしがっている」<\/span>를 씁니다.<\/div><h3>예문 10개<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"もっとお金が欲しいです。\" title=\"눌러서 듣기\">もっとお<ruby>金<rt>かね<\/rt><\/ruby><b>が<ruby>欲<rt>ほ<\/rt><\/ruby>しい<\/b>です。<\/span><span class=\"rom\">motto okane ga hoshii desu<\/span><\/div><\/div><span class=\"k kor\">더 많은 돈을 갖고 싶어요.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"彼女がほしい。\" title=\"눌러서 듣기\"><ruby>彼女<rt>かのじょ<\/rt><\/ruby><b>がほしい<\/b>。<\/span><span class=\"rom\">kanojo ga hoshii<\/span><\/div><\/div><span class=\"k kor\">여자친구가 갖고 싶다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"お金がたくさんほしい。\" title=\"눌러서 듣기\">お<ruby>金<rt>かね<\/rt><\/ruby><b>が<\/b>たくさん<b>ほしい<\/b>。<\/span><span class=\"rom\">okane ga takusan hoshii<\/span><\/div><\/div><span class=\"k kor\">돈이 아주 많이 갖고 싶다. (が와 ほしい를 떼어 써도 됨)<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"何人子どもがほしいですか?\" title=\"눌러서 듣기\"><ruby>何人<rt>なんにん<\/rt><\/ruby><ruby>子<rt>こ<\/rt><\/ruby>ども<b>がほしい<\/b>ですか?<\/span><span class=\"rom\">nannin kodomo ga hoshii desu ka?<\/span><\/div><\/div><span class=\"k kor\">아이를 몇 명 갖고 싶으세요?<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"新しいGoProカメラが欲しいです!\" title=\"눌러서 듣기\"><ruby>新<rt>あたら<\/rt><\/ruby>しいGoProカメラ<b>が<ruby>欲<rt>ほ<\/rt><\/ruby>しい<\/b>です!<\/span><span class=\"rom\">atarashii GoPro kamera ga hoshii desu!<\/span><\/div><\/div><span class=\"k kor\">새 GoPro 카메라를 갖고 싶어요!<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"いつか自分の家が欲しいです。\" title=\"눌러서 듣기\">い
