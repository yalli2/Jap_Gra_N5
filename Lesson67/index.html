<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 67, "ja": "てから", "ko": "~하고 나서 (てから)", "en": "after doing~", "part": "시간·상태·정도·비교", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">~하고 나서, ~한 후에, ~한 뒤로<\/div><div class=\"d\">한 가지 일을 끝낸 뒤 다음 일을 할 때 쓰는 「てから」. 동사 て형에 붙여요.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>앞에 오는 말<\/th><th>붙이는 형태<\/th><\/tr><\/thead><tbody><tr><td>동사 て형<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"食べ + てから\" title=\"눌러서 듣기\">食べ + てから (먹고 나서)<\/span><\/td><\/tr><tr><td>동사 で형<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"読ん + でから\" title=\"눌러서 듣기\">読ん + でから (읽고 나서)<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>핵심 정리<\/h3><p><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"てから\" title=\"눌러서 듣기\">「てから」<\/span>는 '~하고 나서'라는 뜻으로, <b>앞의 행동이 끝난 뒤<\/b>에 뒤의 행동을 한다는 순서를 나타내요.<\/p><ul class=\"rules\"><li>食べる → 食べて → 食べ<b>てから<\/b> (먹고 나서)<\/li><li>「나서 ~한 지 얼마가 지났다」처럼 기간과도 써요. (禁煙してから2ヶ月)<\/li><li>단순히 '~하고'를 나타내는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"て\" title=\"눌러서 듣기\">「て」<\/span>보다 '먼저 ~을 끝낸 다음'이라는 순서를 강조해요.<\/li><\/ul><div class=\"note warn\"><b class=\"lab\">참고<\/b>반대로 '~하기 전에'는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"前に\" title=\"눌러서 듣기\">「前に」<\/span><a class=\"xref\" href=\"../Lesson30/\">30과 →<\/a>를 써요.<\/div><h3>예문 8개<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"トイレを使ってから、手を洗わないといけません。\" title=\"눌러서 듣기\">トイレを<ruby>使<rt>つか<\/rt><\/ruby>っ<b>てから<\/b>、<ruby>手<rt>て<\/rt><\/ruby>を<ruby>洗<rt>あら<\/rt><\/ruby>わないといけません。<\/span><span class=\"rom\">toire o tsukate kara te o arawanai to ikemasen<\/span><\/div><\/div><span class=\"k kor\">화장실을 사용한 후에는 손을 씻어야 합니다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span cl
