<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 43, "ja": "なくてはならない", "ko": "~해야 한다 (なくてはならない)", "en": "must do; need to do", "part": "부탁·권유·허가·금지", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">~해야 한다, ~하지 않으면 안 된다<\/div><div class=\"d\">「なくてはいけない」와 같은 뜻의 의무 표현. 「ならない」를 써요.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>앞에 오는 말<\/th><th>붙이는 형태<\/th><\/tr><\/thead><tbody><tr><td>동사 ない형 (い → くて)<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"行かない → 行かなくて + はならない / はなりません\" title=\"눌러서 듣기\">行かない → 行かなくて + はならない / はなりません<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>핵심 정리<\/h3><p><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"なくてはならない\" title=\"눌러서 듣기\">「なくてはならない」<\/span>는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"なくてはいけない\" title=\"눌러서 듣기\">「なくてはいけない」<\/span><a class=\"xref\" href=\"../Lesson42/\">42과 →<\/a>와 같은 뜻의 의무 표현이에요. 정중하게는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"なくてはなりません\" title=\"눌러서 듣기\">「なくてはなりません」<\/span>입니다.<\/p><ul class=\"rules\"><li>行かない → 行か<b>なくては<\/b>ならない (가야 한다)<\/li><li><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"いけない\" title=\"눌러서 듣기\">「いけない」<\/span>보다 조금 딱딱하고 객관적인 느낌이 있어요.<\/li><\/ul><h3>비슷한 문법<\/h3><ul class=\"rules\"><li><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"なくちゃ\" title=\"눌러서 듣기\">「なくちゃ」<\/span><a class=\"xref\" href=\"../Lesson41/\">41과 →<\/a> — 회화체<\/li><li>반대로 '~하면 안 된다'는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"てはいけない\" title=\"눌러서 듣기\">「てはいけない」<\/span><a class=\"xref\" href=\"../Lesson69/\">69과 →<\/a><\/li><\/ul><h3>예문 10개<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"急がなくてはならない。\" title=\"눌러서 듣기\"><ruby>急<rt>いそ<\/rt><\/ruby>が<b>なくてはならない<\/b>。<\/span><span class=\"rom\">
