<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 23, "ja": "から", "ko": "~이니까, ~부터 (から)", "en": "because; since; from", "part": "접속·이유", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">① ~이니까, ~이므로 (이유)  ② ~부터, ~에서 (출발점)<\/div><div class=\"d\">이유('~이니까')와 출발점('~부터')을 나타내는 「から」. 앞에 오는 말에 따라 형태가 달라요.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>앞에 오는 말<\/th><th>붙이는 형태<\/th><\/tr><\/thead><tbody><tr><td>① 이유 — 동사<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"食べる + から / 食べた + から\" title=\"눌러서 듣기\">食べる + から / 食べた + から<\/span><\/td><\/tr><tr><td>① 이유 — 명사<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"明日は休み + だから\" title=\"눌러서 듣기\">明日は休み + だから<\/span><\/td><\/tr><tr><td>① 이유 — な형용사<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"静か + だから\" title=\"눌러서 듣기\">静か + だから<\/span><\/td><\/tr><tr><td>① 이유 — い형용사<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"暑い + から\" title=\"눌러서 듣기\">暑い + から<\/span><\/td><\/tr><tr><td>② 출발점 — 명사<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"駅 + から / 17時 + から\" title=\"눌러서 듣기\">駅 + から / 17時 + から<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>뜻 ① 이유 — ~이니까, ~때문에<\/h3><p>'(A)이니까 (B)'처럼 원인과 결과를 이어요. 앞에 오는 말에 따라 형태가 달라집니다.<\/p><ul class=\"rules\"><li>동사·い형용사 → 그대로 + <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"から\" title=\"눌러서 듣기\">「から」<\/span> (과거형도 가능)<\/li><li>명사·な형용사 → <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"だから\" title=\"눌러서 듣기\">「だから」<\/span> (정중하게는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ですから\" title=\"눌러서 듣기\">「ですから」<\/span>)<\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"明日テストがあるから、今夜勉強するつもりだ。\" title=\"눌러서 듣기\"><ruby>明日<rt>あした<\/rt><\/ruby>テストがある<b>から<\/b>、<ruby>今夜<rt>こんや<\/rt><\/ruby><ruby>勉強<rt>べんきょう<\/rt><\/ruby>するつもりだ。<\/span><span class=\"rom\">ashita tesuto ga aru kara konya benkyou suru tsumori da<\/span><\/div><\/div><span class=\"k kor\">내일 시험이 있으니까 오늘 밤 공부할 생각이다.<\/span><\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"今朝テストがあったから、今はちょっと疲れた。\" title=\"눌러서 듣기\"><ruby>今朝<rt>けさ<\/rt><\/ruby>テストがあった<b>から<\/b>、<ruby>今<rt>いま<\/rt><\/ruby>はちょっと<ruby>疲<rt>つか<\/rt><\/ruby>れた。<\/span><span class=\"rom\">kesa tesuto ga ata kara ima wa chotto tsukareta<\/span><\/div><\/div><span class=\"k kor\">오늘 아침 시험이 있었기 때문에 지금은 좀 피곤하다.<\/span><\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"大事な試験だから、がんばる!\" title=\"눌러서 듣기\"><ruby>大事<rt>だいじ<\/rt><\/ruby>な<ruby>試験<rt>しけん<\/rt><\/ruby><b>だから<\/b>、がんばる!<\/span><span class=\"rom\">daiji na shiken da kara ganbaru!<\/span><\/div><\/div><span class=\"k kor\">중요한 시험이라서 열심히 할 거야!<\/span><\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"あの人はいつもとても静かだから、一度も話したことがない。\" title=\"눌러서 듣기\">あの<ruby>人<rt>ひと<\/rt><\/ruby>はいつもとても<ruby>静<rt>しず<\/rt><\/ruby>か<b>だから<\/b>、<ruby>一度<rt>いちど<\/rt><\/ruby>も<ruby>話<rt>はな<\/rt><\/ruby>したことがない。<\/span><span class=\"rom\">ano hito wa itsumo totemo shizuka da kara ichido mo hanashita koto ga nai<\/span><\/div><\/div><span class=\"k kor\">저 사람은 항상 아주 조용해서 한 번도 이야기해 본 적이 없다.<\/span><\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"暑いから、窓を開けてください。\" title=\"눌러서 듣기\"><ruby>暑<rt>あつ<\/rt><\/ruby>い<b>から<\/b>、<ruby>窓<rt>まど<\/rt><\/ruby>を<ruby>開<rt>あ<\/rt><\/ruby>けてください。<\/span><span class=\"rom\">atsui kara mado o akete kudasai<\/span><\/div><\/div><span class=\"k kor\">더우니까 창문을 열어 주세요.<\/span><\/li><\/ul><h3>뜻 ② 출발점 — ~부터,
