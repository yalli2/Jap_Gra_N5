<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 36, "ja": "な-adjectives", "ko": "な형용사", "en": "na-adjectives", "part": "이다·형용사", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">な형용사 (명사를 꾸밀 때 な가 붙는 형용사)와 그 활용<\/div><div class=\"d\">명사를 꾸밀 때 「な」가 붙는 형용사. 명사처럼 활용해서 익히기 쉬워요.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>구분<\/th><th>형태 (元気 예시)<\/th><\/tr><\/thead><tbody><tr><td>현재 긍정<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"元気だ  / 元気です\" title=\"눌러서 듣기\">元気だ (반말) / 元気です (정중)<\/span><\/td><\/tr><tr><td>명사 수식<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"元気な + 명사\" title=\"눌러서 듣기\">元気な + 명사 (元気な子)<\/span><\/td><\/tr><tr><td>현재 부정<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"元気じゃない・ではない / 元気じゃありません・ではありません\" title=\"눌러서 듣기\">元気じゃない・ではない / 元気じゃありません・ではありません<\/span><\/td><\/tr><tr><td>과거 긍정<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"元気だった / 元気でした\" title=\"눌러서 듣기\">元気だった / 元気でした<\/span><\/td><\/tr><tr><td>과거 부정<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"元気じゃなかった / 元気ではありませんでした\" title=\"눌러서 듣기\">元気じゃなかった / 元気ではありませんでした<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>핵심 정리<\/h3><p>일본어 형용사에는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"い형용사\" title=\"눌러서 듣기\">「い형용사」<\/span><a class=\"xref\" href=\"../Lesson16/\">16과 →<\/a>와 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"な형용사\" title=\"눌러서 듣기\">「な형용사(な形容詞)」<\/span>가 있어요. な형용사는 사실상 <b>명사처럼 활용<\/b>하기 때문에 형태 변화가 간단합니다.<\/p><ul class=\"rules\"><li>서술할 때: 어간 + <b>だ / です<\/b> (その子は元気だ)<\/li><li>명사를 꾸밀 때: 어간 + <b>な<\/b> + 명사 (元気な子)<\/li><li>부정·과거는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"だです\" title=\"눌러서 듣기\">「だ・です」<\/span><a class=\"xref\" href=\"../Lesson2/\">2과 →<\/a>·<span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"じゃない\" title=\"눌러서 듣기\">「じゃない」<\/span><a class=\"xref\" href=\"../Lesson20/\">20과 →<\/a>와 같은 활용을 합니다.<\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"その子は元気だ。\" title=\"눌러서 듣기\">その<ruby>子<rt>こ<\/rt><\/ruby>は<ruby>元気<rt>げんき<\/rt><\/ruby><b>だ<\/b>。<\/span><span class=\"rom\">sono ko wa genki da<\/span><\/div><\/div><span class=\"k kor\">그 아이는 활기차다.<\/span><\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"彼は元気な子だね。\" title=\"눌러서 듣기\"><ruby>彼<rt>かれ<\/rt><\/ruby>は<ruby>元気<rt>げんき<\/rt><\/ruby><b>な<\/b><ruby>子<rt>こ<\/rt><\/ruby>だね。<\/span><span class=\"rom\">kare wa genki na ko da ne<\/span><\/div><\/div><span class=\"k kor\">그는 활기찬 아이네.<\/span><\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"その子は元気じゃないね。\" title=\"눌러서 듣기\">その<ruby>子<rt>こ<\/rt><\/ruby>は<ruby>元気<rt>げんき<\/rt><\/ruby><b>じゃない<\/b>ね。<\/span><span class=\"rom\">sono ko wa genki ja nai ne<\/span><\/div><\/div><span class=\"k kor\">그 아이는 별로 활기차지 않네.<\/span><\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"その子はとても元気だったね。\" title=\"눌러서 듣기\">その<ruby>子<rt>こ<\/rt><\/ruby>はとても<ruby>元気<rt>げんき<\/rt><\/ruby><b>だった<\/b>ね。<\/span><span class=\"rom\">sono ko wa totemo genki data ne<\/span><\/div><\/div><span class=\"k kor\">그 아이는 정말 활기찼지.<\/span><\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"彼はあまり元気じゃなかったね。\" title=\"눌러서 듣기\"><ruby>彼<rt>かれ<\/rt><\/ruby>はあまり<ruby>元気<rt>げんき<\/rt><\/ruby><b>じゃなかった<\/b>ね。<\/span><span class=\"rom\">kare wa amari genki ja nakata ne<\/span><\/div><\/div><span class=\"k kor\">그는 별로 활기차지 않았지.<\/span><\/li><\/ul><h3>자주 쓰는 な형용사<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>일본어<\/th><th>뜻<\/th><\/tr><\/thead><tbody><tr><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"上手\" title=\"눌러서 듣기\">上手 (じょうず)<\/span><\/td><td>능숙함, 잘함<\/td><\/tr><tr><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"下手\" title=\"눌러서 듣기\">下手 (へた)<\/span><\/td><td>서투름, 못함<\/td><\/tr><tr><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"好き\" title=\"눌러서 듣기\">好き (すき)<\/span><\/td><td>좋아함<\/td><\/tr><tr><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"嫌い\" title=\"눌러서 듣기\">嫌い (きらい)<\/span><\/td><td>싫어함<\/td><\/tr><tr><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"有名\" title=\"눌러서 듣기\">有名 (ゆうめい)<\/span><\/td><td>유명함<\/td><\/tr><tr><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"きれい\" title=\"눌러서 듣기\">きれい<\/span><\/td><td>예쁨, 깨끗함<\/td><\/tr><tr><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"元気\" title=\"눌러서 듣기\">元気 (げんき)<\/span><\/td><td>건강함, 활기참<\/td><\/tr><tr><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"静か\" title=\"눌러서 듣기\">静か (しずか)<\/span><\/td><td>조용함<\/td><\/tr><tr><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"便利\" title=\"눌러서 듣기\">便利 (べんり)<\/span><\/td><td>편리함<\/td><\/tr><tr><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"親切\" title=\"눌러서 듣기\">親切 (しんせつ)<\/span><\/td><td>친절함<\/td><\/tr><\/tbody><\/table><\/div><div class=\"note warn\"><b class=\"lab\">참고<\/b><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"きれい\" title=\"눌러서 듣기\">「きれい」<\/span><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ゆうめい\" title=\"눌러서 듣기\">「ゆうめい」<\/span>처럼 い로 끝나도 な형용사인 단어가 있어요. 헷갈리면 명사 앞에 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"な\" title=\"눌러서 듣기\">「な」<\/span>가 붙는지 확인해 보세요.<\/div><h3>예문 8개<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"この町はとても静かです。\" title=\"눌러서 듣기\">この<ruby>
