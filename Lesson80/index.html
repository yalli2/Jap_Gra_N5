<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 80, "ja": "より～ほうが", "ko": "~보다 ~쪽이 (よりほうが)", "en": "[A] is more than [B]", "part": "시간·상태·정도·비교", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">~보다 ~쪽이 더 ~하다<\/div><div class=\"d\">두 가지를 비교해 한쪽이 더하다고 말하는 「より～ほうが」.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>앞에 오는 말<\/th><th>붙이는 형태<\/th><\/tr><\/thead><tbody><tr><td>동사<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"동사1 + より + 동사2 + ほうが\" title=\"눌러서 듣기\">동사1 + より + 동사2 + ほうが<\/span><\/td><\/tr><tr><td>い형용사<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"い형1 + より + い형2 + ほうが\" title=\"눌러서 듣기\">い형1 + より + い형2 + ほうが<\/span><\/td><\/tr><tr><td>な형용사<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"な형1 + より + な형2 + なほうが\" title=\"눌러서 듣기\">な형1 + より + な형2 + なほうが<\/span><\/td><\/tr><tr><td>명사<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"명사1 + より + 명사2 + のほうが\" title=\"눌러서 듣기\">명사1 + より + 명사2 + のほうが<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>핵심 정리<\/h3><p><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"よりほうが\" title=\"눌러서 듣기\">「より～ほうが」<\/span>는 두 가지를 비교해 <b>'~보다 ~쪽이 더 ~하다'<\/b>고 말하는 표현이에요. <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ほう\" title=\"눌러서 듣기\">「ほう」<\/span>는 한자로 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"方\" title=\"눌러서 듣기\">「方」<\/span>라고도 써요.<\/p><ul class=\"rules\"><li>犬<b>のほうが<\/b> → 개 쪽이<\/li><li>猫<b>より<\/b> → 고양이보다<\/li><li>명사는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"のほうが\" title=\"눌러서 듣기\">「のほうが」<\/span>, な형용사는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"なほうが\" title=\"눌러서 듣기\">「なほうが」<\/span>로 이어져요.<\/li><\/ul><div class=\"note warn\"><b class=\"lab\">참고<\/b><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"はより\" title=\"눌러서 듣기\">「は～より」<\/span><a class=\"xref\" href=\"../Lesson76/\">76과 →<\/a>는 A가 주제, <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"よりほうが\" title=\"눌러서 듣기\">「より～ほうが」<\/span>는 비교해서 더 나은 쪽을 강조해요.<\/div><h3>예문 9개<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"私は猫より、犬のほうが好きです。\" title=\"눌러서 듣기\"><ruby>私<rt>わたし<\/rt><\/ruby>は<ruby>猫<rt>ねこ<\/rt><\/ruby><b>より<\/b>、<ruby>犬<rt>いぬ<\/rt><\/ruby><b>のほうが<\/b><ruby>好<rt>す<\/rt><\/ruby>きです。<\/span><span class=\"rom\">watashi wa neko yori inu no hou ga suki desu<\/span><\/div><\/div><span class=\"k kor\">저는 고양이보다 개를 더 좋아합니다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"昨日より今日の方が暑いです。\" title=\"눌러서 듣기\"><ruby>昨日<rt>きのう<\/rt><\/ruby><b>より<\/b><ruby>今日<rt>きょう<\/rt><\/ruby><b>の<ruby>方<rt>ほう<\/rt><\/ruby>が<\/b><ruby>暑<rt>あつ<\/rt><\/ruby>いです。<\/span><span class=\"rom\">kinou yori kyou no hou ga atsui desu<\/span><\/div><\/div><span class=\"k kor\">어제보다 오늘이 더 덥습니다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"彼女より、君の方がきれいだよ。\" title=\"눌러서 듣기\"><ruby>彼女<rt>かのじょ<\/rt><\/ruby><b>より<\/b>、<ruby>君<rt>きみ<\/rt><\/ruby><b>の<ruby>方<rt>ほう<\/rt><\/ruby>が<\/b>きれいだよ。<\/span><span class=\"rom\">kanojo yori kimi no hou ga kirei da yo<\/span><\/div><\/div><span class=\"k kor\">그녀보다 네가 더 예뻐.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"日本語を読むより、話す方が上手だ。\" title=\"눌러서 듣기\"><ruby>日本語<rt>にほんご<\/rt><\/ruby>を<ruby>読<rt>よ<\/rt><\/ruby>む<b>より<\/b>、<ruby>話<rt>はな<\/rt><\/ruby>す<b><ruby>方<rt>ほう<\/rt><\/ruby>が<\/b><ruby>上手<rt>じょうず<\/rt><\/ruby>だ。<\/span><span class=\"rom\">nihongo o yomu yori hanasu hou ga jouzu da<\/span><\/div><\/div><span class=\"k kor\">일본어를 읽는 것보다 말하는 쪽이 잘해.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"butto
