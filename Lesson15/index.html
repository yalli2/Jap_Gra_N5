<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 15, "ja": "ほうがいい", "ko": "~하는 편이 좋다 (ほうがいい)", "en": "had better; it'd be better to; should~", "part": "부탁·권유·허가·금지", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">~하는 편이 좋다, ~하는 게 좋겠다 (충고·조언)<\/div><div class=\"d\">충고나 조언을 할 때 쓰는 표현. 긍정은 た형, 부정은 ない형 뒤에 붙여요.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>앞에 오는 말<\/th><th>붙이는 형태<\/th><\/tr><\/thead><tbody><tr><td>동사 た형 (긍정 충고)<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"行った + ほうがいい / 方がいい\" title=\"눌러서 듣기\">行った + ほうがいい / 方がいい<\/span><\/td><\/tr><tr><td>동사 ない형 (부정 충고)<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"行かない + ほうがいい / 方がいい\" title=\"눌러서 듣기\">行かない + ほうがいい / 方がいい<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>핵심 정리<\/h3><p>상대에게 '~하는 편이 좋아요'라고 조언할 때 써요. <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ほうがいい\" title=\"눌러서 듣기\">「ほうがいい」<\/span>(히라가나)도, <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"方がいい\" title=\"눌러서 듣기\">「方がいい」<\/span>(한자)도 모두 쓸 수 있어요.<\/p><ul class=\"rules\"><li><b>~하는 게 좋다<\/b> → 동사 <b>た형<\/b> + ほうがいい (行った方がいい)<\/li><li><b>~하지 않는 게 좋다<\/b> → 동사 <b>ない형<\/b> + ほうがいい (行かないほうがいい)<\/li><\/ul><div class=\"note warn\"><b class=\"lab\">참고<\/b>긍정 충고도 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"行くほうがいい\" title=\"눌러서 듣기\">「行くほうがいい」<\/span>(사전형)가 아니라 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"行ったほうがいい\" title=\"눌러서 듣기\">「行ったほうがいい」<\/span>(た형)를 쓰는 게 자연스러워요.<\/div><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"行ったほうがいい。\" title=\"눌러서 듣기\"><ruby>行<rt>い<\/rt><\/ruby>っ<b>たほうがいい<\/b>。<\/span><span class=\"rom\">ita hou ga ii<\/span><\/div><\/div><span class=\"k kor\">가는 편이 좋아.<\/span><\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"行かないほうがいい。\" title=\"눌러서 듣기\"><ruby>行<rt>い<\/rt><\/ruby>か<b>ないほうがいい<\/b>。<\/span><span class=\"rom\">ikanai hou ga ii<\/span><\/div><\/div><span class=\"k kor\">가지 않는 편이 좋아.<\/span><\/li><\/ul><div class=\"note warn\"><b class=\"lab\">참고<\/b>말끝에 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"よ\" title=\"눌러서 듣기\">「よ」<\/span><a class=\"xref\" href=\"../Lesson79/\">79과 →<\/a>를 붙이면 '~하는 게 좋아요'라고 부드럽게 권하는 느낌이 돼요.<\/div><h3>예문 8개<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"疲れたら、早く寝たほうがいい。\" title=\"눌러서 듣기\"><ruby>疲<rt>つか<\/rt><\/ruby>れたら、<ruby>早<rt>はや<\/rt><\/ruby>く<ruby>寝<rt>ね<\/rt><\/ruby>た<b>ほうがいい<\/b>。<\/span><span class=\"rom\">tsukaretara hayaku neta hou ga ii<\/span><\/div><\/div><span class=\"k kor\">피곤하면 일찍 자는 게 좋아.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"暑い日には、水をたくさん飲んだ方がいい。\" title=\"눌러서 듣기\"><ruby>暑<rt>あつ<\/rt><\/ruby>い<ruby>日<rt>ひ<\/rt><\/ruby>には、<ruby>水<rt>みず<\/rt><\/ruby>をたくさん<ruby>飲<rt>の<\/rt><\/ruby>んだ<b><ruby>方<rt>ほう<\/rt><\/ruby>がいい<\/b>。<\/span><span class=\"rom\">atsui hi ni wa mizu o takusan non da hou ga ii<\/span><\/div><\/div><span class=\"k kor\">더운 날에는 물을 많이 마시는 게 좋아요.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"寝る前に、スマホを使わない方がいい。\" title=\"눌러서 듣기\"><ruby>寝<rt>ね<\/rt><\/ruby>る<ruby>前<rt>まえ<\/rt><\/ruby>に、スマホを<ruby>使<rt>つか<\/rt><\/ruby>わない<b><ruby>方<rt>ほう<\/rt><\/ruby>がいい<\/b>。<\/span><span class=\"rom\">neru mae ni sumaho o tsukawanai hou ga ii<\/span><\/div><\/div><span class=\"k kor\">자기 전에는 스마트폰을 사용하지 않는 게 좋아.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"毎日日本語を練習した方がいいですよ。\" title=\"눌러서 듣기\"><ruby>毎日<rt>まいにち<\/rt><\/ruby><ruby>日本語<rt>にほんご<\/rt><\
