<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 49, "ja": "にする", "ko": "~(으)로 하다 (にする)", "en": "to decide on", "part": "존재·희망·의지", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">~(으)로 하다, ~(으)로 정하다, ~하게 만들다<\/div><div class=\"d\">여러 선택지 중에서 하나를 정하거나, 어떤 상태로 만들 때 쓰는 「にする」.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>앞에 오는 말<\/th><th>붙이는 형태<\/th><\/tr><\/thead><tbody><tr><td>명사<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"お茶 + にする / にします\" title=\"눌러서 듣기\">お茶 + にする / にします (차로 하겠다)<\/span><\/td><\/tr><tr><td>な형용사<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"きれい + にする\" title=\"눌러서 듣기\">きれい + にする (깨끗하게 하다)<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>핵심 정리<\/h3><p><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"にする\" title=\"눌러서 듣기\">「にする」<\/span>는 <b>선택·결정<\/b>을 나타내요. '~(으)로 하겠다'는 뜻으로, 주문하거나 고를 때 자주 씁니다.<\/p><ul class=\"rules\"><li>반말: にする (예문 1~4번)<\/li><li>정중: にします (예문 5~9번)<\/li><\/ul><h3>상태를 바꿔 만들기<\/h3><p><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"Aを+상태+にする\" title=\"눌러서 듣기\">「Aを + 상태 + にする」<\/span>는 'A를 ~하게 만들다'라는 뜻이에요. (部屋をきれいにする: 방을 깨끗이 하다)<\/p><div class=\"note warn\"><b class=\"lab\">참고<\/b>스스로 어떻게 되는 변화는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"になる\" title=\"눌러서 듣기\">「になる」<\/span><a class=\"xref\" href=\"../Lesson44/\">44과 →<\/a>, 누군가가 그렇게 만드는 것은 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"にする\" title=\"눌러서 듣기\">「にする」<\/span>입니다. 동사와 쓰려면 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ことにする\" title=\"눌러서 듣기\">「ことにする」<\/span>(~하기로 하다)를 써요.<\/div><h3>예문 9개<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"どれにする?\" title=\"눌러서 듣기\">どれ<b>にする<\/b>?<\/span><span class=\"rom\">dore ni suru?<\/span><\/div><
