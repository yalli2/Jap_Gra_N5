<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 35, "ja": "もう", "ko": "벌써, 이제, 더 (もう)", "en": "already; anymore; again; other", "part": "시간·상태·정도·비교", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">이미, 벌써 / 이제 (~않다) / 더, 또 / 아이참 (짜증)<\/div><div class=\"d\">상황에 따라 '이미', '더 이상', '더', '또'를 나타내는 다용도 부사 「もう」.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>뜻<\/th><th>쓰임<\/th><\/tr><\/thead><tbody><tr><td>① 이미, 벌써<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"もう + 시간·완료\" title=\"눌러서 듣기\">もう + 시간·완료 (もう9時だ)<\/span><\/td><\/tr><tr><td>② 이제 (~않다)<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"もう + 부정문\" title=\"눌러서 듣기\">もう + 부정문 (もう行かない)<\/span><\/td><\/tr><tr><td>③ 더, 또<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"もう + 수량\" title=\"눌러서 듣기\">もう + 수량 (もう一杯)<\/span><\/td><\/tr><tr><td>④ 짜증·감탄<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"もう！\" title=\"눌러서 듣기\">もう！ (문장 맨 앞)<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>핵심 정리<\/h3><p><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"もう\" title=\"눌러서 듣기\">「もう」<\/span>는 문맥에 따라 뜻이 달라요. 크게 4가지로 알아 두세요.<\/p><h3>① 이미, 벌써<\/h3><p>시간이나 나이와 함께 자주 써요.<\/p><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"もう9時だ。\" title=\"눌러서 듣기\"><b>もう<\/b>9<ruby>時<rt>じ<\/rt><\/ruby>だ。<\/span><span class=\"rom\">mou 9 ji da<\/span><\/div><\/div><span class=\"k kor\">벌써 9시다.<\/span><\/li><\/ul><h3>② 이제 (~않다)<\/h3><p><b>부정문<\/b>과 함께 쓰면 '더 이상 ~않는다'가 돼요.<\/p><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"もう行かない。\" title=\"눌러서 듣기\"><b>もう<\/b><ruby>行<rt>い<\/rt><\/ruby>かない。<\/span><span class=\"rom\">mou ikanai<\/span><\/div><\/div><span class=\"k kor\">이제 가지 않을 거야.<\/span><\/li><\/ul><h3>③ 더, 또<\/h3><p>긍정·부정 모두에 쓰여요. <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"もう一杯\" title=\"눌러서 듣기\">「もう一杯」<\/span>(한 잔 더), <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"もう少し\" title=\"눌러서 듣기\">「もう少し」<\/span>(조금 더).<\/p><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"もう二度と行かない。\" title=\"눌러서 듣기\"><b>もう<\/b><ruby>二<rt>に<\/rt><\/ruby><ruby>度<rt>ど<\/rt><\/ruby>と<ruby>行<rt>い<\/rt><\/ruby>かない。<\/span><span class=\"rom\">mou ni do to ikanai<\/span><\/div><\/div><span class=\"k kor\">다시는 안 갈 거야.<\/span><\/li><\/ul><h3>④ 짜증을 나타내는 もう<\/h3><p>문장 맨 앞에 두고 화자의 짜증을 나타내요. (주로 여성이 사용)<\/p><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"もうたくさんだ。\" title=\"눌러서 듣기\"><b>もう<\/b>たくさんだ。<\/span><span class=\"rom\">mou takusan da<\/span><\/div><\/div><span class=\"k kor\">이제 지긋지긋해.<\/span><\/li><\/ul><div class=\"note warn\"><b class=\"lab\">참고<\/b>반대말은 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"まだ\" title=\"눌러서 듣기\">「まだ」<\/span><a class=\"xref\" href=\"../Lesson27/\">27과 →<\/a>입니다.<\/div><h3>예문 10개<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"もう昼ご飯の時間だ。早く食べましょう!\" title=\"눌러서 듣기\"><b>もう<\/b><ruby>昼<rt>ひる<\/rt><\/ruby>ご<ruby>飯<rt>はん<\/rt><\/ruby>の<ruby>時間<rt>じかん<\/rt><\/ruby>だ。<ruby>早<rt>はや<\/rt><\/ruby>く<ruby>食<rt>た<\/rt><\/ruby>べましょう!<\/span><span class=\"rom\">mou hirugohan no jikan da hayaku tabemashou!<\/span><\/div><\/div><span class=\"k kor\">벌써 점심시간이야. 빨리 먹읍시다!<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"宿題はもう終わった?\" title=\"눌러서 듣기\"><ruby>宿題<rt>しゅくだい<\/rt><\/ruby>は<b>もう<\/b><ruby>終<rt>お<\/rt><\/ruby>わった?<\/span><span class=\"rom\">shukudai wa mou owata?<\/span><\/div><\/div><span class=\"k kor\">숙제는 벌써 끝났어?<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"ビールもう一杯ください!\" title=\"눌러서 듣기\">ビール<b>もう<\/b><ruby>一杯<rt>いっぱい<\/rt><\/ruby>ください!<\/span><span class=\"rom\">biiru mou ippai kudasai!<\/span><\/div><\/div><span class=\"k kor\">맥주 한 잔 더 주세요!<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"飲み物は全部飲みました。もうありません。\" title=\"눌러서 듣기\"><ruby>飲<rt>の<\/rt><\/ruby>み<ruby>物<rt>もの<\/rt><\/ruby>は<ruby>全部<rt>ぜんぶ<\/rt><\/ruby><ruby>飲<rt>の<\/rt><\/ruby>みました。<b>もう<\/b>ありません。<\/span><span class=\"rom\">nomimono wa zenbu nomimashita mou arimasen<\/span><\/div><\/div><span class=\"k kor\">음료는 전부 마셨습니다. 이제 없습니다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"もう少し待ってください。\" title=\"눌러서 듣기\"><b>もう<\/b><ruby>少<rt>すこ<\/rt><\/ruby>し<ruby>待<rt>ま<\/rt><\/ruby>ってください。<\/span><span class=\"rom\">mou sukoshi mate kudasai<\/span><\/div><\/div><span class=\"k kor\">조금만 더 기다려 주세요.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"コーヒーはもう飲まないことにしました。\" title=\"눌러서 듣기\">コーヒーは<b>もう<\/b><ruby>飲<rt>の<\/rt><\/ruby>まないことにしました。<\/span><span class=\"rom\">koohii wa mou nomanai koto ni shimashita<\/span><\/div><\/div><span class=\"k kor\">커피는 이제 마시지 않기로 했습니다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"もうこの暑さには、耐えられない。\" title=\"눌러서 듣기\"><b>もう<\/b>この<ruby>暑<rt>あつ<\/rt><\/ruby>さには、<ruby>耐<rt>た<\/rt><\/ruby>えられない。<\/span><span class=\"rom\">mou kono atsusa ni wa taerarenai<\/span><\/div><\/div><span class=\"k kor\">이 더위는 이제 견딜 수 없다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"もう我慢できない。\" title=\"눌러서 듣기\"><b>もう<\/b><ruby>我慢<rt>がまん<\/rt><\/ruby>できない。<\/span><span class=\"rom\">mou gaman dekinai<\/span><\/div
