<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 61, "ja": "すぎる", "ko": "너무 ~하다 (すぎる)", "en": "too much", "part": "시간·상태·정도·비교", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">너무 ~하다, 지나치게 ~하다<\/div><div class=\"d\">정도가 지나칠 때 쓰는 「すぎる」. 동사·형용사 어간에 붙여요.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>앞에 오는 말<\/th><th>붙이는 형태<\/th><\/tr><\/thead><tbody><tr><td>동사 ます형<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"食べ + すぎる\" title=\"눌러서 듣기\">食べ + すぎる (너무 많이 먹다)<\/span><\/td><\/tr><tr><td>い형용사 (い 제외)<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"大き + すぎる\" title=\"눌러서 듣기\">大き + すぎる (너무 크다)<\/span><\/td><\/tr><tr><td>な형용사<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"簡単 + すぎる\" title=\"눌러서 듣기\">簡単 + すぎる (너무 간단하다)<\/span><\/td><\/tr><tr><td>활용<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"すぎる / すぎます / すぎた / すぎました / すぎて\" title=\"눌러서 듣기\">すぎる / すぎます / すぎた / すぎました / すぎて<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>핵심 정리<\/h3><p><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"すぎる\" title=\"눌러서 듣기\">「すぎる」<\/span>는 '너무 ~하다, 지나치게 ~하다'라는 뜻이에요. 동사 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"過ぎる\" title=\"눌러서 듣기\">「過ぎる」<\/span>(지나다)에서 온 말로, 보통 히라가나로 써요.<\/p><ul class=\"rules\"><li>동사: ます형에서 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ます\" title=\"눌러서 듣기\">「ます」<\/span>를 빼고 + すぎる (食べます → 食べ<b>すぎる<\/b>)<\/li><li>い형용사: <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"い\" title=\"눌러서 듣기\">「い」<\/span>를 빼고 + すぎる (大きい → 大き<b>すぎる<\/b>)<\/li><li>な형용사: 어간 + すぎる (簡単 → 簡単<b>すぎる<\/b>)<\/li><\/ul><h3>활용<\/h3><ul class=\"rules\"><li>すぎる(현재), すぎます(정중), すぎた/すぎました(과거), すぎて(연결: 너무 ~해서)<\/li><\/ul><div class=\"note warn\"><b class=\"lab\">참고<\/b><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"いい\" title=\"눌러서 듣기\">「いい」<\/span>는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"よすぎる\" title=\"눌러서 듣기\">「よすぎる」<\/span>, <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ない\" title=\"눌러서 듣기\">「ない」<\/span>는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"なさすぎる\" title=\"눌러서 듣기\">「なさすぎる」<\/span>로 활용해요. 보통 좋지 않은 의미로 쓰지만, <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"幸せすぎて\" title=\"눌러서 듣기\">「幸せすぎて」<\/span>처럼 감정이 큰 경우에도 써요.<\/div><h3>예문 10개<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"このシャツは大きすぎる。\" title=\"눌러서 듣기\">このシャツは<ruby>大<rt>おお<\/rt><\/ruby>き<b>すぎる<\/b>。<\/span><span class=\"rom\">kono shatsu wa ooki sugiru<\/span><\/div><\/div><span class=\"k kor\">이 셔츠는 너무 크다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"今年の夏は暑すぎた。\" title=\"눌러서 듣기\"><ruby>今年<rt>ことし<\/rt><\/ruby>の<ruby>夏<rt>なつ<\/rt><\/ruby>は<ruby>暑<rt>あつ<\/rt><\/ruby><b>すぎた<\/b>。<\/span><span class=\"rom\">kotoshi no natsu wa atsu sugita<\/span><\/div><\/div><span class=\"k kor\">올해 여름은 너무 더웠다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"冬の来るのが早すぎた。\" title=\"눌러서 듣기\"><ruby>冬<rt>ふゆ<\/rt><\/ruby>の<ruby>来<rt>く<\/rt><\/ruby>るのが<ruby>早<rt>はや<\/rt><\/ruby><b>すぎた<\/b>。<\/span><span class=\"rom\">fuyu no kuru no ga haya sugita<\/span><\/div><\/div><span class=\"k kor\">겨울이 너무 일찍 왔다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"この問題は簡単すぎます。\" title=\"눌러서 듣기\">この<ruby>問題<rt>もんだい<\/rt><\/ruby>は<ruby>簡単<rt>かんたん<\/rt><\/ruby><b>すぎます<\/b>。<\/span><span class=\"rom\">kono mondai wa kantan sugimasu<\/span><\/div><\/div><span class=\"k kor\">이 문제는 너무 쉽습니다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"幸せすぎて死にそうだ。\" title=\"눌러서 듣기\"><ruby>幸<rt>しあわ<\/rt><\/ruby>せ<b>すぎて<\/b><ruby>死<rt>し<\/rt><\/ruby>にそうだ。<\/span><span class=\"rom\">shiawase sugite shini sou da<\/span><\/div><\/div><span class=\"k kor\">너무 행복해서 죽을 것 같다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"かんじを覚えるのが私には難しすぎる。\" title=\"눌러서 듣기\">かんじを<ruby>覚<rt>おぼ<\/rt><\/ruby>えるのが<ruby>私<rt>わたし<\/rt><\/ruby>には<ruby>難<rt>むずか<\/rt><\/ruby>し<b>すぎる<\/b>。<\/span><span class=\"rom\">kanji o oboeru no ga watashi ni wa muzukashi sugiru<\/span><\/div><\/div><span class=\"k kor\">한자를 외우는 것은 저에게는 너무 어렵다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"このレストランはちょっと高すぎる。別のところにしましょう。\" title=\"눌러서 듣기\">このレストランはちょっと<ruby>高<rt>たか<\/rt><\/ruby><b>すぎる<\/b>。<ruby>別<rt>べつ<\/rt><\/ruby>のところにしましょう。<\/span><span class=\"rom\">kono resutoran wa chotto taka sugiru betsu no tokoro ni shimashou<\/span><\/div><\/div><span class=\"k kor\">이 레스토랑은 좀 너무 비싸다. 다른 곳으로 합시다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"この会社は給料が少なすぎます。\" title=\"눌러서 듣기\">この<ruby>会社<rt>かいしゃ<\/rt><\/ruby>は<ruby>給料<rt>きゅうりょう<\/rt><\/ruby>が<ruby>少<rt>すく<\/rt><\/ruby>な<b>すぎます<\/b>。<\/span><span class=\"rom\">kono kaisha wa kyuuryou ga sukuna sugimasu<\/span><\/div><\/div><span class=\"k kor\">이 회사는 월급이 너무 적습니다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"ごめんなさい、少し言いすぎました。\" title=\"눌러서 듣기\">ごめんなさい、<ruby>少<rt>すこ<\/rt><\/ruby>し<ruby>言<rt>い<\/rt><\/ruby>い<b>すぎました<\/b>。<\/span><span class=\"rom\">gomen nasai sukoshi ii sugimashita<\/span><\/div><\/div><span class=\"k kor\">미안해요, 제가 좀 너무 심하게 말했네요.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"昨夜ちょっと飲みすぎました。\" title=\"눌러서 듣기\"><ruby>昨夜<rt>さくや<\/rt><\/ruby>ちょっと<ruby>飲<rt>の<\/rt
