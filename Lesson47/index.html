<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 47, "ja": "に", "ko": "~에 (に)", "en": "destination particle; in; at; on; to", "part": "조사", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">~에, ~에게, ~(으)로 (장소·시간·도착점·대상)<\/div><div class=\"d\">존재하는 장소, 시각, 목적지, 대상을 나타내는 조사 「に」의 쓰임을 배워요.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>앞에 오는 말<\/th><th>붙이는 형태<\/th><\/tr><\/thead><tbody><tr><td>명사<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"日本 + に / 7時 + に / 上 + に\" title=\"눌러서 듣기\">日本 + に / 7時 + に / 上 + に<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>핵심 정리<\/h3><p><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"に\" title=\"눌러서 듣기\">「に」<\/span>는 문맥에 따라 뜻이 달라요. 기본 4가지를 알아 두세요.<\/p><h3>① 존재하는 장소 — ~에<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"日本に住んでいる。\" title=\"눌러서 듣기\"><ruby>日本<rt>にほん<\/rt><\/ruby><b>に<\/b><ruby>住<rt>す<\/rt><\/ruby>んでいる。<\/span><span class=\"rom\">nihon ni sunde iru<\/span><\/div><\/div><span class=\"k kor\">일본에 살고 있다.<\/span><\/li><\/ul><h3>② 시각 — ~에<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"7時に行く。\" title=\"눌러서 듣기\">7<ruby>時<rt>じ<\/rt><\/ruby><b>に<\/b><ruby>行<rt>い<\/rt><\/ruby>く。<\/span><span class=\"rom\">7 ji ni iku<\/span><\/div><\/div><span class=\"k kor\">7시에 갈 거야.<\/span><\/li><\/ul><h3>③ 놓여 있는 위치 — ~에, ~ 위에<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"テーブルの上にある。\" title=\"눌러서 듣기\">テーブルの<ruby>上<rt>うえ<\/rt><\/ruby><b>に<\/b>ある。<\/span><span class=\"rom\">teeburu no ue ni aru<\/span><\/div><\/div><span class=\"k kor\">테이블 위에 있다.<\/span><\/li><\/ul><h3>④ 목적지·도착점 — ~에, ~으로<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"日本に行く。\" title=\"눌러서 듣기\"><ruby>日本<rt>にほん<\/rt><\/ruby><b>に<\/b><ruby>行<rt>い<\/rt><\/ruby>く。<\/span><span class=\"rom\">nihon ni iku<\/span><\/div><\/div><span class=\"k kor\">일본에 갈 거야.<\/span><\/li><\/ul><p>(이 쓰임은 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"へ\" title=\"눌러서 듣기\">「へ」<\/span>와 바꿔 쓸 수 있어요 → <a class=\"xref\" href=\"../Lesson50/\">50과 →<\/a>)<\/p><div class=\"note warn\"><b class=\"lab\">참고<\/b><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"で\" title=\"눌러서 듣기\">「で」<\/span><a class=\"xref\" href=\"../Lesson5/\">5과 →<\/a>는 '행동이 일어나는 장소', <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"に\" title=\"눌러서 듣기\">「に」<\/span>는 '존재하는 장소·도착점'이에요. <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"住む\" title=\"눌러서 듣기\">「住む」<\/span>(살다)는 に와 で 모두 쓸 수 있어요.<\/div><h3>예문 9개<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"来月大学に入る。\" title=\"눌러서 듣기\"><ruby>来月<rt>らいげつ<\/rt><\/ruby><ruby>大学<rt>だいがく<\/rt><\/ruby><b>に<\/b><ruby>入<rt>はい<\/rt><\/ruby>る。<\/span><span class=\"rom\">raigetsu daigaku ni hairu<\/span><\/div><\/div><span class=\"k kor\">다음 달 대학에 들어간다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"どうやって学校に通っていますか?\" title=\"눌러서 듣기\">どうやって<ruby>学校<rt>がっこう<\/rt><\/ruby><b>に<\/b><ruby>通<rt>かよ<\/rt><\/ruby>っていますか?<\/span><span class=\"rom\">dou yate gakkou ni kayote imasu ka?<\/span><\/div><\/div><span class=\"k kor\">어떻게 학교에 다니고 있어요?<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"あなたは何時にスーパーに行きますか?\" title=\"눌러서 듣기\">あなたは<ruby>何時<rt>なんじ<\/rt><\/ruby><b>に<\/b>スーパー<b>に<\/b><ruby>行<rt>い<\/rt><\/ruby>きますか?<\/span><span class=\"rom\">anata wa nanji ni suupaa ni ikimasu ka?<\/span><\/div><\/div><span class=\"k kor\">당신은 몇 시에 슈퍼에 갑니
