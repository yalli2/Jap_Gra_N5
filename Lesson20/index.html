<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 20, "ja": "じゃない・ではない", "ko": "~이/가 아니다 (じゃない・ではない)", "en": "to not be (am not; is not; are not)", "part": "이다·형용사", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">~이 아니다 (현재·과거 부정)<\/div><div class=\"d\">「だ・です」의 부정형. 반말은 じゃない/ではない, 정중하게는 じゃありません/ではありません.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>구분<\/th><th>형태<\/th><\/tr><\/thead><tbody><tr><td>현재 부정 (반말)<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"じゃない / ではない\" title=\"눌러서 듣기\">じゃない / ではない<\/span><\/td><\/tr><tr><td>현재 부정 (정중)<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"じゃありません / ではありません\" title=\"눌러서 듣기\">じゃありません / ではありません<\/span><\/td><\/tr><tr><td>과거 부정 (반말)<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"じゃなかった / ではなかった\" title=\"눌러서 듣기\">じゃなかった / ではなかった<\/span><\/td><\/tr><tr><td>과거 부정 (정중)<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"じゃありませんでした / ではありませんでした / じゃなかったです / ではなかったです\" title=\"눌러서 듣기\">じゃありませんでした / ではありませんでした / じゃなかったです / ではなかったです<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>핵심 정리<\/h3><p><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"だです\" title=\"눌러서 듣기\">「だ・です」<\/span><a class=\"xref\" href=\"../Lesson2/\">2과 →<\/a>의 반대, 즉 '~이 아니다'는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"じゃない\" title=\"눌러서 듣기\">「じゃない」<\/span><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ではない\" title=\"눌러서 듣기\">「ではない」<\/span>를 써요. 둘은 반말 수준에서 자유롭게 바꿔 쓸 수 있고, <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"じゃ\" title=\"눌러서 듣기\">「じゃ」<\/span>는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"では\" title=\"눌러서 듣기\">「では」<\/span>의 회화체입니다.<\/p><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"私はともこ先生ではない。\" title=\"눌러서 듣기\"><ruby>私<rt>わたし<\/rt><\/ruby>はともこ<ruby>先生<rt>せんせい<\/rt><\/ruby><b>ではない<\/b>。<\/span><span class=\"rom\">watashi wa tomoko sensei de wa nai<\/span><\/div><\/div><span class=\"k kor\">나는 도모코 선생님이 아니다.<\/span><\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"私は日本人じゃないよ。\" title=\"눌러서 듣기\"><ruby>私<rt>わたし<\/rt><\/ruby>は<ruby>日本人<rt>にほんじん<\/rt><\/ruby><b>じゃない<\/b>よ。<\/span><span class=\"rom\">watashi wa nihonjin ja nai yo<\/span><\/div><\/div><span class=\"k kor\">나는 일본인이 아니야.<\/span><\/li><\/ul><h3>정중하게 말하기<\/h3><p><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ない\" title=\"눌러서 듣기\">「ない」<\/span>를 빼고 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ありません\" title=\"눌러서 듣기\">「ありません」<\/span>을 붙이면 됩니다. じゃ<b>ない<\/b> → じゃ<b>ありません<\/b>, では<b>ない<\/b> → では<b>ありません<\/b><\/p><h3>과거 부정 ('~이 아니었다')<\/h3><ul class=\"rules\"><li>반말: じゃなかった / ではなかった<\/li><li>정중: じゃありませんでした / ではありませんでした (じゃなかったです도 가능)<\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"私はそれをやるべきじゃなかった。\" title=\"눌러서 듣기\"><ruby>私<rt>わたし<\/rt><\/ruby>はそれをやるべき<b>じゃなかった<\/b>。<\/span><span class=\"rom\">watashi wa sore o yaru beki ja nakata<\/span><\/div><\/div><span class=\"k kor\">나는 그것을 하지 말았어야 했다.<\/span><\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"私は昨日、暇ではありませんでした。\" title=\"눌러서 듣기\"><ruby>私<rt>わたし<\/rt><\/ruby>は<ruby>昨日<rt>きのう<\/rt><\/ruby>、<ruby>暇<rt>ひま<\/rt><\/ruby><b>ではありませんでした<\/b>。<\/span><span class=\"rom\">watashi wa kinou hima de wa arimasen deshita<\/span><\/div><\/div><span class=\"k kor\">저는 어제 한가하지 않았습니다.<\/span><\/li><\/ul><div class=\"note warn\"><b class=\"lab\">참고<\/b>같은 정중함의 단계에서는 어떤 활용을 써도 괜찮아요. <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"な형용사\" title=\"눌러서 듣기\">「な형용사」<\/span><a class=\"xref\" href=\"../Lesson36/\">36과 →<\/a>의 부정도 같은 형태입니다. (예: 好きじゃない)<\/div><h3>예문 7개<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"あなたは一人じゃない。\" title=\"눌러서 듣기\">あなたは<ruby>一人<rt>ひとり<\/rt><\/ruby><b>じゃない<\/b>。<\/span><span class=\"rom\">anata wa hitori ja nai<\/span><\/div><\/div><span class=\"k kor\">당신은 혼자가 아니야.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"危険じゃないの?\" title=\"눌러서 듣기\"><ruby>危険<rt>きけん<\/rt><\/ruby><b>じゃない<\/b>の?<\/span><span class=\"rom\">kiken ja nai no?<\/span><\/div><\/div><span class=\"k kor\">위험하지 않아?<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"そんなつもりじゃなかった。\" title=\"눌러서 듣기\">そんなつもり<b>じゃなかった<\/b>。<\/span><span class=\"rom\">sonna tsumori ja nakata<\/span><\/div><\/div><span class=\"k kor\">그럴 생각이 아니었어.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"ごめんなさい!わざとではありませんでした。\" title=\"눌러서 듣기\">ごめんなさい!わざと<b>ではありませんでした<\/b>。<\/span><span class=\"rom\">gomen nasai! wazato de wa arimasen deshita<\/span><\/div><\/div><span class=\"k kor\">미안해요! 일부러 그런 게 아니었어요.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"肉はあまり好きじゃないです。\" title=\"눌러서 듣기\"><ruby>肉<rt>にく<\/rt><\/ruby>はあまり<ruby>好<rt>す<\/rt><\/ruby>き<b>じゃない<\/b>です。<\/span><span class=\"rom\">niku wa amari suki ja nai desu<\/span><\/div><\/div><span class=\"k kor\">고기는 별로 좋아하지 않아요.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"若いころは野菜が好きじゃなかった。\" title=\"눌러서 듣기\"><ruby>若<rt>わか<\/rt><\/ruby>いころは<ruby>野菜<rt>やさい<\/rt><\/ruby>が<ruby>好<rt>す<\/rt><\/ruby>き<b>じゃなかった<\/b>。<\/span><span class=\"rom\">wakai koro wa yasai ga suki ja nakata<\/span><\/div><\/div><span class=\"k kor\">어릴
