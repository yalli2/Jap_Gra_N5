<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 71, "ja": "と", "ko": "~와/과 (と)", "en": "and; with; as; connecting particle", "part": "조사", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">~와/과, ~와 함께, ~(이)라고 (나열·동반)<\/div><div class=\"d\">'A와 B'처럼 나열하거나 '~와 함께'라는 동반을 나타내는 조사 「と」.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>쓰임<\/th><th>형태<\/th><\/tr><\/thead><tbody><tr><td>나열 (~와)<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"명사 + と + 명사\" title=\"눌러서 듣기\">명사 + と + 명사 (日本語と英語)<\/span><\/td><\/tr><tr><td>동반 (~와 함께)<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"사람 + と + 동사\" title=\"눌러서 듣기\">사람 + と + 동사 (友だちと行く)<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>핵심 정리<\/h3><p><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"と\" title=\"눌러서 듣기\">「と」<\/span>는 두 가지로 써요.<\/p><h3>① 나열 — A와 B<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"日本語と英語を話します。\" title=\"눌러서 듣기\"><ruby>日本語<rt>にほんご<\/rt><\/ruby><b>と<\/b><ruby>英語<rt>えいご<\/rt><\/ruby>を<ruby>話<rt>はな<\/rt><\/ruby>します。<\/span><span class=\"rom\">nihongo to eigo o hanashimasu<\/span><\/div><\/div><span class=\"k kor\">일본어와 영어를 말합니다.<\/span><\/li><\/ul><h3>② 동반 — ~와 함께<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"友だちと行く。\" title=\"눌러서 듣기\"><ruby>友<rt>とも<\/rt><\/ruby>だち<b>と<\/b><ruby>行<rt>い<\/rt><\/ruby>く。<\/span><span class=\"rom\">tomodachi to iku<\/span><\/div><\/div><span class=\"k kor\">친구와 갑니다.<\/span><\/li><\/ul><ul class=\"rules\"><li><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"一緒に\" title=\"눌러서 듣기\">「一緒に」<\/span><a class=\"xref\" href=\"../Lesson18/\">18과 →<\/a>를 함께 쓰면 '같이'라는 뜻이 더 분명해져요. (友だちと一緒に行く)<\/li><li><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"結婚する\" title=\"눌러서 듣기\">「結婚する」<\/span><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"話す\" title=\"눌러서 듣기\">「話す」<\/span><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"遊ぶ\" title=\"눌러서 듣기\">「遊ぶ」<\/span>처럼 상대가 필요한 동사와 자주 써요.<\/li><\/ul><div class=\"note warn\"><b class=\"lab\">참고<\/b>같은 나열이라도 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"や\" title=\"눌러서 듣기\">「や」<\/span><a class=\"xref\" href=\"../Lesson78/\">78과 →<\/a>는 '~랑 ~ 등'처럼 예를 드는 느낌이고, <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"と\" title=\"눌러서 듣기\">「と」<\/span>는 전부를 나열해요.<\/div><h3>예문 10개<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"お母さんと買い物に行った。\" title=\"눌러서 듣기\">お<ruby>母<rt>かあ<\/rt><\/ruby>さん<b>と<\/b><ruby>買<rt>か<\/rt><\/ruby>い<ruby>物<rt>もの<\/rt><\/ruby>に<ruby>行<rt>い<\/rt><\/ruby>った。<\/span><span class=\"rom\">okaasan to kaimono ni ita<\/span><\/div><\/div><span class=\"k kor\">엄마와 쇼핑하러 갔다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"彼女と仲がいいです。\" title=\"눌러서 듣기\"><ruby>彼女<rt>かのじょ<\/rt><\/ruby><b>と<\/b><ruby>仲<rt>なか<\/rt><\/ruby>がいいです。<\/span><span class=\"rom\">kanojo to naka ga ii desu<\/span><\/div><\/div><span class=\"k kor\">그녀와 사이가 좋습니다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"あなたと話したくない。\" title=\"눌러서 듣기\">あなた<b>と<\/b><ruby>話<rt>はな<\/rt><\/ruby>したくない。<\/span><span class=\"rom\">anata to hanashitaku nai<\/span><\/div><\/div><span class=\"k kor\">당신과 이야기하고 싶지 않다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"これとそれは違います。\" title=\"눌러서 듣기\">これ<b>と<\/b>それは<ruby>違<rt>ちが<\/rt><\/ruby>います。<\/span><span class=\"rom\">kore to sore wa chigaimasu<\/span><\/div><\/div><span class=\"k kor\">이것과 그것은 다릅니다.<\/span><\/li><li><div cl
