<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 42, "ja": "なくてはいけない", "ko": "~해야 한다 (なくてはいけない)", "en": "must do; need to do", "part": "부탁·권유·허가·금지", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">~해야 한다, ~하지 않으면 안 된다<\/div><div class=\"d\">의무를 나타내는 표현. ない형의 い를 くて로 바꾸고 「はいけない」를 붙여요.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>앞에 오는 말<\/th><th>붙이는 형태<\/th><\/tr><\/thead><tbody><tr><td>동사 ない형 (い → くて)<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"行かない → 行かなくて + はいけない / はいけません\" title=\"눌러서 듣기\">行かない → 行かなくて + はいけない / はいけません<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>핵심 정리<\/h3><p><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"なくてはいけない\" title=\"눌러서 듣기\">「なくてはいけない」<\/span>는 '~하지 않으면 안 된다', 즉 '~해야 한다'라는 의무 표현이에요.<\/p><ul class=\"rules\"><li>行かない → 行か<b>なくては<\/b>いけない (가야 한다)<\/li><li>정중하게는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"なくてはいけません\" title=\"눌러서 듣기\">「なくてはいけません」<\/span><\/li><li><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"なくちゃ\" title=\"눌러서 듣기\">「なくちゃ」<\/span><a class=\"xref\" href=\"../Lesson41/\">41과 →<\/a>는 이 표현의 회화체예요.<\/li><\/ul><h3>비슷한 문법<\/h3><ul class=\"rules\"><li><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"なくてはならない\" title=\"눌러서 듣기\">「なくてはならない」<\/span><a class=\"xref\" href=\"../Lesson43/\">43과 →<\/a> — 뜻이 같아요.<\/li><li>반대로 '~하면 안 된다'는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"てはいけない\" title=\"눌러서 듣기\">「てはいけない」<\/span><a class=\"xref\" href=\"../Lesson69/\">69과 →<\/a><\/li><\/ul><h3>예문 10개<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"本当にすぐ行かなくてはいけない。\" title=\"눌러서 듣기\"><ruby>本当<rt>ほんとう<\/rt><\/ruby>にすぐ<ruby>行<rt>い<\/rt><\/ruby>か<b>なくてはいけない<\/b>。<\/span><span class=\"rom\">hontou ni sugu ikanakute wa ikenai<\/span><\/div><\/div><span class=\"k kor\">정말 지금 바로 가야 한다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"急がなくてはいけない。\" title=\"눌러서 듣기\"><ruby>急<rt>いそ<\/rt><\/ruby>が<b>なくてはいけない<\/b>。<\/span><span class=\"rom\">isoganakute wa ikenai<\/span><\/div><\/div><span class=\"k kor\">서둘러야 한다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"もう10時だ。寝なくてはいけない。\" title=\"눌러서 듣기\">もう10<ruby>時<rt>じ<\/rt><\/ruby>だ。<ruby>寝<rt>ね<\/rt><\/ruby><b>なくてはいけない<\/b>。<\/span><span class=\"rom\">mou 10 ji da nenakute wa ikenai<\/span><\/div><\/div><span class=\"k kor\">벌써 10시다. 자야 한다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"日本語をもっと勉強しなくてはいけない。\" title=\"눌러서 듣기\"><ruby>日本語<rt>にほんご<\/rt><\/ruby>をもっと<ruby>勉強<rt>べんきょう<\/rt><\/ruby>し<b>なくてはいけない<\/b>。<\/span><span class=\"rom\">nihongo o motto benkyou shinakute wa ikenai<\/span><\/div><\/div><span class=\"k kor\">일본어를 더 공부해야 한다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"花の水やりをしなくてはいけません。\" title=\"눌러서 듣기\"><ruby>花<rt>はな<\/rt><\/ruby>の<ruby>水<rt>みず<\/rt><\/ruby>やりをし<b>なくてはいけません<\/b>。<\/span><span class=\"rom\">hana no mizuyari o shinakute wa ikemasen<\/span><\/div><\/div><span class=\"k kor\">꽃에 물을 줘야 합니다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"明日、早く起きなくてはいけません。\" title=\"눌러서 듣기\"><ruby>明日<rt>あした<\/rt><\/ruby>、<ruby>早<rt>はや<\/rt><\/ruby>く<ruby>起<rt>お<\/rt><\/ruby>き<b>なくてはいけません<\/b>。<\/span><span class=\"rom\">ashita hayaku okinakute wa ikemasen<\/span><\/div><\/div><span class=\"k kor\">내일 일찍 일어나야 합니다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"野菜を食べなくてはいけませんよ。\" title=\"눌러서 듣기\"><ruby>野菜<rt>やさい<\/rt><\/ruby>を<ruby>食<
