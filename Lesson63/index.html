<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 63, "ja": "たい", "ko": "~하고 싶다 (たい)", "en": "want to do something", "part": "존재·희망·의지", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">~하고 싶다<\/div><div class=\"d\">자신이 하고 싶은 일을 말할 때 쓰는 「たい」. 동사 ます형에 붙이고, い형용사처럼 활용해요.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>구분<\/th><th>형태<\/th><\/tr><\/thead><tbody><tr><td>현재 긍정<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"동사 ます형 + たい\" title=\"눌러서 듣기\">동사 ます형 + たい (食べたい)<\/span><\/td><\/tr><tr><td>현재 부정<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"たくない\" title=\"눌러서 듣기\">たくない (食べたくない)<\/span><\/td><\/tr><tr><td>과거 긍정<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"たかった\" title=\"눌러서 듣기\">たかった (食べたかった)<\/span><\/td><\/tr><tr><td>정중<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"たいです / たくないです / たかったです\" title=\"눌러서 듣기\">たいです / たくないです / たかったです<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>핵심 정리<\/h3><p>동사 ます형의 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ます\" title=\"눌러서 듣기\">「ます」<\/span>를 빼고 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"たい\" title=\"눌러서 듣기\">「たい」<\/span>를 붙이면 '~하고 싶다'가 돼요. <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"たい\" title=\"눌러서 듣기\">「たい」<\/span>는 い형용사처럼 활용합니다.<\/p><ul class=\"rules\"><li>食べます → 食べ<b>たい<\/b> (먹고 싶다)<\/li><li>부정: 食べ<b>たくない<\/b> (먹고 싶지 않다), 과거: 食べ<b>たかった<\/b> (먹고 싶었다)<\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"すしを食べたい。\" title=\"눌러서 듣기\">すしを<ruby>食<rt>た<\/rt><\/ruby>べ<b>たい<\/b>。<\/span><span class=\"rom\">sushi o tabetai<\/span><\/div><\/div><span class=\"k kor\">초밥을 먹고 싶다.<\/span><\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"すしを食べたくない。\" title=\"눌러서 듣기\">すしを<ruby>食<rt>た<\/rt><\/ruby>べ<b>たくない<\/b>。<\/span><span class=\"rom\">sushi o tabetaku nai<\/span><\/div><\/div><span class=\"k kor\">초밥을 먹고 싶지 않다.<\/span><\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"すしを食べたかった。\" title=\"눌러서 듣기\">すしを<ruby>食<rt>た<\/rt><\/ruby>べ<b>たかった<\/b>。<\/span><span class=\"rom\">sushi o tabetakata<\/span><\/div><\/div><span class=\"k kor\">초밥을 먹고 싶었다.<\/span><\/li><\/ul><h3>누구에게 쓸까?<\/h3><ul class=\"rules\"><li>기본적으로 <b>1인칭(나)<\/b>의 희망에 써요.<\/li><li>2인칭에는 질문할 때 쓸 수 있어요. <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"何を食べたいですか\" title=\"눌러서 듣기\">「何を食べたいですか」<\/span><\/li><li>다른 사람의 말을 전할 때도 써요. <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"たいんだって\" title=\"눌러서 듣기\">「～たいんだって」<\/span><\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"田中さんがすしを食べたいんだって。\" title=\"눌러서 듣기\"><ruby>田中<rt>たなか<\/rt><\/ruby>さんがすしを<ruby>食<rt>た<\/rt><\/ruby>べ<b>たい<\/b>んだって。<\/span><span class=\"rom\">tanakasan ga sushi o tabetai n da tte<\/span><\/div><\/div><span class=\"k kor\">다나카 씨가 초밥을 먹고 싶대.<\/span><\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"何を食べたいですか?\" title=\"눌러서 듣기\"><ruby>何<rt>なに<\/rt><\/ruby>を<ruby>食<rt>た<\/rt><\/ruby>べ<b>たい<\/b>ですか?<\/span><span class=\"rom\">nani o tabetai desu ka?<\/span><\/div><\/div><span class=\"k kor\">뭘 먹고 싶어요?<\/span><\/li><\/ul><div class=\"note warn\"><b class=\"lab\">참고<\/b>제3자가 하고 싶어 하는 것은 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"たがる\" title=\"눌러서 듣기\">「たがる」<\/span>(食べたがる)를 써요. 물건을 갖고 싶을 때는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"がほしい\" title=\"눌러서 듣기\">「がほしい」<\/span><a class=\"xref\" href=\"../Lesson13/\">13과 →<\/a>입니다.<\/div><h3>예
