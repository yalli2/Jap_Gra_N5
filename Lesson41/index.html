<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 41, "ja": "なくちゃ", "ko": "~해야 한다 (なくちゃ)", "en": "must do; need to; gotta do", "part": "부탁·권유·허가·금지", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">~해야 한다, ~해야겠다 (회화체 의무)<\/div><div class=\"d\">의무를 나타내는 회화체. ない형의 「い」를 빼고 「くちゃ」를 붙여요.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>끝맺는 형태<\/th><th>뜻<\/th><\/tr><\/thead><tbody><tr><td>なくちゃ<\/td><td>~해야지 / ~해야 해 (가장 간단)<\/td><\/tr><tr><td>なくちゃダメ<\/td><td>~해야 해 (강조)<\/td><\/tr><tr><td>なくちゃいけない / いけません<\/td><td>~해야 한다 / ~해야 합니다<\/td><\/tr><tr><td>なくちゃならない / なりません<\/td><td>~해야 한다 / ~해야 합니다<\/td><\/tr><\/tbody><\/table><\/div><h3>핵심 정리<\/h3><p><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"なくちゃ\" title=\"눌러서 듣기\">「なくちゃ」<\/span>는 '~해야 한다'를 편하게 말하는 회화체예요. 동사의 ない형에서 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"い\" title=\"눌러서 듣기\">「い」<\/span>를 빼고 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"くちゃ\" title=\"눌러서 듣기\">「くちゃ」<\/span>를 붙입니다.<\/p><ul class=\"rules\"><li>食べない → 食べな<s>い<\/s> → 食べ<b>なくちゃ<\/b> (먹어야지!)<\/li><\/ul><h3>끝에 붙여 진지하게<\/h3><ul class=\"rules\"><li><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"なくちゃダメ\" title=\"눌러서 듣기\">「なくちゃダメ」<\/span> / <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"なくちゃいけない\" title=\"눌러서 듣기\">「なくちゃいけない」<\/span> / <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"なくちゃならない\" title=\"눌러서 듣기\">「なくちゃならない」<\/span> 처럼 뒤에 붙이면 더 진지한 느낌이 돼요.<\/li><li>정중하게 말할 때는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"いけません\" title=\"눌러서 듣기\">「いけません」<\/span> <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"なりません\" title=\"눌러서 듣기\">「なりません」<\/span>을 써요.<\/li><\/ul><h3>비슷한 문법<\/h3><ul class=\"rules\"><li><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"なくてはいけない\" title=\"눌러서 듣기\">「なくてはいけない」<\/span><a clas
