<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 31, "ja": "ませんか", "ko": "~하지 않을래요? (ませんか)", "en": "would you; do you want to; shall we~", "part": "부탁·권유·허가·금지", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">~하지 않을래요?, ~하시겠어요?, ~할까요? (권유·부탁)<\/div><div class=\"d\">상대에게 정중하게 권유하거나 부탁할 때 쓰는 「ませんか」.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>앞에 오는 말<\/th><th>붙이는 형태<\/th><\/tr><\/thead><tbody><tr><td>동사 ます형<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"行き + ませんか\" title=\"눌러서 듣기\">行き + ませんか (같이 갈래요?)<\/span><\/td><\/tr><tr><td>부탁 (동사 て형)<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"とっ + てくれませんか\" title=\"눌러서 듣기\">とっ + てくれませんか (찍어 주지 않겠어요?)<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>핵심 정리<\/h3><p>동사 ます형의 부정(ません)에 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"か\" title=\"눌러서 듣기\">「か」<\/span>를 붙인 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ませんか\" title=\"눌러서 듣기\">「ませんか」<\/span>는 '~하지 않을래요?'라고 <b>정중하게 권유<\/b>하는 표현이에요. 직역하면 '~하지 않습니까?'지만 실제로는 '같이 ~할래요?'라는 뜻입니다.<\/p><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"行きませんか。\" title=\"눌러서 듣기\"><ruby>行<rt>い<\/rt><\/ruby>き<b>ませんか<\/b>。<\/span><span class=\"rom\">ikimasen ka<\/span><\/div><\/div><span class=\"k kor\">갈래요? (같이 갈까요?)<\/span><\/li><\/ul><ul class=\"rules\"><li><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ましょう\" title=\"눌러서 듣기\">「ましょう」<\/span><a class=\"xref\" href=\"../Lesson32/\">32과 →<\/a>보다 상대의 의사를 존중하는 부드러운 권유예요.<\/li><li><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"てくれませんか\" title=\"눌러서 듣기\">「～てくれませんか」<\/span>는 '~해 주지 않겠어요?'라는 정중한 부탁 표현이에요. (예문 7·8번)<\/li><\/ul><div class=\"note warn\"><b class=\"lab\">참고<\/b>대답은 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\
