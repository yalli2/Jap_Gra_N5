<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 46, "ja": "ね", "ko": "~네요, ~죠? (ね)", "en": "isn't it? right? eh?", "part": "문말 표현", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">~네요, ~죠?, ~지? (공감·확인의 종조사)<\/div><div class=\"d\">상대에게 동의를 구하거나 공감할 때 문장 끝에 붙이는 「ね」.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>위치<\/th><th>형태<\/th><\/tr><\/thead><tbody><tr><td>문장 끝<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"문장 + ね\" title=\"눌러서 듣기\">문장 + ね (今日は暑いですね)<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>핵심 정리<\/h3><p><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ね\" title=\"눌러서 듣기\">「ね」<\/span>는 문장 끝에 붙어서 '~죠?', '~네요'처럼 <b>상대의 동의나 공감을 구하는<\/b> 종조사예요.<\/p><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"今日はあついですね。\" title=\"눌러서 듣기\"><ruby>今日<rt>きょう<\/rt><\/ruby>はあついです<b>ね<\/b>。<\/span><span class=\"rom\">kyou wa atsui desu ne<\/span><\/div><\/div><span class=\"k kor\">오늘 덥네요. (그렇죠?)<\/span><\/li><\/ul><ul class=\"rules\"><li>일본의 여름에 인사처럼 자주 쓰는 말이에요. (今日は暑いですね)<\/li><li>헤어질 때 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"またね\" title=\"눌러서 듣기\">「またね」<\/span>(또 봐), 약속할 때 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"するね\" title=\"눌러서 듣기\">「～するね」<\/span>(~할게, 알았지?)처럼도 써요.<\/li><\/ul><div class=\"note warn\"><b class=\"lab\">참고<\/b>단정적으로 정보를 전하는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"よ\" title=\"눌러서 듣기\">「よ」<\/span><a class=\"xref\" href=\"../Lesson79/\">79과 →<\/a>와 달리 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ね\" title=\"눌러서 듣기\">「ね」<\/span>는 '우리 같은 생각이죠?'라는 공감의 느낌이 있어요.<\/div><h3>예문 10개<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"かわいいね。\" title=\"눌러서 듣기\">かわいい<b>ね<\/b>。<\/span><span class=\"rom\">kawaii ne<\/span><\/div><\/div><span class=\"k kor\">귀엽네.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"そうですね。\" title=\"눌러서 듣기\">そうです<b>ね<\/b>。<\/span><span class=\"rom\">sou desu ne<\/span><\/div><\/div><span class=\"k kor\">그렇네요.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"今日の天気はいいですね。\" title=\"눌러서 듣기\"><ruby>今日<rt>きょう<\/rt><\/ruby>の<ruby>天気<rt>てんき<\/rt><\/ruby>はいいです<b>ね<\/b>。<\/span><span class=\"rom\">kyou no tenki wa ii desu ne<\/span><\/div><\/div><span class=\"k kor\">오늘 날씨가 좋네요.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"またあとでね!\" title=\"눌러서 듣기\">またあとで<b>ね<\/b>!<\/span><span class=\"rom\">mata ato de ne!<\/span><\/div><\/div><span class=\"k kor\">나중에 봐!<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"またメールするね。\" title=\"눌러서 듣기\">またメールする<b>ね<\/b>。<\/span><span class=\"rom\">mata meeru suru ne<\/span><\/div><\/div><span class=\"k kor\">또 메일할게, 알았지?<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"それは大変ですね。\" title=\"눌러서 듣기\">それは<ruby>大変<rt>たいへん<\/rt><\/ruby>です<b>ね<\/b>。<\/span><span class=\"rom\">sore wa taihen desu ne<\/span><\/div><\/div><span class=\"k kor\">그거 힘들겠네요.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"あなたはとても疲れた声をしているね。\" title=\"눌러서 듣기\">あなたはとても<ruby>疲<rt>つか<\/rt><\/ruby>れた<ruby>声<rt>こえ<\/rt><\/ruby>をしている<b>ね<\/b>。<\/span><span class=\"rom\">anata wa totemo tsukareta koe o shite iru ne<\/span><\/div><\/div><span class=\"k kor\">아주 피곤한 목소리네. (괜찮아?)<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"日本語がお上手ですね。\" title=\"눌러서 듣기\
