<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 68, "ja": "てください", "ko": "~해 주세요 (てください)", "en": "please do", "part": "부탁·권유·허가·금지", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">~해 주세요, ~하세요<\/div><div class=\"d\">상대에게 정중하게 부탁하거나 요청할 때 쓰는 「てください」.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>앞에 오는 말<\/th><th>붙이는 형태<\/th><\/tr><\/thead><tbody><tr><td>동사 て형<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"待っ + てください\" title=\"눌러서 듣기\">待っ + てください (기다려 주세요)<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>핵심 정리<\/h3><p>동사 て형에 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ください\" title=\"눌러서 듣기\">「ください」<\/span>를 붙이면 '~해 주세요'라는 정중한 요청이 돼요.<\/p><ul class=\"rules\"><li>待つ → 待って → 待っ<b>てください<\/b> (기다려 주세요)<\/li><li><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ください\" title=\"눌러서 듣기\">「ください」<\/span>를 생략하고 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"て\" title=\"눌러서 듣기\">「て」<\/span>만 말하면 편한 말투가 돼요. (ちょっと待って!)<\/li><li><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"てみてください\" title=\"눌러서 듣기\">「～てみてください」<\/span>는 '~해 보세요'라는 권유예요. (예문 5번)<\/li><\/ul><div class=\"note warn\"><b class=\"lab\">참고<\/b>반대로 '~하지 말아 주세요'는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ないでください\" title=\"눌러서 듣기\">「ないでください」<\/span><a class=\"xref\" href=\"../Lesson39/\">39과 →<\/a>입니다. 물건을 부탁할 때는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"をください\" title=\"눌러서 듣기\">「をください」<\/span><a class=\"xref\" href=\"../Lesson59/\">59과 →<\/a>를 써요.<\/div><h3>예문 9개<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"ちょっと待ってください。\" title=\"눌러서 듣기\">ちょっと<ruby>待<rt>ま<\/rt><\/ruby>っ<b>てください<\/b>。<\/span><span class=\"rom\">chotto mate kudasai<\/span><\/div><\/div><span class=\"k kor\">잠깐 기다려 주
