<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 72, "ja": "とき", "ko": "~할 때 (とき)", "en": "when; at this time", "part": "시간·상태·정도·비교", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">~할 때, ~일 때<\/div><div class=\"d\">어떤 상황이나 시점을 나타내는 「とき」. 앞에 오는 말에 따라 형태가 달라요.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>앞에 오는 말<\/th><th>붙이는 형태<\/th><\/tr><\/thead><tbody><tr><td>동사 (보통형)<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"行く + とき / 行った + とき\" title=\"눌러서 듣기\">行く + とき / 行った + とき<\/span><\/td><\/tr><tr><td>い형용사<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"眠い + とき\" title=\"눌러서 듣기\">眠い + とき<\/span><\/td><\/tr><tr><td>な형용사<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"暇 + な + とき\" title=\"눌러서 듣기\">暇 + な + とき<\/span><\/td><\/tr><tr><td>명사<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"病気 + の + とき\" title=\"눌러서 듣기\">病気 + の + とき<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>핵심 정리<\/h3><p><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"とき\" title=\"눌러서 듣기\">「とき」<\/span>는 '~할 때'를 뜻해요. 주로 히라가나로 쓰지만 한자 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"時\" title=\"눌러서 듣기\">「時」<\/span>로 쓰기도 해요.<\/p><ul class=\"rules\"><li>앞에 오는 말: 동사·い형용사는 보통형 그대로, <b>な형용사 + な<\/b>, <b>명사 + の<\/b><\/li><li>현재형: 行く<b>とき<\/b> (갈 때), 과거형: 行った<b>とき<\/b> (갔을 때)<\/li><\/ul><div class=\"note warn\"><b class=\"lab\">참고<\/b>현재형(行くとき)은 아직 하지 않은 동작, 과거형(行ったとき)은 이미 끝난 동작에 쓰는 경우가 많아요. <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"とき\" title=\"눌러서 듣기\">「とき」<\/span> 뒤에 「、」를 넣고 쉬는 경우도 많아요.<\/div><h3>예문 10개<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"分からないときは、早く先生に聞きましょうね。\" title=\"눌러서 듣기\"><ruby>分<rt>わ<\/rt><\/ruby>からない<b>とき<\/b>は、<ruby>早<rt>はや<\/rt><\/ruby>く<ruby>先生<rt>せんせい<\/rt><\/ruby>に<ruby>聞<rt>き<\/rt><\/ruby>きましょうね。<\/span><span class=\"rom\">wakaranai toki wa hayaku sensei ni kikimashou ne<\/span><\/div><\/div><span class=\"k kor\">모를 때는 빨리 선생님께 물어봐요.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"道を渡るとき、車に気をつけてください。\" title=\"눌러서 듣기\"><ruby>道<rt>みち<\/rt><\/ruby>を<ruby>渡<rt>わた<\/rt><\/ruby>る<b>とき<\/b>、<ruby>車<rt>くるま<\/rt><\/ruby>に<ruby>気<rt>き<\/rt><\/ruby>をつけてください。<\/span><span class=\"rom\">michi o wataru toki kuruma ni ki o tsukete kudasai<\/span><\/div><\/div><span class=\"k kor\">길을 건널 때 차를 조심하세요.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"時間がないときは、朝ごはんを食べません。\" title=\"눌러서 듣기\"><ruby>時間<rt>じかん<\/rt><\/ruby>がない<b>とき<\/b>は、<ruby>朝<rt>あさ<\/rt><\/ruby>ごはんを<ruby>食<rt>た<\/rt><\/ruby>べません。<\/span><span class=\"rom\">jikan ga nai toki wa asagohan o tabemasen<\/span><\/div><\/div><span class=\"k kor\">시간이 없을 때는 아침밥을 먹지 않습니다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"体の調子が悪いとき、温かいお茶を飲みます。\" title=\"눌러서 듣기\"><ruby>体<rt>からだ<\/rt><\/ruby>の<ruby>調子<rt>ちょうし<\/rt><\/ruby>が<ruby>悪<rt>わる<\/rt><\/ruby>い<b>とき<\/b>、<ruby>温<rt>あたた<\/rt><\/ruby>かいお<ruby>茶<rt>ちゃ<\/rt><\/ruby>を<ruby>飲<rt>の<\/rt><\/ruby>みます。<\/span><span class=\"rom\">karada no choushi ga warui toki atatakai o cha o nomimasu<\/span><\/div><\/div><span class=\"k kor\">몸 상태가 안 좋을 때 따뜻한 차를 마십니다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"眠いとき、いつもチョコレートを食べます。\" title=\"눌러서 듣기\"><ruby>眠<rt>ねむ<\/rt><\/ruby>い<b>とき<\/b>、いつもチョコレートを<ruby>食<rt>た<\/rt><\/ruby>べます。<\/span><span class=\"rom\">nemui toki itsumo chokoreeto o tabemasu<\/span><\/div><\/div><span class=\"k kor\">졸릴 때 항상 초콜릿을 먹습니다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tab
