<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 48, "ja": "にいく", "ko": "~하러 가다 (にいく)", "en": "go to do", "part": "존재·희망·의지", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">~하러 가다, ~하러 갔다 (목적)<\/div><div class=\"d\">목적을 가지고 어딘가에 갈 때 쓰는 「に行く」. 동사 ます형 + に行く.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>앞에 오는 말<\/th><th>붙이는 형태<\/th><\/tr><\/thead><tbody><tr><td>동사 ます형<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"食べ + に行く\" title=\"눌러서 듣기\">食べ + に行く (먹으러 가다)<\/span><\/td><\/tr><tr><td>する동사<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"勉強 + し + に行く\" title=\"눌러서 듣기\">勉強 + し + に行く (공부하러 가다)<\/span><\/td><\/tr><tr><td>과거<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"食べ + に行った\" title=\"눌러서 듣기\">食べ + に行った (먹으러 갔다)<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>핵심 정리<\/h3><p><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"に行く\" title=\"눌러서 듣기\">「に行く」<\/span>는 '~하러 가다'라는 <b>목적<\/b>을 나타내요. 동사 ます형의 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ます\" title=\"눌러서 듣기\">「ます」<\/span>를 빼고 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"に行く\" title=\"눌러서 듣기\">「に行く」<\/span>를 붙입니다.<\/p><ul class=\"rules\"><li>食べます → 食べ + <b>に行く<\/b> = 먹으러 가다<\/li><li><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"に行く\" title=\"눌러서 듣기\">「に行く」<\/span>는 한자를, <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"にいく\" title=\"눌러서 듣기\">「にいく」<\/span>는 히라가나를 써요. 둘 다 같은 뜻입니다.<\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"食べにいく。\" title=\"눌러서 듣기\"><ruby>食<rt>た<\/rt><\/ruby>べ<b>にいく<\/b>。<\/span><span class=\"rom\">tabe ni iku<\/span><\/div><\/div><span class=\"k kor\">먹으러 간다.<\/span><\/li><\/ul><ul class=\"rules\"><li><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"に行ってきます\" title=\"눌러서 듣기\">「に行ってきます」<\/span> = '~하고 올게요' (다녀오는 느낌)<\/li><\/ul><div class=\"note warn\"><b class=\"lab\">참고<\/b>장소로 가는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"に\" title=\"눌러서 듣기\">「に」<\/span>(목적지)와는 달리, 이 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"に\" title=\"눌러서 듣기\">「に」<\/span>는 '~하러'(목적)를 뜻해요. <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"友だちの家に遊びに行く\" title=\"눌러서 듣기\">「友だちの家に遊びに行く」<\/span>에는 두 가지 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"に\" title=\"눌러서 듣기\">「に」<\/span>가 모두 들어 있어요.<\/div><h3>예문 10개<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"友だちの家に遊びに行く。\" title=\"눌러서 듣기\"><ruby>友<rt>とも<\/rt><\/ruby>だちの<ruby>家<rt>いえ<\/rt><\/ruby>に<ruby>遊<rt>あそ<\/rt><\/ruby>び<b>に<ruby>行<rt>い<\/rt><\/ruby>く<\/b>。<\/span><span class=\"rom\">tomodachi no ie ni asobi ni iku<\/span><\/div><\/div><span class=\"k kor\">친구 집에 놀러 간다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"日本に勉強しに行くつもりなのです。\" title=\"눌러서 듣기\"><ruby>日本<rt>にほん<\/rt><\/ruby>に<ruby>勉強<rt>べんきょう<\/rt><\/ruby>し<b>に<ruby>行<rt>い<\/rt><\/ruby>く<\/b>つもりなのです。<\/span><span class=\"rom\">nihon ni benkyou shi ni iku tsumori na no desu<\/span><\/div><\/div><span class=\"k kor\">일본에 공부하러 갈 생각이에요!<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"東京へなにしに行くの?\" title=\"눌러서 듣기\"><ruby>東京<rt>とうきょう<\/rt><\/ruby>へなにし<b>に<ruby>行<rt>い<\/rt><\/ruby>く<\/b>の?<\/span><span class=\"rom\">toukyou hena ni shi ni iku no?<\/span><\/div><\/div><span class=\"k kor\">도쿄에는 뭐 하러 가?<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"私たちは公園にサッカーをしに行くつもりだ。\" title=\"눌러서 듣기\"><ruby>私<rt>わたし<\/rt><\/ruby>たちは<ruby>公園<rt>こうえん<\/rt><\/ruby>にサッカーをし<b>に<ruby>行<rt>い<\/rt><\/ruby>く<\/b>つもりだ。<\/span><span class=\"rom\">watashitachi wa kouen ni sakkaa o shi ni iku tsumori da<\/span><\/div><\/div><span class=\"k kor\">우리는 공원에 축구하러 갈 생각이다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"メキシコへ友だちに会いに行きます。\" title=\"눌러서 듣기\">メキシコへ<ruby>友<rt>とも<\/rt><\/ruby>だちに<ruby>会<rt>あ<\/rt><\/ruby>い<b>に<ruby>行<rt>い<\/rt><\/ruby>きます<\/b>。<\/span><span class=\"rom\">mekishiko e tomodachi ni ai ni ikimasu<\/span><\/div><\/div><span class=\"k kor\">멕시코에 친구를 만나러 갑니다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"ちょっと走りに行ってきます。\" title=\"눌러서 듣기\">ちょっと<ruby>走<rt>はし<\/rt><\/ruby>り<b>に<ruby>行<rt>い<\/rt><\/ruby>ってきます<\/b>。<\/span><span class=\"rom\">chotto hashiri ni ite kimasu<\/span><\/div><\/div><span class=\"k kor\">잠깐 뛰고 올게요.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"明日、友人と一緒に日本食を食べに行きます。\" title=\"눌러서 듣기\"><ruby>明日<rt>あした<\/rt><\/ruby>、<ruby>友人<rt>ゆうじん<\/rt><\/ruby>と<ruby>一緒<rt>いっしょ<\/rt><\/ruby>に<ruby>日本食<rt>にほんしょく<\/rt><\/ruby>を<ruby>食<rt>た<\/rt><\/ruby>べ<b>に<ruby>行<rt>い<\/rt><\/ruby>きます<\/b>。<\/span><span class=\"rom\">ashita yuujin to issho ni nihonshoku o tabe ni ikimasu<\/span><\/div><\/div><span class=\"k kor\">내일 친구와 함께 일본 음식을 먹으러 갑니다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"私は今度はベトナムへ旅行しに行きます。\" title=\"눌러서 듣기\"><ruby>私<rt>わたし<\/rt><\/ruby>は<ruby>今度<rt>こんど<\/rt><\/ruby>はベトナムへ<ruby>旅行<rt>りょこう<\/rt><\/ruby>し<b>に<ruby>行<rt>い<\/rt><\/ruby>きます<\/b>。<\/span><span class=\"rom\">watashi wa kondo wa betonamu e ryokou shi ni ikimasu<\/span><\/div><\/div><span class=\"k kor\">저는 이번에는 베트남으로 여행하러 갑니다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"ゴミを捨てに行きます。\" title=\"눌러서 듣기\">ゴミを<ruby>捨<rt>す<\/r
