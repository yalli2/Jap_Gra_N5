<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 50, "ja": "に/へ", "ko": "~로, ~에 (に/へ 방향)", "en": "to (indicates direction / destination)", "part": "조사", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">~로, ~에 (방향·목적지)<\/div><div class=\"d\">가는 방향이나 목적지를 나타낼 때 「に」와 「へ」는 바꿔 쓸 수 있어요.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>앞에 오는 말<\/th><th>붙이는 형태<\/th><\/tr><\/thead><tbody><tr><td>명사<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"学校 + に / へ + 行く\" title=\"눌러서 듣기\">学校 + に / へ + 行く (학교에 가다)<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>핵심 정리<\/h3><p>목적지·방향을 나타낼 때는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"に\" title=\"눌러서 듣기\">「に」<\/span>와 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"へ\" title=\"눌러서 듣기\">「へ」<\/span>를 <b>자유롭게 바꿔<\/b> 쓸 수 있어요.<\/p><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"学校に行く。\" title=\"눌러서 듣기\"><ruby>学校<rt>がっこう<\/rt><\/ruby><b>に<\/b><ruby>行<rt>い<\/rt><\/ruby>く。<\/span><span class=\"rom\">gakkou ni iku<\/span><\/div><\/div><span class=\"k kor\">학교에 간다.<\/span><\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"学校へ行く。\" title=\"눌러서 듣기\"><ruby>学校<rt>がっこう<\/rt><\/ruby><b>へ<\/b><ruby>行<rt>い<\/rt><\/ruby>く。<\/span><span class=\"rom\">gakkou e iku<\/span><\/div><\/div><span class=\"k kor\">학교로 간다.<\/span><\/li><\/ul><ul class=\"rules\"><li><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"へ\" title=\"눌러서 듣기\">「へ」<\/span>는 발음할 때 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"え\" title=\"눌러서 듣기\">「え(e)」<\/span>로 읽어요. (ヘ가 조사일 때)<\/li><li><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"に\" title=\"눌러서 듣기\">「に」<\/span>에는 '~에(장소·시각)' 등 다른 쓰임도 있어요. <a class=\"xref\" href=\"../Lesson47/\">47과 →<\/a><\/li><\/ul><div class=\"note warn\"><b class=\"lab\">참고<\/b><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"へ\" title=\"눌러서 듣기\">「へ」<\/span>는 방향('~를 향해')의 느낌, <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"に\" title=\"눌러서 듣기\">「に」<\/span>는 도착점('~에 닿는다')의 느낌이 약간 있지만 일상 대화에서는 거의 구별하지 않아요.<\/div><h3>예문 8개<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"日本に戻りたい。\" title=\"눌러서 듣기\"><ruby>日本<rt>にほん<\/rt><\/ruby><b>に<\/b><ruby>戻<rt>もど<\/rt><\/ruby>りたい。<\/span><span class=\"rom\">nihon ni modoritai<\/span><\/div><\/div><span class=\"k kor\">일본에 돌아가고 싶다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"日本に来たことはありますか?\" title=\"눌러서 듣기\"><ruby>日本<rt>にほん<\/rt><\/ruby><b>に<\/b><ruby>来<rt>き<\/rt><\/ruby>たことはありますか?<\/span><span class=\"rom\">nihon ni kita koto wa arimasu ka?<\/span><\/div><\/div><span class=\"k kor\">일본에 온 적이 있습니까?<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"どうやって学校に通っていますか?\" title=\"눌러서 듣기\">どうやって<ruby>学校<rt>がっこう<\/rt><\/ruby><b>に<\/b><ruby>通<rt>かよ<\/rt><\/ruby>っていますか?<\/span><span class=\"rom\">dou yate gakkou ni kayote imasu ka?<\/span><\/div><\/div><span class=\"k kor\">어떻게 학교에 다니고 있어요?<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"今日は仕事に行きたくない。\" title=\"눌러서 듣기\"><ruby>今日<rt>きょう<\/rt><\/ruby>は<ruby>仕事<rt>しごと<\/rt><\/ruby><b>に<\/b><ruby>行<rt>い<\/rt><\/ruby>きたくない。<\/span><span class=\"rom\">kyou wa shigoto ni ikitaku nai<\/span><\/div><\/div><span class=\"k kor\">오늘은 회사에 가고 싶지 않다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"どこへ行ったんですか?\" title=\"눌러서 듣기\">どこ<b>へ<\/b><ruby>行<rt>い<\/rt><\/ruby>ったんですか?<\/span><span class=\"rom\">doko e ita n
