<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 69, "ja": "てはいけない", "ko": "~하면 안 된다 (てはいけない)", "en": "must not; may not; cannot", "part": "부탁·권유·허가·금지", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">~하면 안 된다, ~해서는 안 된다 (금지)<\/div><div class=\"d\">규칙이나 금지를 나타내는 「てはいけない」. 「ちゃいけない」의 정식 표현이에요.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>앞에 오는 말<\/th><th>붙이는 형태<\/th><\/tr><\/thead><tbody><tr><td>동사 て형<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"開け + てはいけない\" title=\"눌러서 듣기\">開け + てはいけない (열면 안 된다)<\/span><\/td><\/tr><tr><td>정중<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"開け + てはいけません\" title=\"눌러서 듣기\">開け + てはいけません (열면 안 됩니다)<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>핵심 정리<\/h3><p><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"てはいけない\" title=\"눌러서 듣기\">「てはいけない」<\/span>는 '~하면 안 된다'라는 <b>금지<\/b>를 나타내요. 규칙, 매너, 법 등에 대해 말할 때 써요.<\/p><ul class=\"rules\"><li>開ける → 開けて → 開け<b>てはいけない<\/b> (열면 안 된다)<\/li><li>정중하게는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"てはいけません\" title=\"눌러서 듣기\">「てはいけません」<\/span><\/li><li>회화체: <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ちゃいけないじゃいけない\" title=\"눌러서 듣기\">「ちゃいけない・じゃいけない」<\/span><a class=\"xref\" href=\"../Lesson1/\">1과 →<\/a>, <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ちゃだめじゃだめ\" title=\"눌러서 듣기\">「ちゃだめ・じゃだめ」<\/span><\/li><\/ul><div class=\"note warn\"><b class=\"lab\">참고<\/b>반대로 '~해도 된다'는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"てもいい\" title=\"눌러서 듣기\">「てもいい」<\/span><a class=\"xref\" href=\"../Lesson70/\">70과 →<\/a>, '~해야 한다'는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"なくてはいけない\" title=\"눌러서 듣기\">「なくてはいけない」<\/span><a class=\"xref\" href=\"../Lesson42/\">42과 →<\/a>입니다.<\/div><h3>예문 10개<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div
