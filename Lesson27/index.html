<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 27, "ja": "まだ", "ko": "아직 (まだ)", "en": "still; not yet", "part": "시간·상태·정도·비교", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">아직, 여전히 / 아직 ~하지 않았다<\/div><div class=\"d\">어떤 상태가 계속되고 있음('아직 ~하고 있다')이나 아직 안 됐음('아직 ~않다')을 나타내는 부사.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>함께 쓰는 말<\/th><th>형태<\/th><\/tr><\/thead><tbody><tr><td>동사 ている<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"まだ + 寝ている\" title=\"눌러서 듣기\">まだ + 寝ている (아직 자고 있다)<\/span><\/td><\/tr><tr><td>동사 ていない<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"まだ + 来ていない\" title=\"눌러서 듣기\">まだ + 来ていない (아직 오지 않았다)<\/span><\/td><\/tr><tr><td>명사<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"まだ + 高校生です\" title=\"눌러서 듣기\">まだ + 高校生です (아직 고등학생이다)<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>핵심 정리<\/h3><p><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"まだ\" title=\"눌러서 듣기\">「まだ」<\/span>는 '아직'이라는 뜻이에요. 동사와 함께도, 명사와 함께도 쓸 수 있어요.<\/p><ul class=\"rules\"><li>계속되는 상태 → <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"まだ+ている\" title=\"눌러서 듣기\">「まだ + ～ている」<\/span> (아직 ~하고 있다)<\/li><li>아직 일어나지 않음 → <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"まだ+ていない\" title=\"눌러서 듣기\">「まだ + ～ていない」<\/span> (아직 ~하지 않았다) <a class=\"xref\" href=\"../Lesson28/\">28과 →<\/a><\/li><\/ul><h3>예<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"まだ寝ているの?\" title=\"눌러서 듣기\"><b>まだ<\/b><ruby>寝<rt>ね<\/rt><\/ruby>ているの?<\/span><span class=\"rom\">mada nete iru no?<\/span><\/div><\/div><span class=\"k kor\">아직도 자고 있어?<\/span><\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"まだ高校生です。\" title=\"눌러서 듣기\
