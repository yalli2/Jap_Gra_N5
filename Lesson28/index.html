<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 28, "ja": "まだ～ていません", "ko": "아직 ~하지 않았다 (まだ～ていません)", "en": "have not yet", "part": "시간·상태·정도·비교", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">아직 ~하지 않았다, 아직 ~하지 못했다<\/div><div class=\"d\">'아직 ~하지 않았다'를 말하는 표현. 「まだ + 동사 て형 + いません」.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>정중함<\/th><th>형태<\/th><\/tr><\/thead><tbody><tr><td>정중<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"まだ + 동사 て형 + いません\" title=\"눌러서 듣기\">まだ + 동사 て형 + いません (まだ食べていません)<\/span><\/td><\/tr><tr><td>보통(반말)<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"まだ + 동사 て형 + いない\" title=\"눌러서 듣기\">まだ + 동사 て형 + いない (まだ食べていない)<\/span><\/td><\/tr><tr><td>회화체<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"まだ + 동사 て형 + ない  ※い 생략\" title=\"눌러서 듣기\">まだ + 동사 て형 + ない (まだ食べてない) ※い 생략<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>핵심 정리<\/h3><p>어떤 일이 아직 끝나지 않았거나 일어나지 않았을 때 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"まだ+ていません\" title=\"눌러서 듣기\">「まだ + ～ていません」<\/span>이라고 말해요.<\/p><ul class=\"rules\"><li>정중한 말: 食べ<b>ていません<\/b><\/li><li>반말: 食べ<b>ていない<\/b><\/li><li>회화체: 食べ<b>てない<\/b> (<span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"い\" title=\"눌러서 듣기\">「い」<\/span>를 생략)<\/li><\/ul><div class=\"note warn\"><b class=\"lab\">참고<\/b>'이미 했다'는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"もう+ました\" title=\"눌러서 듣기\">「もう + ～ました」<\/span><a class=\"xref\" href=\"../Lesson35/\">35과 →<\/a>입니다. <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"まだ\" title=\"눌러서 듣기\">「まだ」<\/span><a class=\"xref\" href=\"../Lesson27/\">27과 →<\/a>와 함께 보세요.<\/div><h3>예문 9개<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"バスはまだ来ていません。\" title=\"눌러서 듣기\">バスは<b>まだ<\/b><ruby>来<rt>き<\/rt><\/ruby><b>ていません<\/b>。<\/span><span class=\"rom\">basu wa mada kite imasen<\/span><\/div><\/div><span class=\"k kor\">버스는 아직 오지 않았습니다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"まだ、決まっていません。\" title=\"눌러서 듣기\"><b>まだ<\/b>、<ruby>決<rt>き<\/rt><\/ruby>まっ<b>ていません<\/b>。<\/span><span class=\"rom\">mada kimate imasen<\/span><\/div><\/div><span class=\"k kor\">아직 결정되지 않았습니다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"私はまだ朝ごはんを食べていません。\" title=\"눌러서 듣기\"><ruby>私<rt>わたし<\/rt><\/ruby>は<b>まだ<\/b><ruby>朝<rt>あさ<\/rt><\/ruby>ごはんを<ruby>食<rt>た<\/rt><\/ruby>べ<b>ていません<\/b>。<\/span><span class=\"rom\">watashi wa mada asagohan o tabete imasen<\/span><\/div><\/div><span class=\"k kor\">저는 아직 아침을 먹지 않았습니다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"今週の新しい単語をまだ覚えていません。\" title=\"눌러서 듣기\"><ruby>今週<rt>こんしゅう<\/rt><\/ruby>の<ruby>新<rt>あたら<\/rt><\/ruby>しい<ruby>単語<rt>たんご<\/rt><\/ruby>を<b>まだ<\/b><ruby>覚<rt>おぼ<\/rt><\/ruby>え<b>ていません<\/b>。<\/span><span class=\"rom\">konshuu no atarashii tango o mada oboete imasen<\/span><\/div><\/div><span class=\"k kor\">이번 주 새 단어를 아직 외우지 못했습니다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"父はまだ帰ってきていない。\" title=\"눌러서 듣기\"><ruby>父<rt>ちち<\/rt><\/ruby>は<b>まだ<\/b><ruby>帰<rt>かえ<\/rt><\/ruby>ってき<b>ていない<\/b>。<\/span><span class=\"rom\">chichi wa mada kaete kite inai<\/span><\/div><\/div><span class=\"k kor\">아버지는 아직 돌아오지 않았다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"まだ宿題をやっていない。\" title=\"눌러서 듣기\"><b>まだ<\/b><ruby>宿題<rt>しゅくだい<\/rt><\/ruby>をやっ<b>ていない<\/b>。<\/span><span class=\"rom\">mada shukudai o yate inai<\/span><\/div><\/div><span class=\"k kor\">아직 숙제를 하지 않았다.<\/span><\/li><li><div cla
