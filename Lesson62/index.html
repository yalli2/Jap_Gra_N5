<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 62, "ja": "たことがある", "ko": "~한 적이 있다 (たことがある)", "en": "to have done something before", "part": "시간·상태·정도·비교", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">~한 적이 있다 / ~한 적이 없다 (경험)<\/div><div class=\"d\">과거의 경험을 말할 때 쓰는 「たことがある」. 동사 た형에 붙여요.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>구분<\/th><th>형태<\/th><\/tr><\/thead><tbody><tr><td>경험 있음<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"동사 た형 + ことがある / ことがあります\" title=\"눌러서 듣기\">동사 た형 + ことがある / ことがあります<\/span><\/td><\/tr><tr><td>경험 없음<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"동사 た형 + ことがない / ことがありません\" title=\"눌러서 듣기\">동사 た형 + ことがない / ことがありません<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>핵심 정리<\/h3><p>동사의 <b>た형<\/b>에 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ことがある\" title=\"눌러서 듣기\">「ことがある」<\/span>를 붙이면 '~한 적이 있다'는 <b>경험<\/b>을 나타내요.<\/p><ul class=\"rules\"><li>見る → 見た → 見<b>たことがある<\/b> (본 적이 있다)<\/li><li>부정은 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"たことがないたことがありません\" title=\"눌러서 듣기\">「たことがない・たことがありません」<\/span> (~한 적이 없다)<\/li><li>회화에서는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"が\" title=\"눌러서 듣기\">「が」<\/span>를 빼고 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"たことある\" title=\"눌러서 듣기\">「たことある」<\/span>라고도 해요. (예문 2·5번)<\/li><\/ul><div class=\"note warn\"><b class=\"lab\">참고<\/b>현재형 동사에 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ことがある\" title=\"눌러서 듣기\">「ことがある」<\/span>를 붙이면 '~할 때도 있다'(빈도)라는 다른 뜻이 돼요. 경험을 말할 때는 반드시 た형을 쓰세요.<\/div><h3>예문 9개<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"これを見たことがある。\" title=\"눌러서 듣기\">これを<ruby>見<rt>み<\/rt><\/ruby><b>たことがある<\/b>。<\/span><span class=\"rom\">kore o mita koto
