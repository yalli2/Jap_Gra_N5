<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 55, "ja": "のが好き", "ko": "~하는 걸 좋아하다 (のが好き)", "en": "to like doing something", "part": "시간·상태·정도·비교", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">~하는 것을 좋아하다<\/div><div class=\"d\">동사 사전형 뒤에 「のが好き」를 붙여 '~하는 걸 좋아한다'고 말해요.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>앞에 오는 말<\/th><th>붙이는 형태<\/th><\/tr><\/thead><tbody><tr><td>동사 (사전형)<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"食べる + のが好き\" title=\"눌러서 듣기\">食べる + のが好き (먹는 걸 좋아하다)<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>핵심 정리<\/h3><p>동사 사전형에 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"のが好き\" title=\"눌러서 듣기\">「のが好き(すき)」<\/span>를 붙이면 '~하는 걸 좋아한다'는 뜻이에요.<\/p><ul class=\"rules\"><li>食べる<b>のが好き<\/b> → 먹는 걸 좋아한다<\/li><li>サッカーをする<b>のが好き<\/b> → 축구하는 걸 좋아한다<\/li><li>한자 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"好き\" title=\"눌러서 듣기\">「好き」<\/span>도 히라가나 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"すき\" title=\"눌러서 듣기\">「すき」<\/span>도 쓰지만 한자가 더 일반적이에요.<\/li><li>부정은 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"のが好きではない好きじゃない\" title=\"눌러서 듣기\">「のが好きではない・好きじゃない」<\/span>입니다. (예문 8·9번)<\/li><\/ul><div class=\"note warn\"><b class=\"lab\">참고<\/b><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"のが上手\" title=\"눌러서 듣기\">「のが上手」<\/span><a class=\"xref\" href=\"../Lesson54/\">54과 →<\/a>·<span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"のが下手\" title=\"눌러서 듣기\">「のが下手」<\/span><a class=\"xref\" href=\"../Lesson53/\">53과 →<\/a>와 같은 형태예요. <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"の\" title=\"눌러서 듣기\">「の」<\/span>가 동사를 명사처럼 만들어 줍니다.<\/div><h3>예문 9개<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"私は寝るのが好きです。\" title=\"눌러서 듣기\"><ruby>私<rt>わたし<\/rt><\/ruby>は<ruby>寝<rt>ね<\/rt><\/ruby>る<b>のが<ruby>好<rt>す<\/rt><\/ruby>き<\/b>です。<\/span><span class=\"rom\">watashi wa neru no ga suki desu<\/span><\/div><\/div><span class=\"k kor\">저는 자는 걸 좋아해요.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"漫画を読むのが好きだ。\" title=\"눌러서 듣기\"><ruby>漫画<rt>まんが<\/rt><\/ruby>を<ruby>読<rt>よ<\/rt><\/ruby>む<b>のが<ruby>好<rt>す<\/rt><\/ruby>き<\/b>だ。<\/span><span class=\"rom\">manga o yomu no ga suki da<\/span><\/div><\/div><span class=\"k kor\">만화책 읽는 걸 좋아한다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"妹は料理をするのが好きです。\" title=\"눌러서 듣기\"><ruby>妹<rt>いもうと<\/rt><\/ruby>は<ruby>料理<rt>りょうり<\/rt><\/ruby>をする<b>のが<ruby>好<rt>す<\/rt><\/ruby>きです。<\/b><\/span><span class=\"rom\">imouto wa ryouri o suru no ga suki desu<\/span><\/div><\/div><span class=\"k kor\">여동생은 요리하는 걸 좋아해요.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"君、運動するのが好きだね。\" title=\"눌러서 듣기\"><ruby>君<rt>きみ<\/rt><\/ruby>、<ruby>運動<rt>うんどう<\/rt><\/ruby>する<b>のが<ruby>好<rt>す<\/rt><\/ruby>き<\/b>だね。<\/span><span class=\"rom\">kimi undou suru no ga suki da ne<\/span><\/div><\/div><span class=\"k kor\">너, 운동하는 거 좋아하는구나.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"彼女は野球の試合を見るのが好きです。\" title=\"눌러서 듣기\"><ruby>彼女<rt>かのじょ<\/rt><\/ruby>は<ruby>野球<rt>やきゅう<\/rt><\/ruby>の<ruby>試合<rt>しあい<\/rt><\/ruby>を<ruby>見<rt>み<\/rt><\/ruby>る<b>のが<ruby>好<rt>す<\/rt><\/ruby>き<\/b>です。<\/span><span class=\"rom\">kanojo wa yakyuu no shiai o miru no ga suki desu<\/span><\/div><\/div><span class=\"k kor\">그녀는 야구 경기를 보는 걸 좋아해요.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"私は何かを食べながら映画を観るのが好きです。\" title=\"눌러서 듣기\"><ruby>私<rt>わたし<\/rt><\/ruby>は<ruby>何<rt>なに<\/rt><\/ruby>かを<ruby>食<r
