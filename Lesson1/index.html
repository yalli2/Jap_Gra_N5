<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 1, "ja": "ちゃいけない・じゃいけない", "ko": "~하면 안 돼 (회화체 금지)", "en": "must not do (spoken Japanese)", "part": "부탁·권유·허가·금지", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">~하면 안 돼, ~해서는 안 돼요 (말할 때 쓰는 편한 표현)<\/div><div class=\"d\">「てはいけない」의 회화체. て형의 て를 ちゃ(で는 じゃ)로 바꿔 '~하면 안 돼'라고 말해요.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>앞의 동사<\/th><th>붙이는 형태<\/th><\/tr><\/thead><tbody><tr><td>동사 て형 (て → ちゃ)<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ちゃダメ / ちゃいけない / ちゃいけません\" title=\"눌러서 듣기\">ちゃダメ / ちゃいけない / ちゃいけません<\/span><\/td><\/tr><tr><td>동사 で형 (で → じゃ)<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"じゃダメ / じゃいけない / じゃいけません\" title=\"눌러서 듣기\">じゃダメ / じゃいけない / じゃいけません<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>핵심 정리<\/h3><p><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ちゃいけない\" title=\"눌러서 듣기\">「ちゃいけない」<\/span>는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"てはいけない\" title=\"눌러서 듣기\">「てはいけない」<\/span><a class=\"xref\" href=\"../Lesson69/\">69과 →<\/a>의 회화체로, \"~하면 안 돼\"라는 금지를 나타냅니다. 친구·가족처럼 편한 사이의 대화에서 자주 써요.<\/p><h3>ちゃ와 じゃ 고르기<\/h3><ul class=\"rules\"><li>동사의 て형에서 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"て\" title=\"눌러서 듣기\">「て」<\/span>를 빼고 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ちゃ\" title=\"눌러서 듣기\">「ちゃ」<\/span>를 붙입니다. たべる → たべて → たべ<b>ちゃ<\/b><\/li><li>て형이 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"で\" title=\"눌러서 듣기\">「で」<\/span>로 끝나면 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"じゃ\" title=\"눌러서 듣기\">「じゃ」<\/span>를 붙입니다. のむ → のんで → のん<b>じゃ<\/b><\/li><\/ul><h3>끝맺는 3가지 형태<\/h3><ul class=\"rules\"><li><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ダメ\" title=\"눌러서 듣기\">「ダメ」<\/span> — 가장 편한 말투 (~하면 안 돼)<\/li><li><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"いけない\" title=\"눌러서 듣기\">「いけない」<\/span> — 편한 말투 (~하면 안 돼)<\/li><li><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"いけません\" title=\"눌러서 듣기\">「いけません」<\/span> — 같은 뜻이지만 더 정중한 말투<\/li><\/ul><div class=\"note warn\"><b class=\"lab\">참고<\/b>더 격식 있게 말하고 싶다면 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"てはいけない\" title=\"눌러서 듣기\">「てはいけない」<\/span>를 쓰세요.<\/div><h3>예문 10개<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"寝る前にスマホを見ちゃダメよ。\" title=\"눌러서 듣기\"><ruby>寝<rt>ね<\/rt><\/ruby>る<ruby>前<rt>まえ<\/rt><\/ruby>にスマホを<ruby>見<rt>み<\/rt><\/ruby><b>ちゃダメ<\/b>よ。<\/span><span class=\"rom\">neru mae ni sumaho o mi cha dame yo<\/span><\/div><\/div><span class=\"k kor\">자기 전에 스마트폰을 보면 안 돼.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"ここはきけんなので、入っちゃダメだよ。\" title=\"눌러서 듣기\">ここはきけんなので、<ruby>入<rt>はい<\/rt><\/ruby>っ<b>ちゃダメ<\/b>だよ。<\/span><span class=\"rom\">koko wa kiken na no de hai cha dame da yo<\/span><\/div><\/div><span class=\"k kor\">여기는 위험하니까 들어가면 안 돼.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"やっちゃいけないことをやっちゃった。\" title=\"눌러서 듣기\">やっ<b>ちゃいけない<\/b>ことをやっちゃった。<\/span><span class=\"rom\">ya cha ikenai koto o ya chata<\/span><\/div><\/div><span class=\"k kor\">해서는 안 될 일을 해 버렸어…<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"自信をなくしちゃいけません!\" title=\"눌러서 듣기\"><ruby>自信<rt>じしん<\/rt><\/ruby>をなくし<b>ちゃいけません<\/b>!<\/span><span class=\"rom\">jishin o nakushi cha ikemasen!<\/span><\/div><\/div><span class=\"k kor\">자신감을 잃으면 안 돼요!<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"そんなに授業をさぼっちゃダメよ。\" title=\"눌러서 듣기\">そんなに<ruby>授業<rt>じゅぎょう<\/rt><\/ruby>をさぼっ<b>ちゃダメ<\/b>よ。<\/spa
