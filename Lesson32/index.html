<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 32, "ja": "ましょう", "ko": "~합시다 (ましょう)", "en": "let's ~; shall we ~", "part": "부탁·권유·허가·금지", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">~합시다, ~하죠 (권유·제안)<\/div><div class=\"d\">함께 무언가를 하자고 제안할 때 쓰는 「ましょう」.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>앞에 오는 말<\/th><th>붙이는 형태<\/th><\/tr><\/thead><tbody><tr><td>동사 ます형<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"行き + ましょう\" title=\"눌러서 듣기\">行き + ましょう (갑시다)<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>핵심 정리<\/h3><p><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ましょう\" title=\"눌러서 듣기\">「ましょう」<\/span>는 동사 ます형의 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ます\" title=\"눌러서 듣기\">「ます」<\/span>를 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ましょう\" title=\"눌러서 듣기\">「ましょう」<\/span>로 바꿔 '~합시다'라고 제안하는 표현이에요.<\/p><ul class=\"rules\"><li>行きます → 行き<b>ましょう<\/b><\/li><li>끝에 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"か\" title=\"눌러서 듣기\">「か」<\/span>를 붙이면 '~할까요?'라는 의문의 제안이 돼요. <a class=\"xref\" href=\"../Lesson33/\">33과 →<\/a><\/li><li><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"よ\" title=\"눌러서 듣기\">「よ」<\/span><a class=\"xref\" href=\"../Lesson79/\">79과 →<\/a>를 붙여 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"行きましょうよ!\" title=\"눌러서 듣기\">「行きましょうよ!」<\/span>라고 하면 '가요, 가자니까요!' 하고 권하는 느낌이 돼요.<\/li><\/ul><div class=\"note warn\"><b class=\"lab\">참고<\/b>좀 더 부드럽게 권유하려면 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ませんか\" title=\"눌러서 듣기\">「ませんか」<\/span><a class=\"xref\" href=\"../Lesson31/\">31과 →<\/a>를 쓰세요.<\/div><h3>예문 10개<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"行きましょう!\" title=\"눌러서 듣기\"><ruby>行<rt>い<\/rt><\/ruby>き<b>ましょう<\/
