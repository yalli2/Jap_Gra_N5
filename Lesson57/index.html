<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 57, "ja": "ので", "ko": "~이기 때문에, ~니까 (ので)", "en": "because of; given that; since", "part": "접속·이유", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">~이기 때문에, ~니까 (객관적인 이유)<\/div><div class=\"d\">이유를 부드럽게 설명하는 「ので」. 명사·な형용사는 「なので」가 돼요.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>앞에 오는 말<\/th><th>붙이는 형태<\/th><\/tr><\/thead><tbody><tr><td>동사<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"行く + ので / 行った + ので\" title=\"눌러서 듣기\">行く + ので / 行った + ので<\/span><\/td><\/tr><tr><td>い형용사<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"暑い + ので\" title=\"눌러서 듣기\">暑い + ので<\/span><\/td><\/tr><tr><td>な형용사<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"きれい + な + ので\" title=\"눌러서 듣기\">きれい + な + ので<\/span><\/td><\/tr><tr><td>명사<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"雨 + な + ので\" title=\"눌러서 듣기\">雨 + な + ので<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>핵심 정리<\/h3><p><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ので\" title=\"눌러서 듣기\">「ので」<\/span>는 <b>행동의 이유<\/b>를 설명할 때 써요. '이유 + ので + 결과(행동)' 순서입니다.<\/p><ul class=\"rules\"><li>동사·い형용사 → 그대로 + ので (과거형도 가능)<\/li><li>な형용사·명사 → <b>な<\/b> + ので (きれいなので)<\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"暑いので水をたくさん飲んでね。\" title=\"눌러서 듣기\"><ruby>暑<rt>あつ<\/rt><\/ruby>い<b>ので<\/b><ruby>水<rt>みず<\/rt><\/ruby>をたくさん<ruby>飲<rt>の<\/rt><\/ruby>んでね。<\/span><span class=\"rom\">atsui no de mizu o takusan nonde ne<\/span><\/div><\/div><span class=\"k kor\">더우니까 물을 많이 마셔.<\/span><\/li><\/ul><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"暑かったのでプールに行った。\" title=\"눌러서 듣기\"><ruby>暑<rt>あつ<\/rt><\/ruby>かった<b>ので<\/b>プールに<ruby>行<rt>い<\/rt><\/ruby>った。<\/span><span class=\"rom\">atsukata no de puuru ni ita<\/span><\/div><\/div><span class=\"k kor\">더웠기 때문에 수영장에 갔다.<\/span><\/li><\/ul><h3><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"から\" title=\"눌러서 듣기\">「から」<\/span>와 비교<\/h3><ul class=\"rules\"><li><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"ので\" title=\"눌러서 듣기\">「ので」<\/span>: 객관적인 원인, 부드럽고 정중한 느낌 (사과·부탁에 좋아요)<\/li><li><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"から\" title=\"눌러서 듣기\">「から」<\/span><a class=\"xref\" href=\"../Lesson23/\">23과 →<\/a>: 말하는 사람의 주관적인 이유, 강하게 들릴 수 있음<\/li><\/ul><div class=\"note warn\"><b class=\"lab\">참고<\/b>이유를 나타내는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"で\" title=\"눌러서 듣기\">「で」<\/span><a class=\"xref\" href=\"../Lesson5/\">5과 →<\/a>와도 비슷해요.<\/div><h3>예문 8개<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"ちょっと寒いので、窓を閉めてもいいですか。\" title=\"눌러서 듣기\">ちょっと<ruby>寒<rt>さむ<\/rt><\/ruby>い<b>ので<\/b>、<ruby>窓<rt>まど<\/rt><\/ruby>を<ruby>閉<rt>し<\/rt><\/ruby>めてもいいですか。<\/span><span class=\"rom\">chotto samui no de mado o shimete mo ii desu ka<\/span><\/div><\/div><span class=\"k kor\">좀 추우니까 창문을 닫아도 될까요?<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"ちょっと用事があるので、先に帰ります。\" title=\"눌러서 듣기\">ちょっと<ruby>用事<rt>ようじ<\/rt><\/ruby>がある<b>ので<\/b>、<ruby>先<rt>さき<\/rt><\/ruby>に<ruby>帰<rt>かえ<\/rt><\/ruby>ります。<\/span><span class=\"rom\">chotto youji ga aru no de saki ni kaerimasu<\/span><\/div><\/div><span class=\"k kor\">잠깐 볼일이 있어서 먼저 돌아가겠습니다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"台風が来るので、明日のクラスに来なくていいです。\" title=\"눌러서 듣기\"><ruby>台風<rt>たいふう<\/rt><\/ruby>が<ruby>来<rt>く<\/rt><\/ruby>る<b>ので<\/b>、<ruby>明日<rt>あした<\/rt><\/ruby>のクラスに<ruby>来<rt>こ<\/rt><\/ruby>なくていいです。<\/span><span class=\"rom\">taifuu ga kuru no de ashita no kurasu ni konakute ii desu<\/span><\/div><\/div><span class=\"k kor\">태풍이 오니까 내일 수업에는 오지 않아도 됩니다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"おなかが痛いので、薬をください。\" title=\"눌러서 듣기\">おなかが<ruby>痛<rt>いた<\/rt><\/ruby>い<b>ので<\/b>、<ruby>薬<rt>くすり<\/rt><\/ruby>をください。<\/span><span class=\"rom\">onaka ga itai no de kusuri o kudasai<\/span><\/div><\/div><span class=\"k kor\">배가 아프니까 약을 주세요.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"彼女がとてもきれいなので、すぐ好きになりました。\" title=\"눌러서 듣기\"><ruby>彼女<rt>かのじょ<\/rt><\/ruby>がとてもきれい<b>なので<\/b>、すぐ<ruby>好<rt>す<\/rt><\/ruby>きになりました。<\/span><span class=\"rom\">kanojo ga totemo kirei na no de sugu suki ni narimashita<\/span><\/div><\/div><span class=\"k kor\">그녀가 아주 예뻐서 금방 좋아하게 되었습니다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"今から行きますので、少々お待ちください。\" title=\"눌러서 듣기\"><ruby>今<rt>いま<\/rt><\/ruby>から<ruby>行<rt>い<\/rt><\/ruby>きます<b>ので<\/b>、<ruby>少々<rt>しょうしょう<\/rt><\/ruby>お<ruby>待<rt>ま<\/rt><\/ruby>ちください。<\/span><span class=\"rom\">ima kara ikimasu no de shoushou o machi kudasai<\/span><\/div><\/div><span class=\"k kor\">지금부터 가니까 잠시만 기다려 주세요.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"雨が降っていたので、試合が中止になりました。\" title=\"눌러서 듣기\"><ruby>雨<rt>あめ<\/rt><\/ruby>が<ruby>降<rt>ふ<\/rt><\/ruby>っていた<b>ので<\/b>、<ruby>試合<rt>しあい<\/rt><\/ruby>が<ruby>中止<rt>ちゅうし<\/rt><\/ruby>になりました。<\/span><span class=\"rom\">ame ga fute ita no de shiai ga chuushi ni narimashita<\/span><\/div><\/div><span class=\"k kor\">비가 내리고 있었기 때문에 시합이 중지되었습니다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"左手で食べようとしたが、難しかったのでやめました。\" title=\"눌러서 듣기\"><ruby>左手<rt>ひだりて<\/rt><\/ruby>で<ruby>食<rt>た<\/rt><\/ruby>べようとしたが、<ruby>難<rt
