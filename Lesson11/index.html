<script>window.TOTAL_LESSONS=80;window.LESSON={"id": 11, "ja": "が", "ko": "~이/가, 그러나 (が)", "en": "subject marker; however; but", "part": "조사", "travel": false, "theory": "<p class=\"tip\">🔊 일본어(점선 밑줄)를 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끄거나 한국어 뜻을 가릴 수 있어요.<\/p><div class=\"mean-card\"><div class=\"m\">~이/가 (주어를 나타냄) / ~하지만 (역접)<\/div><div class=\"d\">주어를 나타내는 「が」와 두 문장을 이어 '~하지만'을 뜻하는 「が」, 두 가지 쓰임을 배워요.<\/div><\/div><h3>접속 방법<\/h3><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>쓰임<\/th><th>형태<\/th><\/tr><\/thead><tbody><tr><td>① 주어 표시<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"주어 + が\" title=\"눌러서 듣기\">주어 + が<\/span><\/td><\/tr><tr><td>② 역접('~하지만')<\/td><td><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"문장1 + が + 문장2\" title=\"눌러서 듣기\">문장1 + が + 문장2<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>① 주어를 나타내는 が<\/h3><p><span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"が\" title=\"눌러서 듣기\">「が」<\/span>는 문장의 주어를 나타내요. 주제를 나타내는 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"は\" title=\"눌러서 듣기\">「は」<\/span><a class=\"xref\" href=\"../Lesson75/\">75과 →<\/a>와 비슷하지만, <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"が\" title=\"눌러서 듣기\">「が」<\/span>는 '그것이 바로 ~이다'처럼 주어 자체에 초점을 둡니다. 좋아하는 대상이나 있다/없다의 대상에도 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"が\" title=\"눌러서 듣기\">「が」<\/span>를 써요.<\/p><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"犬が好きです。\" title=\"눌러서 듣기\"><ruby>犬<rt>いぬ<\/rt><\/ruby><b>が<\/b><ruby>好<rt>す<\/rt><\/ruby>きです。<\/span><span class=\"rom\">inu ga suki desu<\/span><\/div><\/div><span class=\"k kor\">개를 좋아합니다. (좋아하는 대상이 '개')<\/span><\/li><\/ul><p>(예문 1~5번)<\/p><h3>② 역접 — ~하지만<\/h3><p>두 문장 사이에 오면 '그러나, ~하지만'이라는 뜻이 돼요.<\/p><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"私は犬が好きですが、お母さんは好きじゃない。\" title=\"눌러서 듣기\"><ruby>私<rt>わたし<\/rt><\/ruby>は<ruby>犬<rt>いぬ<\/rt><\/ruby>が<ruby>好<rt>す<\/rt><\/ruby>きです<b>が<\/b>、お<ruby>母<rt>かあ<\/rt><\/ruby>さんは<ruby>好<rt>す<\/rt><\/ruby>きじゃない。<\/span><span class=\"rom\">watashi wa inu ga suki desu ga okaasan wa suki ja nai<\/span><\/div><\/div><span class=\"k kor\">저는 개를 좋아하지만 어머니는 좋아하지 않아요.<\/span><\/li><\/ul><p>(예문 6~9번)<\/p><div class=\"note warn\"><b class=\"lab\">참고<\/b>정중하게 말을 꺼낼 때 <span class=\"jt\" role=\"button\" tabindex=\"0\" data-say=\"恐れ入りますが\" title=\"눌러서 듣기\">「恐れ入りますが」<\/span>(죄송합니다만)처럼 쿠션 말로도 자주 쓰여요.<\/div><h3>예문 9개<\/h3><ul class=\"exs\"><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"明日は雨が降る。\" title=\"눌러서 듣기\"><ruby>明日<rt>あした<\/rt><\/ruby>は<ruby>雨<rt>あめ<\/rt><\/ruby><b>が<\/b><ruby>降<rt>ふ<\/rt><\/ruby>る。<\/span><span class=\"rom\">ashita wa ame ga furu<\/span><\/div><\/div><span class=\"k kor\">내일은 비가 온다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"仕方がない。\" title=\"눌러서 듣기\"><ruby>仕方<rt>しかた<\/rt><\/ruby><b>が<\/b>ない。<\/span><span class=\"rom\">shikata ga nai<\/span><\/div><\/div><span class=\"k kor\">어쩔 수 없다. (방법이 없다 — 자주 쓰는 표현)<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"コンビニが近くにあります。\" title=\"눌러서 듣기\">コンビニ<b>が<\/b><ruby>近<rt>ちか<\/rt><\/ruby>くにあります。<\/span><span class=\"rom\">konbini ga chikaku ni arimasu<\/span><\/div><\/div><span class=\"k kor\">편의점이 가까이에 있습니다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"彼は借金がある。\" title=\"눌러서 듣기\"><ruby>彼<rt>かれ<\/rt><\/ruby>は<ruby>借金<rt>しゃっきん<\/rt><\/ruby><b>が<\/b>ある。<\/span><span class=\"rom\">kare wa shakkin ga aru<\/span><\/div><\/div><span class=\"k kor\">그는 빚이 있다.<\/span><\/li><li><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"今日は、やることがたくさんある。\" title=\"눌러서 듣기\"><ruby>今日<rt>きょう<\/r
